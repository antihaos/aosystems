<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON LMS PLAYER</title>

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<!-- Mermaid -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

<!-- Plotly: графики функций 2D/3D -->
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.32.0/plotly.min.js"></script>

<!-- Three.js: 3D-объекты (glb/gltf) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    }
  });
  window.addEventListener('error', function (ev) {
    var errBox = document.getElementById('app');
    if (errBox && errBox.innerHTML.trim() === '') {
      errBox.innerHTML = '<div style="color:#ff2a6d;padding:20px;border:1px solid #ff2a6d;border-radius:8px;font-family:monospace;">Ошибка скрипта: ' + (ev.message || 'неизвестная ошибка') + '</div>';
    }
  });
</script>

<style>
  :root {
    --bg: #0a0e1a;
    --panel: #111627;
    --text: #d5e5ff;
    --muted: #8b9bbf;
    --cyan: #00f0ff;
    --pink: #ff2a6d;
    --green: #05ffa1;
    --purple: #b967ff;
    --yellow: #ffd700;
    --border: rgba(0, 240, 255, 0.25);
    --shadow: 0 0 15px rgba(0,240,255,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: radial-gradient(ellipse at 20% 20%, #141b33 0%, var(--bg) 70%);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    padding: 20px;
    min-height: 100vh;
  }
  #app { max-width: 1200px; margin: 0 auto; }

  .app-header {
    display: flex; align-items: center; gap: 15px; padding: 15px 20px; margin-bottom: 20px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); flex-wrap: wrap;
  }
  .app-header .app-icon { font-size: 2.5em; line-height: 1; animation: glow 2s infinite alternate; }
  @keyframes glow {
    from { text-shadow: 0 0 5px var(--cyan), 0 0 10px var(--cyan); }
    to { text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan); }
  }
  .app-header .app-info { flex: 1; min-width: 200px; }
  .app-header .app-name { font-size: 1.5em; font-weight: bold; color: #fff; text-shadow: 0 0 10px var(--cyan); }
  .app-header .app-description { color: var(--muted); font-size: 0.9em; }
  .app-header .app-version {
    padding: 4px 10px; border: 1px solid var(--cyan); border-radius: 20px;
    background: rgba(0,240,255,0.1); color: var(--cyan); font-size: 0.85em; white-space: nowrap;
  }

  .course-header {
    text-align: center; padding: 40px 20px 30px; margin-bottom: 30px;
    border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: center;
  }
  .course-title-row { display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
  .course-header h1 { font-size: 2.5em; color: #fff; text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan); }
  .course-header .description { color: var(--muted); margin: 10px 0; }
  .badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
  .badge { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: rgba(0,240,255,0.1); color: var(--cyan); font-size: 0.9em; }

  .edit-course-btn {
    background: rgba(0,240,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 6px;
    cursor: pointer; transition: all 0.3s; font-size: 1.5em; line-height: 1; padding: 6px 10px;
    display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px;
  }
  .edit-course-btn:hover { background: rgba(0,240,255,0.2); box-shadow: 0 0 10px rgba(0,240,255,0.3); transform: translateY(-2px); }

  .lessons-nav { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; padding: 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
  .lesson-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--text); cursor: pointer; transition: all 0.3s; font-size: 0.95em; }
  .lesson-btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3); transform: translateY(-2px); }
  .lesson-btn.active { background: rgba(0,240,255,0.15); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 15px rgba(0,240,255,0.4); }
  .lesson-btn.completed { border-color: var(--green); color: var(--green); }
  .lesson-btn.completed:hover { box-shadow: 0 0 10px rgba(5,255,161,0.4); }

  .progress-container { margin: 20px 0; }
  .progress-label { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 5px; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); width: 0%; transition: width 0.4s ease; box-shadow: 0 0 10px var(--cyan); }

  .back-btn { background: transparent; border: 1px solid var(--border); color: var(--cyan); padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; transition: all 0.3s; }
  .back-btn:hover { box-shadow: 0 0 10px rgba(0,240,255,0.3); background: rgba(0,240,255,0.1); transform: translateX(-3px); }

  .block-section { margin: 25px 0; padding: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow), inset 0 0 10px rgba(0,240,255,0.02); }
  .block-section h2 { font-size: 1.8em; color: #fff; text-shadow: 0 0 10px var(--cyan); margin-bottom: 15px; }

  .heading { color: #fff; text-shadow: 0 0 8px var(--purple); }
  .text { margin: 10px 0; }
  .figure { margin: 15px 0; text-align: center; }
  .figure img, .figure video, .figure audio { max-width: 100%; border-radius: 6px; border: 1px solid var(--border); box-shadow: 0 0 12px rgba(0,240,255,0.2); display: block; margin: 0 auto; }
  .figure figcaption { color: var(--muted); font-size: 0.9em; margin-top: 8px; }

  .list { margin: 10px 0 10px 25px; }
  .list li { margin: 5px 0; }

  .code-block { margin: 15px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #0a0c14; }
  .code-header { background: rgba(0,240,255,0.1); padding: 8px 15px; color: var(--cyan); font-family: monospace; font-size: 0.9em; }
  .code-block pre { padding: 15px; overflow-x: auto; }
  .code-block code { color: var(--green); font-family: 'Courier New', monospace; white-space: pre; }

  .callout { margin: 15px 0; padding: 15px; border-left: 4px solid; border-radius: 6px; background: rgba(255,255,255,0.03); }
  .callout-info { border-color: var(--cyan); background: rgba(0,240,255,0.05); }
  .callout-warning { border-color: var(--yellow); background: rgba(255,215,0,0.05); }
  .callout-success { border-color: var(--green); background: rgba(5,255,161,0.05); }
  .callout h4 { color: #fff; margin-bottom: 8px; }

  .tabs { margin: 15px 0; }
  .tab-buttons { display: flex; gap: 5px; flex-wrap: wrap; }
  .tab-button { padding: 10px 18px; background: transparent; border: 1px solid var(--border); border-radius: 6px 6px 0 0; color: var(--text); cursor: pointer; transition: all 0.3s; }
  .tab-button:hover { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3); }
  .tab-button.active { background: rgba(0,240,255,0.15); color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,240,255,0.4); }
  .tab-panel { display: none; padding: 15px; border: 1px solid var(--border); border-radius: 0 0 6px 6px; background: rgba(255,255,255,0.02); }
  .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .accordion { margin: 15px 0; }
  .accordion-item { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.3s; }
  .accordion-item:hover { border-color: var(--cyan); }
  .accordion-header { width: 100%; padding: 12px 18px; background: transparent; color: var(--text); text-align: left; cursor: pointer; font-size: 1em; display: flex; justify-content: space-between; align-items: center; border: none; transition: color 0.3s; }
  .accordion-header:hover { color: var(--cyan); }
  .accordion-header .icon { transition: transform 0.3s; }
  .accordion-item.open .icon { transform: rotate(45deg); }
  .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: rgba(255,255,255,0.02); }
  .accordion-body-inner { padding: 15px; }

  .quiz, .multi-quiz, .match-container, .sort-container, .fill-blank, .poll, .drag-sort { margin: 15px 0; padding: 15px; border: 1px solid var(--border); border-radius: 8px; background: rgba(255,255,255,0.02); }
  .quiz .question, .multi-quiz .question, .poll .question { font-weight: bold; color: #fff; margin-bottom: 10px; }
  .quiz-option, .multi-quiz .option, .poll-option { display: block; margin: 8px 0; padding: 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: all 0.3s; }
  .quiz-option:hover, .multi-quiz .option:hover, .poll-option:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.2); transform: translateX(5px); }
  .quiz-option input, .multi-quiz .option input { margin-right: 10px; accent-color: var(--cyan); }
  .quiz-option.correct { border-color: var(--green); background: rgba(5,255,161,0.1); }
  .quiz-option.wrong { border-color: var(--pink); background: rgba(255,42,109,0.1); }
  .quiz-button, .match-check-btn, .sort-check-btn, .fill-blank-check-btn { margin-top: 15px; padding: 10px 20px; background: rgba(0,240,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 6px; cursor: pointer; transition: all 0.3s; }
  .quiz-button:hover, .match-check-btn:hover, .sort-check-btn:hover, .fill-blank-check-btn:hover { background: rgba(0,240,255,0.2); box-shadow: 0 0 15px rgba(0,240,255,0.4); transform: translateY(-2px); }
  .quiz-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .quiz-feedback, .match-result, .fill-blank-feedback { margin-top: 10px; font-weight: bold; }

  .match-item { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .match-item .term { min-width: 120px; }
  .match-item select { background: #0a0c14; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; cursor: pointer; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
  .match-item select:hover, .match-item select:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
  .sort-list { list-style: none; padding: 0; margin: 10px 0; }
  .sort-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 6px; margin: 5px 0; transition: all 0.2s; }
  .sort-item:hover { background: rgba(255,255,255,0.05); }
  .sort-item span { flex: 1; }
  .sort-controls { display: flex; gap: 4px; }
  .sort-btn { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--border); color: var(--cyan); width: 28px; height: 28px; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 0.9em; }
  .sort-btn:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 8px rgba(0, 240, 255, 0.4); }
  .fill-blank-input { background: #0a0c14; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; text-align: center; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
  .fill-blank-input:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }

  .embed { margin: 15px 0; }
  .embed iframe { width: 100%; height: 400px; border: 1px solid var(--border); border-radius: 8px; }

  .columns { display: flex; gap: 20px; }
  .column { flex: 1; }

  .carousel { position: relative; max-width: 800px; margin: 20px auto; overflow: hidden; border-radius: 8px; border: 1px solid var(--border); }
  .carousel-track { display: flex; transition: transform 0.5s ease; }
  .carousel-slide { min-width: 100%; flex-shrink: 0; box-sizing: border-box; }
  .carousel-slide img { width: 100%; display: block; }
  .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 2em; padding: 0 15px; cursor: pointer; border-radius: 4px; z-index: 10; transition: all 0.3s; }
  .carousel-btn:hover { background: rgba(0,240,255,0.7); color: #000; }
  .carousel-btn.prev { left: 10px; }
  .carousel-btn.next { right: 10px; }
  .carousel-dots { text-align: center; padding: 10px 0; }
  .carousel-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); margin: 0 5px; cursor: pointer; transition: all 0.3s; }
  .carousel-dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

  .before-after { position: relative; max-width: 800px; margin: 20px auto; user-select: none; }
  .before-after img { width: 100%; display: block; }
  .before-after .after { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
  .before-after .after img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .before-after .divider { position: absolute; top: 0; left: 50%; width: 4px; height: 100%; background: #fff; cursor: ew-resize; z-index: 10; }
  .before-after .divider::after { content: '⟷'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 50%; padding: 4px; }

  .table-container { overflow-x: auto; margin: 15px 0; }
  .table-container table { width: 100%; border-collapse: collapse; }
  .table-container th, .table-container td { padding: 10px 15px; border: 1px solid var(--border); text-align: left; }
  .table-container th { background: rgba(0,240,255,0.1); color: var(--cyan); }
  .table-container tr:nth-child(even) { background: rgba(255,255,255,0.03); }

  .chart-container { display: flex; align-items: flex-end; gap: 10px; height: 200px; margin: 20px 0; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 8px; }
  .chart-bar { background: linear-gradient(to top, var(--cyan), var(--green)); border-radius: 4px 4px 0 0; min-width: 30px; position: relative; transition: height 0.3s; }
  .chart-bar span { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 0.8em; }
  .chart-bar-label { text-align: center; margin-top: 5px; font-size: 0.8em; color: var(--muted); }
  .pie-chart { width: 150px; height: 150px; border-radius: 50%; margin: 20px auto; transition: transform 0.3s; }
  .pie-chart:hover { transform: scale(1.05); }
  .pie-legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
  .pie-legend-item { display: flex; align-items: center; gap: 5px; }
  .pie-legend-color { width: 15px; height: 15px; border-radius: 3px; }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.2s ease; }
  .modal-content {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px;
    max-width: 600px; width: 90%; position: relative; box-shadow: 0 0 30px rgba(0,240,255,0.3);
    animation: slideUp 0.3s ease; max-height: 80vh; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text); font-size: 1.5em; cursor: pointer; transition: color 0.3s; }
  .modal-close:hover { color: var(--pink); }
  .modal-open-btn { padding: 8px 16px; background: rgba(0,240,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 6px; cursor: pointer; transition: all 0.3s; }
  .modal-open-btn:hover { background: rgba(0,240,255,0.2); box-shadow: 0 0 10px rgba(0,240,255,0.3); }

  .tooltip { position: relative; display: inline-block; border-bottom: 1px dotted var(--cyan); cursor: help; }
  .tooltip .tooltip-text { visibility: hidden; width: 200px; background: #0a0c14; color: var(--text); text-align: center; border-radius: 6px; padding: 5px; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -100px; opacity: 0; transition: opacity 0.3s; border: 1px solid var(--border); }
  .tooltip:hover .tooltip-text { visibility: visible; opacity: 1; }

  .drag-sort-list { list-style: none; padding: 0; }
  .drag-sort-item { padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; margin: 5px 0; cursor: grab; user-select: none; transition: all 0.2s; }
  .drag-sort-item:hover { background: rgba(255,255,255,0.08); }
  .drag-sort-item.dragging { opacity: 0.5; border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,240,255,0.5); }

  .steps-container { margin: 20px 0; }
  .steps-header { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
  .step-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text); cursor: pointer; transition: all 0.3s; }
  .step-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .step-btn.active { background: rgba(0,240,255,0.15); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3); }
  .step-content { padding: 15px; border: 1px solid var(--border); border-radius: 6px; }

  .progress-tracker { display: flex; gap: 5px; flex-wrap: wrap; margin: 15px 0; }
  .progress-step { padding: 5px 10px; border-radius: 4px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); cursor: pointer; transition: all 0.3s; }
  .progress-step:hover { border-color: var(--cyan); }
  .progress-step.done { background: rgba(5,255,161,0.15); border-color: var(--green); color: var(--green); box-shadow: 0 0 8px rgba(5,255,161,0.3); }

  .mermaid { background: #0a0c14; padding: 10px; border-radius: 8px; overflow-x: auto; }

  .speed-control { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px auto; padding: 4px 8px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 20px; width: fit-content; }
  .speed-control label { font-size: 0.85em; color: var(--muted); }
  .speed-control select { background: #0a0c14; color: var(--text); border: none; border-radius: 12px; padding: 4px 8px; cursor: pointer; outline: none; font-size: 0.9em; transition: box-shadow 0.3s; }
  .speed-control select:hover, .speed-control select:focus { box-shadow: 0 0 8px rgba(0, 240, 255, 0.4); }

  .compare-container { display: flex; align-items: stretch; position: relative; margin: 20px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; user-select: none; }
  .compare-left { flex: 0 0 auto; width: 50%; background: var(--panel); overflow: hidden; padding: 15px; transition: width 0.1s; }
  .compare-right { flex: 1; background: rgba(255, 255, 255, 0.02); padding: 15px; overflow: hidden; }
  .compare-divider { flex: 0 0 4px; background: #fff; cursor: ew-resize; z-index: 10; box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); position: relative; }
  .compare-divider::after { content: '⟷'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 50%; padding: 4px; font-size: 0.8em; }

  .svg-container { margin: 15px 0; text-align: center; }
  .svg-wrapper { display: inline-block; max-width: 100%; overflow: auto; }
  .svg-wrapper svg { width: 100%; height: auto; display: block; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 0 12px rgba(0,240,255,0.2); cursor: zoom-in; }
  .svg-caption { color: var(--muted); font-size: 0.9em; margin-top: 8px; }

  .html-block { margin: 15px 0; padding: 15px; border: 1px solid var(--border); border-radius: 8px; background: rgba(255,255,255,0.02); overflow-x: auto; }
  .html-block > *:first-child { margin-top: 0; }
  .html-block > *:last-child { margin-bottom: 0; }

  .course-manager { margin: 20px 0; padding: 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .saved-course-item { display: flex; gap: 10px; align-items: center; margin: 5px 0; }

  .toggle-manager-btn {
    display: inline-block; padding: 8px 16px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
    border-radius: 6px; cursor: pointer; transition: all 0.3s; margin-bottom: 10px; font-family: inherit; font-size: 0.95em;
  }
  .toggle-manager-btn:hover { background: rgba(0,240,255,0.1); box-shadow: 0 0 10px rgba(0,240,255,0.3); transform: translateY(-2px); }

  /* ---------- ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМА ---------- */
  .mode-toggle {

<script>
(function() {
  const app = document.getElementById('app');

  // ---------- СОСТОЯНИЕ ----------
  let course = null;
  let currentLessonId = null;
  let courseProgress = {};
  try {
    courseProgress = JSON.parse(localStorage.getItem('lms_course_progress') || '{}');
    if (!courseProgress || typeof courseProgress !== 'object') courseProgress = {};
  } catch (e) {
    courseProgress = {};
  }
  let completedLessons = new Set();
  let themeStyleElement = null;

  // Режим редактирования блоков (переключатель)
  let editMode = true;
  try {
    const savedEditMode = localStorage.getItem('lms_edit_mode');
    if (savedEditMode !== null) editMode = savedEditMode === '1';
  } catch (e) {}

  // ---------- INDEXEDDB ----------
  const DB_NAME = 'lms_courses_db';
  const DB_VERSION = 1;
  let db;

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB недоступна')); return; }
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        db = request.result;
        resolve(db);
      };
      request.onupgradeneeded = (event) => {
        const database = event.target.result;
        if (!database.objectStoreNames.contains('courses')) {
          const store = database.createObjectStore('courses', { keyPath: 'id' });
          store.createIndex('title', 'title', { unique: false });
        }
      };
    });
  }

  async function saveCourseToDB(courseData, recordId) {
    if (!db) await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['courses'], 'readwrite');
      const store = tx.objectStore('courses');
      const id = recordId || generateRecordId();
      const record = {
        id: id,
        title: (courseData.meta && courseData.meta.title) || 'Без названия',
        course: courseData
      };
      store.put(record);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function generateRecordId() {
    if (window.crypto && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    return 'course-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
  }

  async function getAllCoursesFromDB() {
    if (!db) await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['courses'], 'readonly');
      const store = tx.objectStore('courses');
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  async function deleteCourseFromDB(id) {
    if (!db) await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['courses'], 'readwrite');
      const store = tx.objectStore('courses');
      store.delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ DOM ----------
  function h(tag, attrs = {}, children = []) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === 'class') el.className = value;
      else if (key === 'textContent') el.textContent = value;
      else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value);
      else if (key === 'disabled') el.disabled = value;
      else if (key === 'dataset') {
        for (const [dataKey, dataValue] of Object.entries(value)) {
          el.dataset[dataKey] = dataValue;
        }
      }
      else el.setAttribute(key, value);
    }
    const childArr = Array.isArray(children) ? children : [children];
    for (const child of childArr) {
      if (child == null) continue;
      el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return el;
  }

  function slugify(text) {
    return String(text == null ? '' : text).toLowerCase().trim().replace(/[^\wа-яё]+/gi, '-').replace(/^-+|-+$/g, '');
  }

  function getCourseKey(courseObj) {
    return (courseObj.meta && courseObj.meta.id) || slugify(courseObj.meta && courseObj.meta.title) || 'default';
  }

  // ---------- ТЕМЫ ----------
  const defaultTheme = {
    bg: '#0a0e1a',
    panel: '#111627',
    text: '#d5e5ff',
    muted: '#8b9bbf',
    cyan: '#00f0ff',
    pink: '#ff2a6d',
    green: '#05ffa1',
    purple: '#b967ff',
    yellow: '#ffd700',
    border: 'rgba(0, 240, 255, 0.25)',
    shadow: '0 0 15px rgba(0,240,255,0.1)'
  };

  function applyTheme(theme) {
    if (!themeStyleElement) {
      themeStyleElement = document.createElement('style');
      document.head.appendChild(themeStyleElement);
    }
    const source = (theme && typeof theme === 'object' && Object.keys(theme).length > 0) ? theme : defaultTheme;
    const vars = {};
    for (const [key, value] of Object.entries(source)) {
      vars[`--${key}`] = value;
    }
    const css = `:root { ${Object.entries(vars).map(([k, v]) => `${k}: ${v};`).join(' ')} }`;
    themeStyleElement.textContent = css;
  }

  // ---------- ОБРАБОТКА КУРСА ----------
  function setCourse(newCourse) {
    course = newCourse;
    if (!course.meta) course.meta = {};
    if (!Array.isArray(course.lessons)) course.lessons = [];
    currentLessonId = null;
    const key = getCourseKey(course);
    completedLessons = new Set(courseProgress[key] || []);
    applyTheme(course.meta.theme || null);
    renderInitialState();
    updateSavedCoursesList();
    if (courseManagerPanel) {
      courseManagerPanel.style.display = 'none';
    }
  }

  async function loadCourseFromObject(courseData, recordId) {
    if (!courseData || typeof courseData !== 'object' || Array.isArray(courseData) || !courseData.meta || !courseData.lessons) {
      throw new Error('Неверный формат курса: требуются поля meta и lessons');
    }
    const id = recordId || generateRecordId();
    courseData.meta._recordId = id;
    await saveCourseToDB(courseData, id);
    setCourse(courseData);
  }

  async function loadCoursesFromData(data) {
    let items = [];

    if (Array.isArray(data)) {
      items = data;
    } else if (data && typeof data === 'object' && data.courses && Array.isArray(data.courses)) {
      items = data.courses;
    } else if (data && data.meta && data.lessons) {
      items = [data];
    } else {
      throw new Error('Неверный формат данных: ожидается курс, массив курсов/URL или объект с полем courses');
    }

    const coursesArray = [];
    const errors = [];

    for (const item of items) {
      if (typeof item === 'string') {
        try {
          const response = await fetch(item);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const courseData = await response.json();
          if (courseData.meta && courseData.lessons) {
            coursesArray.push(courseData);
          } else {
            throw new Error('URL не вернул корректный курс');
          }
        } catch (e) {
          errors.push(`Ошибка загрузки ${item}: ${e.message}`);
        }
      } else if (item && item.meta && item.lessons) {
        coursesArray.push(item);
      } else {
        errors.push(`Неизвестный элемент: ${JSON.stringify(item).substring(0, 100)}`);
      }
    }

    if (coursesArray.length === 0) {
      throw new Error('Нет успешно загруженных курсов');
    }

    for (const courseData of coursesArray) {
      const id = generateRecordId();
      if (!courseData.meta) courseData.meta = {};
      courseData.meta._recordId = id;
      await saveCourseToDB(courseData, id);
    }

    updateSavedCoursesList();
    setCourse(coursesArray[0]);

    return { count: coursesArray.length, errors };
  }

  // ---------- РЕНДЕРИНГ UI ----------
  function renderCourseHeader() {
    if (!course) return null;
    const header = h('header', { class: 'course-header' });

    const titleRow = h('div', { class: 'course-title-row' });
    titleRow.appendChild(h('h1', { textContent: course.meta.title || 'Без названия' }));

    if (editMode) {
      const editBtn = h('button', {
        class: 'edit-course-btn',
        type: 'button',
        title: 'Редактор JSON курса',
        textContent: '✎'
      });
      editBtn.addEventListener('click', () => {
        const recordId = course.meta._recordId || null;
        openJSONEditor(JSON.stringify(cleanCourseForEditor(course), null, 2), {
          title: 'Редактор JSON курса',
          onSave: async (data) => {
            if (Array.isArray(data) || (data && data.courses)) {
              throw new Error('Редактор поддерживает только один курс. Для загрузки нескольких курсов используйте импорт файла или URL.');
            }
            await loadCourseFromObject(data, recordId);
          }
        });
      });
      titleRow.appendChild(editBtn);
    }
    header.appendChild(titleRow);

    if (course.meta.description) {
      header.appendChild(h('p', { class: 'description', textContent: course.meta.description }));
    }
    const badges = h('div', { class: 'badges' });
    if (course.meta.author) badges.appendChild(h('span', { class: 'badge', textContent: 'Автор: ' + course.meta.author }));
    if (course.meta.duration) badges.appendChild(h('span', { class: 'badge', textContent: 'Длительность: ' + course.meta.duration }));
    if (course.meta.level) badges.appendChild(h('span', { class: 'badge', textContent: 'Уровень: ' + course.meta.level }));
    header.appendChild(badges);

    return header;
  }

  function renderLessonsNav() {
    if (!course) return null;
    const nav = h('div', { class: 'lessons-nav' });
    course.lessons.forEach(lesson => {
      const btn = h('button', {
        class: 'lesson-btn' + (lesson.id === currentLessonId ? ' active' : '') + (completedLessons.has(lesson.id) ? ' completed' : ''),
        textContent: lesson.title || lesson.id,
        type: 'button'
      });
      btn.addEventListener('click', () => showLesson(lesson.id));
      nav.appendChild(btn);
    });
    return nav;
  }

  function renderProgress() {
    if (!course) return null;
    const total = course.lessons.length;
    const done = [...completedLessons].filter(id => course.lessons.some(l => l.id === id)).length;
    const percent = total > 0 ? Math.round((done / total) * 100) : 0;
    const container = h('div', { class: 'progress-container' });
    const label = h('div', { class: 'progress-label' });
    label.appendChild(h('span', { textContent: 'Прогресс курса' }));
    label.appendChild(h('span', { textContent: `${done}/${total} (${percent}%)` }));
    const bar = h('div', { class: 'progress-bar' });
    bar.appendChild(h('div', { class: 'progress-fill', style: `width: ${percent}%` }));
    container.appendChild(label);
    container.appendChild(bar);
    return container;
  }

  function renderCourseManager() {
    const manager = h('div', { class: 'course-manager' });
    const title = h('h3', { textContent: 'Управление курсами', class: 'heading' });
    manager.appendChild(title);

    const buttonRow = h('div', { style: 'display:flex; gap:10px; flex-wrap:wrap; margin:10px 0;' });

    const fileInput = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const result = await loadCoursesFromData(data);
        if (result.errors.length > 0) {
          alert(`Загружено курсов: ${result.count}\nОшибки:\n${result.errors.join('\n')}`);
        } else {
          alert(`Загружено курсов: ${result.count}`);
        }
      } catch (err) {
        alert('Ошибка загрузки: ' + err.message);
      }
    });
    const fileBtn = h('button', { class: 'quiz-button', textContent: 'Загрузить из файла', type: 'button' });
    fileBtn.addEventListener('click', () => fileInput.click());
    buttonRow.appendChild(fileInput);
    buttonRow.appendChild(fileBtn);

    const newCourseBtn = h('button', { class: 'quiz-button', textContent: 'Новый курс', type: 'button' });
    newCourseBtn.addEventListener('click', () => {
      const emptyCourse = {
        meta: {
          title: "Новый курс",
          description: "Описание курса",
          author: "",
          duration: "",
          level: "",
          theme: {}
        },
        lessons: [
          {
            id: "lesson-1",
            title: "Урок 1",
            description: "Описание урока",
            blocks: [
              { type: "text", text: "Введите текст..." }
            ]
          }
        ]
      };
      openJSONEditor(JSON.stringify(emptyCourse, null, 2), {
        title: 'Новый курс (редактор JSON)',
        onSave: async (data) => {
          if (Array.isArray(data) || (data && data.courses)) {
            throw new Error('Редактор поддерживает только один курс.');
          }
          await loadCourseFromObject(data, null);
        }
      });
    });
    buttonRow.appendChild(newCourseBtn);

    manager.appendChild(buttonRow);

    const urlRow = h('div', { style: 'display:flex; gap:10px; margin:10px 0;' });
    const urlInput = h('input', { type: 'text', placeholder: 'URL JSON (курс, массив или объект с courses)', class: 'fill-blank-input', style: 'flex:1;' });
    const urlBtn = h('button', { class: 'quiz-button', textContent: 'Загрузить по URL', type: 'button' });
    urlBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return;
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const result = await loadCoursesFromData(data);
        if (result.errors.length > 0) {
          alert(`Загружено курсов: ${result.count}\nОшибки:\n${result.errors.join('\n')}`);
        } else {
          alert(`Загружено курсов: ${result.count}`);
        }
      } catch (err) {
        alert('Ошибка загрузки: ' + err.message);
      }
    });
    urlRow.appendChild(urlInput);
    urlRow.appendChild(urlBtn);
    manager.appendChild(urlRow);

    const savedTitle = h('h4', { textContent: 'Сохранённые курсы:', style: 'margin-top:15px;' });
    manager.appendChild(savedTitle);
    const savedList = h('div', { class: 'saved-courses-list', id: 'savedCoursesList' });
    manager.appendChild(savedList);

    return manager;
  }

  async function updateSavedCoursesList() {
    const listEl = document.getElementById('savedCoursesList');
    if (!listEl) return;
    listEl.innerHTML = '<p class="text">Загрузка списка...</p>';
    try {
      const courses = await getAllCoursesFromDB();
      if (!document.body.contains(listEl)) return;
      if (courses.length === 0) {
        listEl.innerHTML = '<p class="text">Сохранённых курсов нет.</p>';
        return;
      }
      listEl.innerHTML = '';
      courses.forEach(record => {
        const item = h('div', { class: 'saved-course-item' });
        item.appendChild(h('span', { textContent: record.title || 'Без названия', style: 'flex:1;' }));
        const loadBtn = h('button', { class: 'quiz-button', textContent: 'Загрузить', type: 'button' });
        loadBtn.addEventListener('click', () => {
          if (!record.course.meta) record.course.meta = {};
          record.course.meta._recordId = record.id;
          setCourse(record.course);
        });
        const delBtn = h('button', { class: 'quiz-button', textContent: 'Удалить', type: 'button', style: 'background: rgba(255,42,109,0.1); border-color: var(--pink); color: var(--pink);' });
        delBtn.addEventListener('click', async () => {
          if (confirm('Удалить курс "' + (record.title || 'Без названия') + '"?')) {
            try {
              await deleteCourseFromDB(record.id);
              updateSavedCoursesList();
            } catch (e) {
              alert('Ошибка удаления: ' + e.message);
            }
          }
        });
        item.appendChild(loadBtn);
        item.appendChild(delBtn);
        listEl.appendChild(item);
      });
    } catch (e) {
      listEl.innerHTML = '<p class="text">Ошибка загрузки списка.</p>';
      console.error(e);
    }
  }

  // ---------- УНИВЕРСАЛЬНЫЙ РЕДАКТОР JSON (курс/урок) ----------
  function openJSONEditor(initialValue, options = {}) {
    const title = options.title || 'Редактор JSON';
    const editorHeight = options.height || '300px';
    const onSave = options.onSave;

    const overlay = h('div', { class: 'modal-overlay' });
    const content = h('div', { class: 'modal-content' });
    const closeBtn = h('button', { class: 'modal-close', textContent: '×', type: 'button' });
    closeBtn.addEventListener('click', () => overlay.remove());
    content.appendChild(closeBtn);
    content.appendChild(h('h3', { textContent: title, class: 'heading' }));

    const textarea = h('textarea', { style: 'width:100%; height:' + editorHeight + '; background:#0a0c14; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:10px; font-family:monospace;' });
    textarea.value = initialValue || '';
    content.appendChild(textarea);

    const buttonRow = h('div', { style: 'display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;' });
    const saveBtn = h('button', { class: 'quiz-button', textContent: 'Сохранить', type: 'button' });
    saveBtn.addEventListener('click', async () => {
      let data;
      try {
        data = JSON.parse(textarea.value);
      } catch (e) {
        alert('Ошибка JSON: ' + e.message);
        return;
      }
      try {
        if (typeof onSave === 'function') {
          await onSave(data);
        }
        overlay.remove();
      } catch (e) {
        alert('Ошибка сохранения: ' + e.message);
      }
    });
    const cancelBtn = h('button', { class: 'quiz-button', textContent: 'Отмена', type: 'button' });
    cancelBtn.addEventListener('click', () => overlay.remove());
    buttonRow.appendChild(saveBtn);
    buttonRow.appendChild(cancelBtn);
    content.appendChild(buttonRow);

    overlay.appendChild(content);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
    });
  }

  function buildSchemaFor(type) {
    const base = BLOCK_SCHEMAS[type] ? BLOCK_SCHEMAS[type].slice() : [];
    return base.concat(COMMON_SIZE_FIELDS);
  }

  function describeBlock(blk) {
    if (!blk || typeof blk !== 'object') return '?';
    const type = blk.type || '?';
    const preview = blk.title || blk.text || blk.question || blk.caption || blk.label || blk.equation || blk.src || blk.videoId || blk.latex || blk.front || blk.buttonText || blk.instruction || blk.code || '';
    const p = String(preview).substring(0, 50);
    return '[' + type + ']' + (p ? ' ' + p : '');
  }

  // ---------- РЕДАКТОР МАССИВА ВЛОЖЕННЫХ БЛОКОВ ----------
  function createBlocksArrayEditor() {
    const blocksArr = [];
    const wrap = h('div', { class: 'blocks-array-wrap' });
    const listEl = h('div', { class: 'blocks-array-list' });
    const addBtn = h('button', { class: 'array-add-btn', type: 'button', textContent: '＋ Добавить блок' });
    wrap.appendChild(listEl);
    wrap.appendChild(addBtn);

    addBtn.addEventListener('click', () => {
      openBlockFormModal({
        title: 'Новый вложенный блок',
        block: { type: 'text', text: '' },
        onSave: (data) => {
          validateBlockData(data);
          blocksArr.push(JSON.parse(JSON.stringify(data)));
          renderList();
        }
      });
    });

    function renderList() {
      listEl.innerHTML = '';
      if (blocksArr.length === 0) {
        listEl.appendChild(h('p', { class: 'form-hint', textContent: 'Блоки не заданы.' }));
        return;
      }
      blocksArr.forEach((blk, idx) => {
        const row = h('div', { class: 'nested-block-row' });
        row.appendChild(h('span', { class: 'nested-block-info', textContent: (idx + 1) + '. ' + describeBlock(blk) }));
        const btns = h('div', { class: 'nested-block-btns' });
        const editBtn = h('button', { class: 'mini-btn', type: 'button', title: 'Редактировать блок', textContent: '✎' });
        editBtn.addEventListener('click', () => {
          openBlockFormModal({
            title: 'Вложенный блок ' + (idx + 1) + ' (' + (blk.type || 'без типа') + ')',
            block: blk,
            onSave: (data) => {
              validateBlockData(data);
              blocksArr[idx] = JSON.parse(JSON.stringify(data));
              renderList();
            }
          });
        });
        const upBtn = h('button', { class: 'mini-btn', type: 'button', title: 'Переместить выше', textContent: '↑', disabled: idx === 0 });
        upBtn.addEventListener('click', () => {
          const tmp = blocksArr[idx - 1];
          blocksArr[idx - 1] = blocksArr[idx];
          blocksArr[idx] = tmp;
          renderList();
        });
        const downBtn = h('button', { class: 'mini-btn', type: 'button', title: 'Переместить ниже', textContent: '↓', disabled: idx === blocksArr.length - 1 });
        downBtn.addEventListener('click', () => {
          const tmp = blocksArr[idx + 1];
          blocksArr[idx + 1] = blocksArr[idx];
          blocksArr[idx] = tmp;
          renderList();
        });
        const delBtn = h('button', { class: 'mini-btn danger', type: 'button', title: 'Удалить блок', textContent: '🗑' });
        delBtn.addEventListener('click', () => {
          blocksArr.splice(idx, 1);
          renderList();
        });
        btns.appendChild(editBtn);
        btns.appendChild(upBtn);
        btns.appendChild(downBtn);
        btns.appendChild(delBtn);
        row.appendChild(btns);
        listEl.appendChild(row);
      });
    }

    renderList();

    return {
      el: wrap,
      getValue: () => blocksArr.length === 0 ? undefined : blocksArr.map(b => JSON.parse(JSON.stringify(b))),
      setValue: (arr) => {
        blocksArr.length = 0;
        (Array.isArray(arr) ? arr : []).forEach(b => blocksArr.push(JSON.parse(JSON.stringify(b))));
        renderList();
      },
      getStateValue: () => undefined
    };
  }

  // ---------- РЕДАКТОР МАССИВА ЭЛЕМЕНТОВ ----------
  function createArrayEditor(def) {
    const itemSchema = def.itemSchema || { kind: 'string', label: 'Элемент' };
    const wrapperEl = h('div', { class: 'array-editor' });
    const listEl = h('div', { class: 'array-editor-list' });
    wrapperEl.appendChild(listEl);
    const addBtn = h('button', {
      class: 'array-add-btn', type: 'button',
      textContent: '＋ Добавить (' + (itemSchema.label || 'элемент').toLowerCase() + ')'
    });
    wrapperEl.appendChild(addBtn);

    let itemEditors = [];

    function createItemEditor(value) {
      const kind = itemSchema.kind || 'string';

      if (kind === 'number') {
        const input = h('input', { type: 'number' });
        const body = h('div', { class: 'array-item-body' });
        body.appendChild(input);
        const ed = {
          el: body,
          getValue: () => {
            const raw = String(input.value).trim();
            if (raw === '') return undefined;
            const num = Number(raw);
            if (isNaN(num)) throw new Error('ожидается число');
            return num;
          },
          setValue: (v) => { input.value = (v === undefined || v === null) ? '' : String(v); }
        };
        ed.setValue(value);
        return ed;
      }

      if (kind === 'array') {
        const nested = createArrayEditor({
          key: def.key,
          label: itemSchema.label || 'Список',
          itemSchema: itemSchema.itemSchema || { kind: 'string', label: 'Элемент' }
        });
        nested.setValue((value === undefined || value === null) ? [] : value);
        return nested;
      }

      if (kind === 'blocks') {
        const ed = createBlocksArrayEditor();
        ed.setValue((value === undefined || value === null) ? [] : value);
        return ed;
      }

      if (kind === 'object') {
        const body = h('div', { class: 'array-item-body' });
        const subEditors = {};
        const fields = itemSchema.fields || [];
        fields.forEach(f => {
          const ed = createFieldEditor(f);
          body.appendChild(ed.el);
          subEditors[f.key] = ed;
        });
        const ed = {
          el: body,
          getValue: () => {
            const objOut = {};
            fields.forEach(f => {
              const v = subEditors[f.key].getValue();
              if (v !== undefined) objOut[f.key] = v;
            });
            return objOut;
          },
          setValue: (v) => {
            const src = (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
            fields.forEach(f => subEditors[f.key].setValue(src[f.key]));
          }
        };
        ed.setValue(value);
        return ed;
      }

      // string (по умолчанию)
      const input = h('input', { type: 'text' });
      const body = h('div', { class: 'array-item-body' });
      body.appendChild(input);
      const ed = {
        el: body,
        getValue: () => input.value,
        setValue: (v) => {
          if (v === undefined || v === null) input.value = '';
          else if (typeof v === 'object') input.value = JSON.stringify(v);
          else input.value = String(v);
        }
      };
      ed.setValue(value);
      return ed;
    }

    function renderList() {
      listEl.innerHTML = '';
      if (itemEditors.length === 0) {
        listEl.appendChild(h('p', { class: 'form-hint', textContent: 'Список пуст — добавьте элементы кнопкой ниже.' }));
      }
      itemEditors.forEach((ed, idx) => {
        const itemEl = h('div', { class: 'array-item' });
        const head = h('div', { class: 'array-item-header' });
        head.appendChild(h('span', { class: 'array-item-title', textContent: (itemSchema.label || 'Элемент') + ' ' + (idx + 1) }));
        const controls = h('div', { class: 'array-item-controls' });
        const upBtn = h('button', { class: 'mini-btn', type: 'button', title: 'Переместить выше', textContent: '↑', disabled: idx === 0 });
        upBtn.addEventListener('click', () => {
          const tmp = itemEditors[idx - 1];
          itemEditors[idx - 1] = itemEditors[idx];
          itemEditors[idx] = tmp;
          renderList();
        });
        const downBtn = h('button', { class: 'mini-btn', type: 'button', title: 'Переместить ниже', textContent: '↓', disabled: idx === itemEditors.length - 1 });
        downBtn.addEventListener('click', () => {
          const tmp = itemEditors[idx + 1];
          itemEditors[idx + 1] = itemEditors[idx];
          itemEditors[idx] = tmp;
          renderList();
        });
        const delBtn = h('button', { class: 'mini-btn danger', type: 'button', title: 'Удалить элемент', textContent: '🗑' });
        delBtn.addEventListener('click', () => {
          itemEditors.splice(idx, 1);
          renderList();
        });
        controls.appendChild(upBtn);
        controls.appendChild(downBtn);
        controls.appendChild(delBtn);
        head.appendChild(controls);
        itemEl.appendChild(head);
        itemEl.appendChild(ed.el);
        listEl.appendChild(itemEl);
      });
    }

    addBtn.addEventListener('click', () => {
      const kind = itemSchema.kind || 'string';
      const emptyVal = (kind === 'string') ? '' : ((kind === 'number') ? undefined : []);
      itemEditors.push(createItemEditor(emptyVal));
      renderList();
    });

    return {
      el: wrapperEl,
      getValue: () => {
        const out = [];
        for (let i = 0; i < itemEditors.length; i++) {
          let v;
          try {
            v = itemEditors[i].getValue();
          } catch (e) {
            throw new Error((itemSchema.label || 'Элемент') + ' ' + (i + 1) + ': ' + e.message);
          }
          if (v === undefined || v === null) continue;
          if (typeof v === 'string' && v.trim() === '') continue;
          if (Array.isArray(v) && v.length === 0) continue;
          if (typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 0) continue;
          out.push(v);
        }
        return out.length === 0 ? undefined : out;
      },
      setValue: (arr) => {
        itemEditors = [];
        (Array.isArray(arr) ? arr : []).forEach(v => itemEditors.push(createItemEditor(v)));
        renderList();
      },
      getStateValue: () => undefined
    };
  }

  // ---------- ЧТЕНИЕ/ЗАПОЛНЕНИЕ ПРОСТЫХ ПОЛЕЙ ----------
  function readFormField(def, control) {
    if (def.type === 'checkbox') {
      const val = control.checked;
      if (def.omitTrue && val) return undefined;
      if (def.omitFalse && !val) return undefined;
      return val;
    }
    if (def.type === 'number') {
      const raw = String(control.value).trim();
      if (raw === '') return undefined;
      const num = Number(raw);
      if (isNaN(num)) throw new Error('Поле "' + def.key + '": ожидается число');
      return num;
    }
    if (def.type === 'select') {
      return control.value === '' ? undefined : control.value;
    }
    if (def.type === 'json') {
      const raw = String(control.value).trim();
      if (raw === '') return undefined;
      try {
        return JSON.parse(raw);
      } catch (e) {
        throw new Error('Поле "' + def.key + '": некорректный JSON — ' + e.message);
      }
    }
    const val = control.value;
    return val === '' ? undefined : val;
  }

  function fillFormField(def, control, value) {
    const isEmpty = (value === undefined || value === null);
    if (def.type === 'checkbox') {
      control.checked = isEmpty ? !!def.defaultChecked : !!value;
    } else if (def.type === 'number') {
      control.value = isEmpty ? '' : String(value);
    } else if (def.type === 'select') {
      control.value = isEmpty ? '' : String(value);
      if (!isEmpty && control.value === '') {
        const opt = document.createElement('option');
        opt.value = String(value);
        opt.textContent = String(value);
        control.appendChild(opt);
        control.value = String(value);
      }
    } else if (def.type === 'json') {
      control.value = isEmpty ? '' : JSON.stringify(value, null, 2);
    } else {
      if (isEmpty) {
        control.value = '';
      } else if (typeof value === 'object') {
        control.value = JSON.stringify(value);
      } else {
        control.value = String(value);
      }
    }
  }

  // ---------- ФАБРИКА РЕДАКТОРОВ ПОЛЕЙ ФОРМЫ ----------
  function createFieldEditor(def) {
    if (def.type === 'array') {
      const ed = createArrayEditor(def);
      const row = h('div', { class: 'form-field' });
      row.appendChild(h('label', { textContent: def.label }));
      row.appendChild(ed.el);
      return { el: row, getValue: ed.getValue, setValue: ed.setValue, getStateValue: () => undefined };
    }
    if (def.type === 'blocks') {
      const ed = createBlocksArrayEditor();
      const row = h('div', { class: 'form-field' });
      row.appendChild(h('label', { textContent: def.label }));
      row.appendChild(ed.el);
      return { el: row, getValue: ed.getValue, setValue: ed.setValue, getStateValue: () => undefined };
    }

    const row = h('div', { class: 'form-field' });
    let control;
    if (def.type === 'checkbox') {
      const labelRow = h('label', { class: 'checkbox-label' });
      control = h('input', { type: 'checkbox' });
      labelRow.appendChild(control);
      labelRow.appendChild(h('span', { textContent: def.label }));
      row.appendChild(labelRow);
    } else if (def.type === 'select') {
      row.appendChild(h('label', { textContent: def.label }));
      control = h('select');
      control.appendChild(h('option', { value: '', textContent: '(не задано)' }));
      (def.options || []).forEach(o => control.appendChild(h('option', { value: o, textContent: o })));
      row.appendChild(control);
    } else if (def.type === 'textarea' || def.type === 'json') {
      row.appendChild(h('label', { textContent: def.label }));
      control = h('textarea', def.type === 'json' ? { class: 'json-field' } : {});
      row.appendChild(control);
    } else if (def.type === 'number') {
      row.appendChild(h('label', { textContent: def.label }));
      control = h('input', { type: 'number' });
      if (def.min !== undefined) control.min = def.min;
      if (def.max !== undefined) control.max = def.max;
      row.appendChild(control);
    } else {
      row.appendChild(h('label', { textContent: def.label }));
      control = h('input', { type: 'text' });
      row.appendChild(control);
    }
    return {
      el: row,
      getValue: () => readFormField(def, control),
      setValue: (v) => fillFormField(def, control, v),
      getStateValue: () => {
        try { return readFormField(def, control); } catch (e) { return undefined; }
      }
    };
  }

  // ---------- РЕДАКТОР БЛОКА: ФОРМА + JSON ----------
  function openBlockFormModal(options) {
    options = options || {};
    const title = options.title || 'Редактор блока';
    const initial = (options.block && typeof options.block === 'object') ? options.block : { type: 'text', text: '' };
    const onSave = options.onSave;

    const overlay = h('div', { class: 'modal-overlay' });
    const content = h('div', { class: 'modal-content block-editor-modal' });
    const closeBtn = h('button', { class: 'modal-close', textContent: '×', type: 'button' });
    closeBtn.addEventListener('click', () => overlay.remove());
    content.appendChild(closeBtn);
    content.appendChild(h('h3', { textContent: title, class: 'heading' }));

    let currentType = (typeof initial.type === 'string' && initial.type) ? initial.type : 'text';
    let extraData = {};
    let fieldControls = {};
    let formActive = true;

    const tabsRow = h('div', { class: 'editor-tabs' });
    const formTabBtn = h('button', { class: 'editor-tab-btn active', type: 'button', textContent: '📋 Форма' });
    const jsonTabBtn = h('button', { class: 'editor-tab-btn', type: 'button', textContent: '{ } JSON' });
    tabsRow.appendChild(formTabBtn);
    tabsRow.appendChild(jsonTabBtn);
    content.appendChild(tabsRow);

    const formPanel = h('div', { class: 'block-form' });
    const jsonPanel = h('div', { style: 'display:none' });
    const textarea = h('textarea', { class: 'block-json-area', spellcheck: 'false' });
    jsonPanel.appendChild(textarea);
    content.appendChild(formPanel);
    content.appendChild(jsonPanel);

    function collectFormState() {
      const state = {};
      buildSchemaFor(currentType).forEach(def => {
        if (def.section || !def.key) return;
        const editor = fieldControls[def.key];
        if (!editor || typeof editor.getStateValue !== 'function') return;
        try { state[def.key] = editor.getStateValue(); } catch (e) { state[def.key] = undefined; }
      });
      return state;
    }

    function updateVisibility() {
      const state = collectFormState();
      buildSchemaFor(currentType).forEach(def => {
        if (def.section || !def.key) return;
        const editor = fieldControls[def.key];
        if (!editor) return;
        if (typeof def.visible === 'function') {
          let vis = true;
          try { vis = !!def.visible(state); } catch (e) { vis = true; }
          editor.el.style.display = vis ? '' : 'none';
        } else {
          editor.el.style.display = '';
        }
      });
    }

    formPanel.addEventListener('input', updateVisibility);
    formPanel.addEventListener('change', updateVisibility);

    function buildForm(obj) {
      formPanel.innerHTML = '';
      fieldControls = {};

      const typeRow = h('div', { class: 'form-field' });
      typeRow.appendChild(h('label', { textContent: 'type — тип блока (изменяется во вкладке JSON)' }));
      const typeInput = h('input', { type: 'text' });
      typeInput.value = currentType;
      typeInput.readOnly = true;
      typeRow.appendChild(typeInput);
      formPanel.appendChild(typeRow);

      const schema = buildSchemaFor(currentType);
      if (!BLOCK_SCHEMAS[currentType]) {
        formPanel.appendChild(h('p', { class: 'form-hint', textContent: 'Для типа "' + currentType + '" стандартная схема не определена — доступны только общие поля размеров. Остальные атрибуты задайте во вкладке JSON.' }));
      }

      schema.forEach(def => {
        if (def.section) {
          formPanel.appendChild(h('div', { class: 'form-section-title', textContent: def.section }));
          return;
        }
        const editor = createFieldEditor(def);
        formPanel.appendChild(editor.el);
        fieldControls[def.key] = editor;
        editor.setValue(obj ? obj[def.key] : undefined);
      });

      updateVisibility();
    }

    function schemaKeySet(type) {
      const set = new Set();
      buildSchemaFor(type).forEach(d => { if (d.key) set.add(d.key); });
      return set;
    }

    function stateFromParsed(parsed) {
      if (parsed && typeof parsed.type === 'string' && parsed.type) {
        currentType = parsed.type;
      }
      const keys = schemaKeySet(currentType);
      extraData = {};
      Object.keys(parsed).forEach(k => {
        if (k !== 'type' && !keys.has(k)) extraData[k] = parsed[k];
      });
      buildForm(parsed);
    }

    function serializeForm() {
      const result = { type: currentType };
      Object.keys(extraData).forEach(k => { result[k] = extraData[k]; });
      const state = collectFormState();
      buildSchemaFor(currentType).forEach(def => {
        if (def.section || !def.key) return;
        if (typeof def.visible === 'function') {
          let vis = true;
          try { vis = !!def.visible(state); } catch (e) { vis = true; }
          if (!vis) return;
        }
        const editor = fieldControls[def.key];
        if (!editor) return;
        const v = editor.getValue();
        if (v !== undefined) result[def.key] = v;
      });
      return result;
    }

    function showFormTab() {
      formActive = true;
      formPanel.style.display = '';
      jsonPanel.style.display = 'none';
      formTabBtn.classList.add('active');
      jsonTabBtn.classList.remove('active');
    }

    function showJsonTab() {
      formActive = false;
      formPanel.style.display = 'none';
      jsonPanel.style.display = '';
      jsonTabBtn.classList.add('active');
      formTabBtn.classList.remove('active');
    }

    formTabBtn.addEventListener('click', () => {
      if (formActive) return;
      try {
        const parsed = JSON.parse(textarea.value);
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
          throw new Error('ожидается объект блока');
        }
        stateFromParsed(parsed);
      } catch (e) {
        alert('Не удалось разобрать JSON: ' + e.message + '\nИсправьте JSON, прежде чем переходить к форме.');
        return;
      }
      showFormTab();
    });

    jsonTabBtn.addEventListener('click', () => {
      if (!formActive) return;
      let obj;
      try {
        obj = serializeForm();
      } catch (e) {
        alert('Ошибка в полях формы: ' + e.message);
        return;
      }
      textarea.value = JSON.stringify(obj, null, 2);
      showJsonTab();
    });

    stateFromParsed(JSON.parse(JSON.stringify(initial)));
    textarea.value = JSON.stringify(initial, null, 2);

    const buttonRow = h('div', { style: 'display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;' });
    const saveBtn = h('button', { class: 'quiz-button', textContent: 'Сохранить', type: 'button' });
    saveBtn.addEventListener('click', async () => {
      let data;
      if (formActive) {
        try {
          data = serializeForm();
        } catch (e) {
          alert('Ошибка в полях формы: ' + e.message);
          return;
        }
      } else {
        try {
          data = JSON.parse(textarea.value);
        } catch (e) {
          alert('Ошибка JSON: ' + e.message);
          return;
        }
      }
      try {
        if (typeof onSave === 'function') {
          await onSave(data);
        }
        overlay.remove();
      } catch (e) {
        alert('Ошибка сохранения: ' + e.message);
      }
    });
    const cancelBtn = h('button', { class: 'quiz-button', textContent: 'Отмена', type: 'button' });
    cancelBtn.addEventListener('click', () => overlay.remove());
    buttonRow.appendChild(saveBtn);
    buttonRow.appendChild(cancelBtn);
    content.appendChild(buttonRow);

    overlay.appendChild(content);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
    });
  }

  // ---------- РЕДАКТИРОВАНИЕ ОТДЕЛЬНЫХ БЛОКОВ УРОКА ----------
  function cleanCourseForEditor(courseData) {
    const clone = JSON.parse(JSON.stringify(courseData));
    if (clone.meta && clone.meta._recordId) delete clone.meta._recordId;
    return clone;
  }

  async function persistCourse() {
    if (!course.meta) course.meta = {};
    if (!course.meta._recordId) course.meta._recordId = generateRecordId();
    await saveCourseToDB(course, course.meta._recordId);
    updateSavedCoursesList();
  }

  function validateBlockData(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      throw new Error('Блок должен быть JSON-объектом');
    }
    if (!data.type || typeof data.type !== 'string') {
      throw new Error('У блока обязательно поле "type"');
    }
  }

  function ensureLessonBlocks(lesson) {
    if (!Array.isArray(lesson.blocks)) lesson.blocks = [];
    return lesson.blocks;
  }

  function openBlockEditor(lesson, blockIndex) {
    const blocks = ensureLessonBlocks(lesson);
    const block = blocks[blockIndex];
    if (!block) { alert('Блок не найден'); return; }
    openBlockFormModal({
      title: 'Блок ' + (blockIndex + 1) + ' из ' + blocks.length + ' (' + (block.type || 'без типа') + ')',
      block: block,
      onSave: async (data) => {
        validateBlockData(data);
        blocks[blockIndex] = data;
        await persistCourse();
        showLesson(lesson.id);
      }
    });
  }

  function openAddBlockEditor(lesson, insertIndex) {
    const blocks = ensureLessonBlocks(lesson);
    const template = { type: 'text', text: 'Новый текст блока. Отредактируйте меня.' };
    openBlockFormModal({
      title: 'Новый блок (позиция ' + (insertIndex + 1) + ')',
      block: template,
      onSave: async (data) => {
        validateBlockData(data);
        blocks.splice(insertIndex, 0, data);
        await persistCourse();
        showLesson(lesson.id);
      }
    });
  }

  function openLessonEditor(lesson) {
    const lessonCopy = JSON.parse(JSON.stringify(lesson));
    openJSONEditor(JSON.stringify(lessonCopy, null, 2), {
      title: 'Редактор урока: ' + (lesson.title || lesson.id),
      height: '350px',
      onSave: async (data) => {
        if (!data || typeof data !== 'object' || Array.isArray(data)) {
          throw new Error('Урок должен быть JSON-объектом');
        }
        if (!data.id) throw new Error('У урока обязательно поле "id"');
        if (!Array.isArray(data.blocks)) throw new Error('У урока обязательно поле "blocks" (массив)');
        const lessonIdx = course.lessons.findIndex(l => l.id === lesson.id);
        if (lessonIdx === -1) throw new Error('Урок не найден в курсе');
        course.lessons[lessonIdx] = data;
        await persistCourse();
        showLesson(data.id);
      }
    });
  }

  async function moveLessonBlock(lesson, fromIndex, toIndex) {
    const blocks = ensureLessonBlocks(lesson);
    if (toIndex < 0 || toIndex >= blocks.length || fromIndex === toIndex) return;
    const moved = blocks.splice(fromIndex, 1)[0];
    blocks.splice(toIndex, 0, moved);
    try {
      await persistCourse();
    } catch (e) {
      alert('Ошибка сохранения: ' + e.message);
    }
    showLesson(lesson.id);
  }

  async function deleteLessonBlock(lesson, blockIndex) {
    const blocks = ensureLessonBlocks(lesson);
    const block = blocks[blockIndex];
    if (!block) return;
    const label = (block.type || 'блок') + (block.text ? ': "' + String(block.text).substring(0, 40) + '"' : '');
    if (!confirm(`Удалить блок ${blockIndex + 1} (${label})?`)) return;
    blocks.splice(blockIndex, 1);
    try {
      await persistCourse();
    } catch (e) {
      alert('Ошибка сохранения: ' + e.message);
    }
    showLesson(lesson.id);
  }

  function createBlockToolbar(lesson, blockIndex) {
    const total = ensureLessonBlocks(lesson).length;
    const toolbar = h('div', { class: 'block-toolbar' });

    const editBtn = h('button', { class: 'block-tool-btn', type: 'button', title: 'Редактировать блок', textContent: '✎' });
    editBtn.addEventListener('click', (e) => { e.stopPropagation(); openBlockEditor(lesson, blockIndex); });
    toolbar.appendChild(editBtn);

    const upBtn = h('button', { class: 'block-tool-btn', type: 'button', title: 'Переместить выше', textContent: '↑', disabled: blockIndex === 0 });
    upBtn.addEventListener('click', (e) => { e.stopPropagation(); moveLessonBlock(lesson, blockIndex, blockIndex - 1); });
    toolbar.appendChild(upBtn);

    const downBtn = h('button', { class: 'block-tool-btn', type: 'button', title: 'Переместить ниже', textContent: '↓', disabled: blockIndex === total - 1 });
    downBtn.addEventListener('click', (e) => { e.stopPropagation(); moveLessonBlock(lesson, blockIndex, blockIndex + 1); });
    toolbar.appendChild(downBtn);

    const addBtn = h('button', { class: 'block-tool-btn', type: 'button', title: 'Добавить блок после этого', textContent: '＋' });
    addBtn.addEventListener('click', (e) => { e.stopPropagation(); openAddBlockEditor(lesson, blockIndex + 1); });
    toolbar.appendChild(addBtn);

    const delBtn = h('button', { class: 'block-tool-btn danger', type: 'button', title: 'Удалить блок', textContent: '🗑' });
    delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteLessonBlock(lesson, blockIndex); });
    toolbar.appendChild(delBtn);

    return toolbar;
  }

  function renderLessonBlocksEditable(lesson, container) {
    const blocks = ensureLessonBlocks(lesson);
    blocks.forEach((block, idx) => {
      const rendered = renderBlock(block, idx);
      if (!rendered) return;
      const wrapper = h('div', { class: 'block-wrapper' });
      wrapper.appendChild(createBlockToolbar(lesson, idx));
      wrapper.appendChild(rendered);
      container.appendChild(wrapper);
    });
  }

  // ---------- ПРЕВЬЮ ИЗОБРАЖЕНИЙ ----------
  function openImagePreview(src, svgContent, caption, previewWidth, previewHeight) {
    const overlay = h('div', { class: 'modal-overlay image-preview-overlay' });
    const content = h('div', { class: 'image-preview-content' });
    const closeBtn = h('button', { class: 'modal-close', textContent: '×', type: 'button' });
    closeBtn.addEventListener('click', () => overlay.remove());
    content.appendChild(closeBtn);

    if (previewWidth) {
      content.style.maxWidth = previewWidth;
      content.style.width = 'auto';
    }
    if (previewHeight) {
      content.style.maxHeight = previewHeight;
      content.style.height = 'auto';
    }

    if (src) {
      const img = h('img', { src: src, alt: caption || '' });
      content.appendChild(img);
    } else if (svgContent) {
      const div = h('div', { class: 'svg-preview-wrapper' });
      div.innerHTML = svgContent;
      content.appendChild(div);
    }

    if (caption) {
      content.appendChild(h('div', { class: 'preview-caption', textContent: caption }));
    }

    overlay.appendChild(content);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
    });
  }

  // ---------- ПАРСЕР МАТЕМАТИЧЕСКИХ ВЫРАЖЕНИЙ (ДЛЯ ГРАФИКОВ) ----------
  // Имена переменных/параметров чувствительны к регистру (a и A — разные переменные).
  // Функции и константы (sin, cos, pi, e, ...) не зависят от регистра.
  function compileMathExpression(src, allowedVars) {
    const str = String(src).replace(/\s+/g, '');
    if (str === '') throw new Error('пустое выражение');
    let pos = 0;

    const FUNC1 = {
      sin: Math.sin, cos: Math.cos, tan: Math.tan,
      asin: Math.asin, acos: Math.acos, atan: Math.atan,
      sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
      sqrt: Math.sqrt, abs: Math.abs, exp: Math.exp,
      floor: Math.floor, ceil: Math.ceil, round: Math.round, sign: Math.sign,
      ln: (v) => Math.log(v),
      log: (v) => Math.log(v) / Math.LN10
    };
    const FUNC2 = { pow: Math.pow, atan2: Math.atan2, min: Math.min, max: Math.max };
    const CONSTS = { pi: Math.PI, e: Math.E };

    function peek() { return str[pos]; }

    function readName() {
      const start = pos;
      while (pos < str.length && /[a-zA-Z_]/.test(str[pos])) pos++;
      return str.slice(start, pos);
    }

    function findVar(nameRaw) {
      if (allowedVars.indexOf(nameRaw) !== -1) return nameRaw;
      const nameLower = nameRaw.toLowerCase();
      for (let vi = 0; vi < allowedVars.length; vi++) {
        if (allowedVars[vi].toLowerCase() === nameLower) return allowedVars[vi];
      }
      return null;
    }

    function parseExpr() { return parseAdd(); }

    function parseAdd() {
      let node = parseMul();
      while (peek() === '+' || peek() === '-') {
        const op = str[pos++];
        const rhs = parseMul();
        const l = node, r = rhs, o = op;
        node = (env) => o === '+' ? l(env) + r(env) : l(env) - r(env);
      }
      return node;
    }

    function isImplicitMulStart() {
      const c = peek();
      return c !== undefined && /[0-9a-zA-Z_(]/.test(c);
    }

    function parseMul() {
      let node = parseUnary();
      for (;;) {
        const c = peek();
        if (c === '*' || c === '/') {
          const op = str[pos++];
          const rhs = parseUnary();
          const l = node, r = rhs, o = op;
          node = (env) => o === '*' ? l(env) * r(env) : l(env) / r(env);
        } else if (isImplicitMulStart()) {
          const rhs = parseUnary();
          const l = node, r = rhs;
          node = (env) => l(env) * r(env);
        } else {
          break;
        }
      }
      return node;
    }

    function parseUnary() {
      if (peek() === '-') { pos++; const n = parseUnary(); return (env) => -n(env); }
      if (peek() === '+') { pos++; return parseUnary(); }
      return parsePower();
    }

    function parsePower() {
      const base = parseAtom();
      if (peek() === '^') {
        pos++;
        const exp = parseUnary();
        return (env) => Math.pow(base(env), exp(env));
      }
      return base;
    }

    function parseAtom() {
      const c = peek();
      if (c === undefined) throw new Error('неожиданный конец выражения');
      if (c === '(') {
        pos++;
        const node = parseExpr();
        if (peek() !== ')') throw new Error('ожидается ")"');
        pos++;
        return node;
      }
      if (/[0-9.]/.test(c)) {
        const start = pos;
        while (pos < str.length && /[0-9.]/.test(str[pos])) pos++;
        const num = parseFloat(str.slice(start, pos));
        if (isNaN(num)) throw new Error('некорректное число');
        return () => num;
      }
      if (/[a-zA-Z_]/.test(c)) {
        const nameRaw = readName();
        const nameLower = nameRaw.toLowerCase();

        const matchedVar = findVar(nameRaw);
        if (matchedVar !== null) {
          if (peek() === '(') {
            // неявное умножение: переменная * (выражение)
            const rhs = parseAtom();
            return (env) => {
              const v = env[matchedVar];
              const vv = typeof v === 'number' ? v : NaN;
              return vv * rhs(env);
            };
          }
          return (env) => {
            const v = env[matchedVar];
            return typeof v === 'number' ? v : NaN;
          };
        }

        if (peek() === '(') {
          pos++;
          const args = [parseExpr()];
          while (peek() === ',') { pos++; args.push(parseExpr()); }
          if (peek() !== ')') throw new Error('ожидается ")" после аргументов функции');
          pos++;
          if (FUNC2[nameLower]) {
            if (args.length !== 2) throw new Error('функция ' + nameLower + ' требует 2 аргумента');
            const f = FUNC2[nameLower], a0 = args[0], a1 = args[1];
            return (env) => f(a0(env), a1(env));
          }
          if (FUNC1[nameLower]) {
            if (args.length !== 1) throw new Error('функция ' + nameLower + ' требует 1 аргумент');
            const f = FUNC1[nameLower], a0 = args[0];
            return (env) => f(a0(env));
          }
          throw new Error('неизвестная функция: ' + nameLower);
        }
        if (CONSTS.hasOwnProperty(nameLower)) { const v = CONSTS[nameLower]; return () => v; }
        throw new Error('неизвестная переменная: ' + nameRaw);
      }
      throw new Error('неожиданный символ: ' + c);
    }

    const compiled = parseExpr();
    if (pos < str.length) throw new Error('лишние символы в конце выражения');
    return compiled;
  }

  function toNum(v, def) {
    const n = Number(v);
    return isNaN(n) ? def : n;
  }

  function toPointCount(v, def) {
    const n = parseInt(v, 10);
    if (isNaN(n) || n < 2) return def;
    return Math.min(n, 500);
  }

  const PLOTLY_CONFIG = { responsive: true, displaylogo: false };

  function plotlyLayout2d() {
    return {
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(10,12,20,0.6)',
      font: { color: '#d5e5ff' },
      margin: { l: 50, r: 15, t: 15, b: 40 },

      xaxis: { gridcolor: 'rgba(0,240,255,0.15)', zerolinecolor: 'rgba(0,240,255,0.4)' },

  function plotlyLayout3d() {
    return {
      paper_bgcolor: 'rgba(0,0,0,0)',
      font: { color: '#d5e5ff' },
      margin: { l: 0, r: 0, t: 0, b: 0 },
      height: 440,
      scene: {
        bgcolor: 'rgba(10,12,20,0.9)',
        xaxis: { gridcolor: 'rgba(0,240,255,0.2)', color: '#d5e5ff' },
