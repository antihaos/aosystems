btn.addEventListener('click', () => { currentStep = i; renderSteps(); });
stepsHeader.appendChild(btn);
});
stepsContent.innerHTML = '';
if (stepsArr[currentStep]) {
renderBlocks(stepsArr[currentStep].content || [], stepsContent);
}
};
if (stepsArr.length > 0) {
renderSteps();
}
element.appendChild(stepsHeader);
element.appendChild(stepsContent);
break;
}
case 'embed': {
element = h('div', { class: 'embed' });
const embedIframe = h('iframe', { src: block.src, allowfullscreen: '' });
if (block.height) embedIframe.style.height = '100%';
element.appendChild(embedIframe);
break;
}
case 'columns': {
element = h('div', { class: 'columns' });
(Array.isArray(block.columns) ? block.columns : []).forEach(col => {
const colDiv = h('div', { class: 'column' });
renderBlocks(col.blocks || [], colDiv);
element.appendChild(colDiv);
});
break;
}
case 'carousel': {
element = h('div', { class: 'carousel' });
const carouselItems = Array.isArray(block.items) ? block.items : [];
const track = h('div', { class: 'carousel-track' });
const slides = carouselItems.map(item => {
const slide = h('div', { class: 'carousel-slide' });
if (item.content) {
renderBlocks(item.content, slide);
} else if (item.image) {
slide.appendChild(h('img', { src: item.image, alt: item.caption || '' }));
if (item.caption) slide.appendChild(h('div', { class: 'figure', textContent: item.caption }));
}
return slide;
});
slides.forEach(s => track.appendChild(s));
element.appendChild(track);
let currentSlide = 0;
const carouselDots = slides.map((s, i) => h('span', { class: 'carousel-dot' + (i === 0 ? ' active' : '') }));
const updateCarousel = () => {
if (slides.length === 0) return;
track.style.transform = `translateX(-${currentSlide * 100}%)`;
carouselDots.forEach((dot, i) => dot.classList.toggle('active', i === currentSlide));
};
const carouselPrevBtn = h('button', { class: 'carousel-btn prev', textContent: '‹', type: 'button' });
carouselPrevBtn.addEventListener('click', () => {
if (slides.length === 0) return;
currentSlide = (currentSlide - 1 + slides.length) % slides.length;
updateCarousel();
});
element.appendChild(carouselPrevBtn);
const carouselNextBtn = h('button', { class: 'carousel-btn next', textContent: '›', type: 'button' });
carouselNextBtn.addEventListener('click', () => {
if (slides.length === 0) return;
currentSlide = (currentSlide + 1) % slides.length;
updateCarousel();
});
element.appendChild(carouselNextBtn);
const dotsContainer = h('div', { class: 'carousel-dots' });
carouselDots.forEach((dot, dotIdx) => {
dot.addEventListener('click', () => {
currentSlide = dotIdx;
updateCarousel();
});
dotsContainer.appendChild(dot);
});
element.appendChild(dotsContainer);
updateCarousel();
break;
}
case 'before-after': {
element = h('div', { class: 'before-after' });
element.appendChild(h('img', { src: block.before, alt: 'before' }));
const after = h('div', { class: 'after' });
after.appendChild(h('img', { src: block.after, alt: 'after' }));
element.appendChild(after);
const baDivider = h('div', { class: 'divider' });
element.appendChild(baDivider);
setupDrag(baDivider, element, (x) => {
const rect = element.getBoundingClientRect();
const pos = Math.max(0, Math.min(x - rect.left, rect.width));
after.style.width = pos + 'px';
baDivider.style.left = pos + 'px';
});
break;
}
case 'table': {
element = h('div', { class: 'table-container' });
const table = h('table');
const thead = h('thead');
const headerRow = h('tr');
(Array.isArray(block.headers) ? block.headers : []).forEach(hd => headerRow.appendChild(h('th', { textContent: hd != null ? String(hd) : '' })));
thead.appendChild(headerRow);
table.appendChild(thead);
const tbody = h('tbody');
(Array.isArray(block.rows) ? block.rows : []).forEach(row => {
const tr = h('tr');
(Array.isArray(row) ? row : []).forEach(cell => tr.appendChild(h('td', { textContent: cell != null ? String(cell) : '' })));
tbody.appendChild(tr);
});
table.appendChild(tbody);
element.appendChild(table);
break;
}
case 'chart': {
element = h('div', { class: 'chart-block' });
if (block.title) element.appendChild(h('h4', { textContent: block.title, class: 'heading' }));
const chart = h('div', { class: 'chart-container' });
const chartValues = Array.isArray(block.values) ? block.values : [];
const chartLabels = Array.isArray(block.labels) ? block.labels : [];
const max = Math.max(...chartValues, 1);
chartValues.forEach((val, i) => {
const barWrap = h('div', { style: 'display: flex; flex-direction: column; align-items: center; flex: 1;' });
const bar = h('div', { class: 'chart-bar', style: `height: ${Math.max(2, (val / max) * 150)}px;` });
bar.appendChild(h('span', { textContent: String(val) }));
barWrap.appendChild(bar);
barWrap.appendChild(h('div', { class: 'chart-bar-label', textContent: chartLabels[i] != null ? String(chartLabels[i]) : '' }));
chart.appendChild(barWrap);
});
element.appendChild(chart);
break;
}
case 'pie': {
element = h('div', { class: 'pie-block' });
if (block.title) element.appendChild(h('h4', { textContent: block.title, class: 'heading' }));
const pieSegments = Array.isArray(block.segments) ? block.segments : [];
const total = pieSegments.reduce((sum, seg) => sum + (Number(seg.value) || 0), 0) || 1;
let cumulative = 0;
const gradientStops = pieSegments.map(seg => {
const segValue = Number(seg.value) || 0;
const start = (cumulative / total) * 100;
cumulative += segValue;
const end = (cumulative / total) * 100;
return `${seg.color || '#00f0ff'} ${start}% ${end}%`;
}).join(', ');
const pie = h('div', { class: 'pie-chart', style: `background: conic-gradient(${gradientStops});` });
element.appendChild(pie);
const legend = h('div', { class: 'pie-legend' });
pieSegments.forEach(seg => {
const item = h('div', { class: 'pie-legend-item' });
item.appendChild(h('div', { class: 'pie-legend-color', style: `background: ${seg.color || '#00f0ff'};` }));
item.appendChild(h('span', { textContent: `${seg.label || 'Без названия'} (${seg.value}%)` }));
legend.appendChild(item);
});
element.appendChild(legend);
break;
}
case 'modal': {
element = h('div', { class: 'modal-block' });
const modalOpenBtn = h('button', { class: 'modal-open-btn', textContent: block.buttonText || 'Открыть', type: 'button' });
element.appendChild(modalOpenBtn);
modalOpenBtn.addEventListener('click', () => {
const overlay = h('div', { class: 'modal-overlay' });
const content = h('div', { class: 'modal-content' });
const closeBtn = h('button', { class: 'modal-close', textContent: '×', type: 'button' });
closeBtn.addEventListener('click', () => overlay.remove());
content.appendChild(closeBtn);
if (block.content) renderBlocks(block.content, content);
else if (block.text) content.appendChild(h('p', { textContent: block.text }));
overlay.appendChild(content);
document.body.appendChild(overlay);
postProcess(content);
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
});
break;
}
case 'tooltip': {
element = h('span', { class: 'tooltip', textContent: block.text != null ? String(block.text) : '' });
element.appendChild(h('span', { class: 'tooltip-text', textContent: block.tooltipText != null ? String(block.tooltipText) : '' }));
break;
}
case 'mermaid':
element = h('div', { class: 'mermaid', textContent: block.code != null ? String(block.code) : '' });
break;
case 'svg': {
element = h('div', { class: 'svg-container' });
const svgWrapper = h('div', { class: 'svg-wrapper' });
svgWrapper.innerHTML = block.code != null ? String(block.code) : '';
const svgElement = svgWrapper.querySelector('svg');
if (svgElement) {
svgElement.style.cursor = 'zoom-in';
svgElement.addEventListener('click', () => openImagePreview(null, block.code, block.caption, block.previewWidth, block.previewHeight));
}
element.appendChild(svgWrapper);
if (block.caption) element.appendChild(h('div', { class: 'svg-caption', textContent: block.caption }));
break;
}
case 'html':
element = h('div', { class: 'html-block' });
element.innerHTML = block.code != null ? String(block.code) : '';
break;
case 'drag-sort': {
element = h('div', { class: 'drag-sort' });
if (block.instruction) element.appendChild(h('p', { class: 'text', textContent: block.instruction }));
const dragList = h('ul', { class: 'drag-sort-list' });
let dragItems = [...(Array.isArray(block.items) ? block.items : [])];
const renderDragList = () => {
dragList.innerHTML = '';
dragItems.forEach((item, index) => {
const li = h('li', { class: 'drag-sort-item', draggable: 'true', textContent: item != null ? String(item) : '', dataset: { index: index } });
li.addEventListener('dragstart', (e) => {
li.classList.add('dragging');
e.dataTransfer.setData('text/plain', index.toString());
});
li.addEventListener('dragend', () => li.classList.remove('dragging'));
li.addEventListener('dragover', (e) => e.preventDefault());
li.addEventListener('drop', (e) => {
e.preventDefault();
const fromIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
const toIndex = index;
if (!isNaN(fromIndex) && fromIndex !== toIndex && fromIndex >= 0 && fromIndex < dragItems.length) {
const [moved] = dragItems.splice(fromIndex, 1);
dragItems.splice(toIndex, 0, moved);
renderDragList();
}
});
dragList.appendChild(li);
});
};
renderDragList();
element.appendChild(dragList);
const dragCheckBtn = h('button', { class: 'sort-check-btn', textContent: 'Проверить', type: 'button' });
const dragResult = h('div', { class: 'match-result' });
dragCheckBtn.addEventListener('click', () => {
if (!Array.isArray(block.correctOrder)) {
dragResult.textContent = 'Правильный порядок не задан.';
dragResult.style.color = 'var(--yellow)';
return;
}
const isCorrect = JSON.stringify(dragItems) === JSON.stringify(block.correctOrder);
dragResult.textContent = isCorrect ? 'Правильный порядок!' : 'Неправильно.';
dragResult.style.color = isCorrect ? 'var(--green)' : 'var(--pink)';
});
element.appendChild(dragCheckBtn);
element.appendChild(dragResult);
break;
}
case 'progress-tracker': {
element = h('div', { class: 'progress-tracker' });
(Array.isArray(block.tasks) ? block.tasks : []).forEach(task => {
const step = h('div', { class: 'progress-step', textContent: task.label != null ? String(task.label) : '' });
step.addEventListener('click', () => step.classList.toggle('done'));
element.appendChild(step);
});
break;
}
case 'graph':
element = renderGraphBlock(block);
break;
case 'model3d':
element = renderModel3DBlock(block);
break;
case 'flashcards':
element = renderFlashcardsBlock(block);
break;
case 'checklist':
element = renderChecklistBlock(block);
break;
case 'quote':
element = renderQuoteBlock(block);
break;
case 'glossary':
element = renderGlossaryBlock(block);
break;
case 'equation':
element = renderEquationBlock(block);
break;
case 'youtube':
element = renderYouTubeBlock(block);
break;
case 'kanban':
element = renderKanbanBlock(block);
break;
case 'stats':
element = renderStatsBlock(block);
break;
case 'countdown':
element = renderCountdownBlock(block);
break;
case 'tree':
element = renderTreeBlock(block);
break;
case 'truefalse':
element = renderTrueFalseBlock(block);
break;
case 'divider':
element = renderDividerBlock(block);
break;
case 'download':
element = renderDownloadBlock(block);
break;
case 'hotspots':
element = renderHotspotsBlock(block);
break;
case 'crossword':
element = renderCrosswordBlock(block);
break;
default:
console.warn('Unknown block type:', block.type);
element = null;
}
if (element) {
if (block.type === 'image' || block.type === 'video' || block.type === 'audio') {
const mediaEl = element.querySelector('img, video, audio');
if (mediaEl) applySizing(block, mediaEl, true);
} else if (block.type === 'svg') {
const svgEl = element.querySelector('svg');
if (svgEl) applySizing(block, svgEl, true);
else applySizing(block, element, false);
} else if (block.type !== 'youtube') {
applySizing(block, element, false);
}
}
return element;
}
async function init() {
await openDB().catch(e => console.warn('IndexedDB не доступна', e));
createCanvasFab();
renderInitialState();
const urlParams = new URLSearchParams(window.location.search);
const autoUrl = urlParams.get('url') || urlParams.get('source') || urlParams.get('course');
if (autoUrl) {
try {
const response = await fetch(autoUrl);
if (!response.ok) throw new Error(`HTTP ${response.status}`);
const data = await response.json();
const result = await loadCoursesFromData(data);
console.log(`Автозагрузка: загружено курсов ${result.count}`);
if (result.errors.length > 0) {
console.warn('Ошибки при автозагрузке:', result.errors);
}
} catch (err) {
console.error('Ошибка автозагрузки:', err);
alert('Ошибка автозагрузки курса: ' + err.message);
}
}
}
init().catch(e => {
console.error('Критическая ошибка инициализации:', e);
if (app && app.innerHTML.trim() === '') {
app.innerHTML = '<div style="color:#ff2a6d;padding:20px;border:1px solid #ff2a6d;border-radius:8px;font-family:monospace;">Критическая ошибка: ' + (e && e.message ? e.message : String(e)) + '</div>';
}
});
})();
</script>
