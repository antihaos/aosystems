<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON LMS PLAYER</title>

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<!-- Mermaid -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
  });
</script>

<style>
  :root {
    --bg: #0a0e1a;
    --panel: #111627;
    --text: #d5e5ff;
    --muted: #8b9bbf;
    --cyan: #00f0ff;
    --pink: #ff2a6d;
    --green: #05ffa1;
    --purple: #b967ff;
    --yellow: #ffd700;
    --border: rgba(0, 240, 255, 0.25);
    --shadow: 0 0 15px rgba(0,240,255,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: radial-gradient(ellipse at 20% 20%, #141b33 0%, var(--bg) 70%);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    padding: 20px;
    min-height: 100vh;
  }
  #app { max-width: 1200px; margin: 0 auto; }

  /* Шапка курса */
  .course-header {
    text-align: center;
    padding: 40px 20px 30px;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .course-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
  }
  .course-header h1 {
    font-size: 2.5em;
    color: #fff;
    text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan);
  }
  .course-header .description { color: var(--muted); margin: 10px 0; }
  .badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
  .badge { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: rgba(0,240,255,0.1); color: var(--cyan); font-size: 0.9em; }

  /* Кнопка редактора (иконка) */
  .edit-course-btn {
    background: rgba(0,240,255,0.1);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 1.5em;
    line-height: 1;
    padding: 6px 10px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
  }
  .edit-course-btn:hover {
    background: rgba(0,240,255,0.2);
    box-shadow: 0 0 10px rgba(0,240,255,0.3);
    transform: translateY(-2px);
  }

  .lessons-nav { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; padding: 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
  .lesson-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--text); cursor: pointer; transition: all 0.3s; font-size: 0.95em; }
  .lesson-btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3); transform: translateY(-2px); }
  .lesson-btn.active { background: rgba(0,240,255,0.15); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 15px rgba(0,240,255,0.4); }
  .lesson-btn.completed { border-color: var(--green); color: var(--green); }
  .lesson-btn.completed:hover { box-shadow: 0 0 10px rgba(5,255,161,0.4); }

  .progress-container { margin: 20px 0; }
  .progress-label { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 5px; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); width: 0%; transition: width 0.4s ease; box-shadow: 0 0 10px var(--cyan); }

  .back-btn { background: transparent; border: 1px solid var(--border); color: var(--cyan); padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; transition: all 0.3s; }
  .back-btn:hover { box-shadow: 0 0 10px rgba(0,240,255,0.3); background: rgba(0,240,255,0.1); transform: translateX(-3px); }

  .block-section { margin: 25px 0; padding: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow), inset 0 0 10px rgba(0,240,255,0.02); }
  .block-section h2 { font-size: 1.8em; color: #fff; text-shadow: 0 0 10px var(--cyan); margin-bottom: 15px; }

  .heading { color: #fff; text-shadow: 0 0 8px var(--purple); }
  .text { margin: 10px 0; }
  .figure { margin: 15px 0; text-align: center; }
  .figure img, .figure video, .figure audio { max-width: 100%; border-radius: 6px; border: 1px solid var(--border); box-shadow: 0 0 12px rgba(0,240,255,0.2); display: block; margin: 0 auto; }
  .figure figcaption { color: var(--muted); font-size: 0.9em; margin-top: 8px; }

  .list { margin: 10px 0 10px 25px; }
  .list li { margin: 5px 0; }

  .code-block { margin: 15px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #0a0c14; }
  .code-header { background: rgba(0,240,255,0.1); padding: 8px 15px; color: var(--cyan); font-family: monospace; font-size: 0.9em; }
  .code-block pre { padding: 15px; overflow-x: auto; }
  .code-block code { color: var(--green); font-family: 'Courier New', monospace; white-space: pre; }

  .callout { margin: 15px 0; padding: 15px; border-left: 4px solid; border-radius: 6px; background: rgba(255,255,255,0.03); }
  .callout-info { border-color: var(--cyan); background: rgba(0,240,255,0.05); }
  .callout-warning { border-color: var(--yellow); background: rgba(255,215,0,0.05); }
  .callout-success { border-color: var(--green); background: rgba(5,255,161,0.05); }
  .callout h4 { color: #fff; margin-bottom: 8px; }

  .tabs { margin: 15px 0; }
  .tab-buttons { display: flex; gap: 5px; flex-wrap: wrap; }
  .tab-button { padding: 10px 18px; background: transparent; border: 1px solid var(--border); border-radius: 6px 6px 0 0; color: var(--text); cursor: pointer; transition: all 0.3s; }
  .tab-button:hover { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3); }
  .tab-button.active { background: rgba(0,240,255,0.15); color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,240,255,0.4); }
  .tab-panel { display: none; padding: 15px; border: 1px solid var(--border); border-radius: 0 0 6px 6px; background: rgba(255,255,255,0.02); }
  .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .accordion { margin: 15px 0; }
  .accordion-item { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.3s; }
  .accordion-item:hover { border-color: var(--cyan); }
  .accordion-header { width: 100%; padding: 12px 18px; background: transparent; color: var(--text); text-align: left; cursor: pointer; font-size: 1em; display: flex; justify-content: space-between; align-items: center; border: none; transition: color 0.3s; }
  .accordion-header:hover { color: var(--cyan); }
  .accordion-header .icon { transition: transform 0.3s; }
  .accordion-item.open .icon { transform: rotate(45deg); }
  .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: rgba(255,255,255,0.02); }
  .accordion-body-inner { padding: 15px; }

  .quiz, .multi-quiz, .match-container, .sort-container, .fill-blank, .poll, .drag-sort { margin: 15px 0; padding: 15px; border: 1px solid var(--border); border-radius: 8px; background: rgba(255,255,255,0.02); }
  .quiz .question, .multi-quiz .question, .poll .question { font-weight: bold; color: #fff; margin-bottom: 10px; }
  .quiz-option, .multi-quiz .option, .poll-option { display: block; margin: 8px 0; padding: 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: all 0.3s; }
  .quiz-option:hover, .multi-quiz .option:hover, .poll-option:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.2); transform: translateX(5px); }
  .quiz-option input, .multi-quiz .option input { margin-right: 10px; accent-color: var(--cyan); }
  .quiz-option.correct { border-color: var(--green); background: rgba(5,255,161,0.1); }
  .quiz-option.wrong { border-color: var(--pink); background: rgba(255,42,109,0.1); }
  .quiz-button, .match-check-btn, .sort-check-btn, .fill-blank-check-btn { margin-top: 15px; padding: 10px 20px; background: rgba(0,240,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 6px; cursor: pointer; transition: all 0.3s; }
  .quiz-button:hover, .match-check-btn:hover, .sort-check-btn:hover, .fill-blank-check-btn:hover { background: rgba(0,240,255,0.2); box-shadow: 0 0 15px rgba(0,240,255,0.4); transform: translateY(-2px); }
  .quiz-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .quiz-feedback, .match-result, .fill-blank-feedback { margin-top: 10px; font-weight: bold; }

  .match-item { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .match-item .term { min-width: 120px; }
  .match-item select {
    background: #0a0c14; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; cursor: pointer; outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .match-item select:hover, .match-item select:focus {
    border-color: var(--cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
  }
  .sort-list { list-style: none; padding: 0; margin: 10px 0; }
  .sort-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 6px; margin: 5px 0; transition: all 0.2s; }
  .sort-item:hover { background: rgba(255,255,255,0.05); }
  .sort-item span { flex: 1; }
  .sort-controls { display: flex; gap: 4px; }
  .sort-btn { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--border); color: var(--cyan); width: 28px; height: 28px; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 0.9em; }
  .sort-btn:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 8px rgba(0, 240, 255, 0.4); }
  .fill-blank-input { background: #0a0c14; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; text-align: center; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
  .fill-blank-input:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }

  .embed { margin: 15px 0; }
  .embed iframe { width: 100%; height: 400px; border: 1px solid var(--border); border-radius: 8px; }

  .columns { display: flex; gap: 20px; }
  .column { flex: 1; }

  .carousel { position: relative; max-width: 800px; margin: 20px auto; overflow: hidden; border-radius: 8px; border: 1px solid var(--border); }
  .carousel-track { display: flex; transition: transform 0.5s ease; }
  .carousel-slide { min-width: 100%; flex-shrink: 0; box-sizing: border-box; }
  .carousel-slide img { width: 100%; display: block; }
  .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 2em; padding: 0 15px; cursor: pointer; border-radius: 4px; z-index: 10; transition: all 0.3s; }
  .carousel-btn:hover { background: rgba(0,240,255,0.7); color: #000; }
  .carousel-btn.prev { left: 10px; }
  .carousel-btn.next { right: 10px; }
  .carousel-dots { text-align: center; padding: 10px 0; }
  .carousel-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); margin: 0 5px; cursor: pointer; transition: all 0.3s; }
  .carousel-dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

  .before-after { position: relative; max-width: 800px; margin: 20px auto; user-select: none; }
  .before-after img { width: 100%; display: block; }
  .before-after .after { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
  .before-after .after img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .before-after .divider { position: absolute; top: 0; left: 50%; width: 4px; height: 100%; background: #fff; cursor: ew-resize; z-index: 10; }
  .before-after .divider::after { content: '⟷'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 50%; padding: 4px; }

  .table-container { overflow-x: auto; margin: 15px 0; }
  .table-container table { width: 100%; border-collapse: collapse; }
  .table-container th, .table-container td { padding: 10px 15px; border: 1px solid var(--border); text-align: left; }
  .table-container th { background: rgba(0,240,255,0.1); color: var(--cyan); }
  .table-container tr:nth-child(even) { background: rgba(255,255,255,0.03); }

  .chart-container { display: flex; align-items: flex-end; gap: 10px; height: 200px; margin: 20px 0; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 8px; }
  .chart-bar { background: linear-gradient(to top, var(--cyan), var(--green)); border-radius: 4px 4px 0 0; min-width: 30px; position: relative; transition: height 0.3s; }
  .chart-bar span { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 0.8em; }
  .chart-bar-label { text-align: center; margin-top: 5px; font-size: 0.8em; color: var(--muted); }
  .pie-chart { width: 150px; height: 150px; border-radius: 50%; margin: 20px auto; transition: transform 0.3s; }
  .pie-chart:hover { transform: scale(1.05); }
  .pie-legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
  .pie-legend-item { display: flex; align-items: center; gap: 5px; }
  .pie-legend-color { width: 15px; height: 15px; border-radius: 3px; }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.2s ease; }
  .modal-content { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; max-width: 600px; width: 90%; position: relative; box-shadow: 0 0 30px rgba(0,240,255,0.3); animation: slideUp 0.3s ease; }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text); font-size: 1.5em; cursor: pointer; transition: color 0.3s; }
  .modal-close:hover { color: var(--pink); }
  .modal-open-btn { padding: 8px 16px; background: rgba(0,240,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 6px; cursor: pointer; transition: all 0.3s; }
  .modal-open-btn:hover { background: rgba(0,240,255,0.2); box-shadow: 0 0 10px rgba(0,240,255,0.3); }

  .tooltip { position: relative; display: inline-block; border-bottom: 1px dotted var(--cyan); cursor: help; }
  .tooltip .tooltip-text { visibility: hidden; width: 200px; background: #0a0c14; color: var(--text); text-align: center; border-radius: 6px; padding: 5px; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -100px; opacity: 0; transition: opacity 0.3s; border: 1px solid var(--border); }
  .tooltip:hover .tooltip-text { visibility: visible; opacity: 1; }

  .drag-sort-list { list-style: none; padding: 0; }
  .drag-sort-item { padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; margin: 5px 0; cursor: grab; user-select: none; transition: all 0.2s; }
  .drag-sort-item:hover { background: rgba(255,255,255,0.08); }
  .drag-sort-item.dragging { opacity: 0.5; border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,240,255,0.5); }

  .steps-container { margin: 20px 0; }
  .steps-header { display: flex; gap: 10px; margin-bottom: 15px; }
  .step-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text); cursor: pointer; transition: all 0.3s; }
  .step-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .step-btn.active { background: rgba(0,240,255,0.15); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3); }
  .step-content { padding: 15px; border: 1px solid var(--border); border-radius: 6px; }

  .progress-tracker { display: flex; gap: 5px; flex-wrap: wrap; margin: 15px 0; }
  .progress-step { padding: 5px 10px; border-radius: 4px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); cursor: pointer; transition: all 0.3s; }
  .progress-step:hover { border-color: var(--cyan); }
  .progress-step.done { background: rgba(5,255,161,0.15); border-color: var(--green); color: var(--green); box-shadow: 0 0 8px rgba(5,255,161,0.3); }

  .mermaid { background: #0a0c14; padding: 10px; border-radius: 8px; overflow-x: auto; }

  /* Стили для блока управления скоростью */
  .speed-control { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 6px; 
    margin: 10px auto; 
    padding: 4px 8px; 
    background: rgba(0, 0, 0, 0.4); 
    border: 1px solid var(--border); 
    border-radius: 20px; 
    width: fit-content;
  }
  .speed-control label { font-size: 0.85em; color: var(--muted); }
  .speed-control select { background: #0a0c14; color: var(--text); border: none; border-radius: 12px; padding: 4px 8px; cursor: pointer; outline: none; font-size: 0.9em; transition: box-shadow 0.3s; }
  .speed-control select:hover, .speed-control select:focus { box-shadow: 0 0 8px rgba(0, 240, 255, 0.4); }

  .compare-container { display: flex; align-items: stretch; position: relative; margin: 20px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; user-select: none; }
  .compare-left { flex: 0 0 auto; width: 50%; background: var(--panel); overflow: hidden; padding: 15px; transition: width 0.1s; }
  .compare-right { flex: 1; background: rgba(255, 255, 255, 0.02); padding: 15px; overflow: hidden; }
  .compare-divider { flex: 0 0 4px; background: #fff; cursor: ew-resize; z-index: 10; box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); position: relative; }
  .compare-divider::after { content: '⟷'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 50%; padding: 4px; font-size: 0.8em; }

  .svg-container { margin: 15px 0; text-align: center; }
  .svg-wrapper { display: inline-block; max-width: 100%; overflow: auto; }
  .svg-wrapper svg { width: 100%; height: auto; display: block; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 0 12px rgba(0,240,255,0.2); }
  .svg-caption { color: var(--muted); font-size: 0.9em; margin-top: 8px; }

  /* Новый блок HTML */
  .html-block {
    margin: 15px 0;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    overflow-x: auto;
  }
  .html-block > *:first-child { margin-top: 0; }
  .html-block > *:last-child { margin-bottom: 0; }

  .course-manager { margin: 20px 0; padding: 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .saved-course-item { display: flex; gap: 10px; align-items: center; margin: 5px 0; }

  .toggle-manager-btn {
    display: inline-block;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 10px;
    font-family: inherit;
    font-size: 0.95em;
  }
  .toggle-manager-btn:hover {
    background: rgba(0,240,255,0.1);
    box-shadow: 0 0 10px rgba(0,240,255,0.3);
    transform: translateY(-2px);
  }

  .help-content {
    max-height: 70vh;
    overflow-y: auto;
    margin-top: 10px;
    padding-right: 5px;
  }
  .prompt-textarea {
    width: 100%;
    height: 250px;
    background: #0a0c14;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-family: monospace;
    margin: 10px 0;
    resize: vertical;
  }
  .copy-btn {
    padding: 8px 16px;
    background: rgba(0,240,255,0.1);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
    margin-left: 10px;
  }
  .copy-btn:hover {
    background: rgba(0,240,255,0.2);
    box-shadow: 0 0 10px rgba(0,240,255,0.3);
  }

  .flip-card {
    background-color: transparent;
    width: 300px;
    height: 200px;
    perspective: 1000px;
    margin: 15px auto;
    cursor: pointer;
  }
  .flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
  }
  .flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    padding: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    overflow: auto;
    box-sizing: border-box;
  }
  .flip-card-back {
    transform: rotateY(180deg);
    background: rgba(0, 240, 255, 0.05);
  }

  .poll-option.selected {
    border-color: var(--cyan);
    background: rgba(0,240,255,0.1);
  }
  .poll-bar {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    margin: 5px 0 10px 0;
    overflow: hidden;
  }
  .poll-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--green));
    transition: width 0.5s;
  }
  .timeline {
    position: relative;
    margin: 20px 0;
    padding-left: 30px;
    border-left: 2px solid var(--border);
  }
  .timeline-item {
    margin-bottom: 20px;
    position: relative;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -37px;
    top: 5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  .timeline-title {
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 5px var(--cyan);
  }
  .timeline-desc {
    color: var(--muted);
  }
  .slider-container {
    margin: 15px 0;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(255,255,255,0.02);
  }
  .slider-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    color: var(--text);
  }
  .slider-value {
    color: var(--cyan);
    font-weight: bold;
  }
  .slider-input {
    width: 100%;
    accent-color: var(--cyan);
    cursor: pointer;
  }

  @media (max-width: 600px) {
    .columns { flex-direction: column; }
    .carousel-btn { font-size: 1.5em; padding: 0 8px; }
    .compare-container { flex-direction: column; }
    .compare-left, .compare-right { width: 100% !important; flex: 1 1 auto; }
    .compare-divider { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function() {
  const app = document.getElementById('app');

  // ---------- СОСТОЯНИЕ ----------
  let course = null;
  let currentLessonId = null;
  const courseProgress = JSON.parse(localStorage.getItem('lms_course_progress') || '{}');
  let completedLessons = new Set();
  let themeStyleElement = null;

  // ---------- INDEXEDDB ----------
  const DB_NAME = 'lms_courses_db';
  const DB_VERSION = 1;
  let db;

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        db = request.result;
        resolve(db);
      };
      request.onupgradeneeded = (event) => {
        const database = event.target.result;
        if (!database.objectStoreNames.contains('courses')) {
          const store = database.createObjectStore('courses', { keyPath: 'id' });
          store.createIndex('title', 'title', { unique: false });
        }
      };
    });
  }

  async function saveCourseToDB(courseData, recordId) {
    if (!db) await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['courses'], 'readwrite');
      const store = tx.objectStore('courses');
      const id = recordId || Date.now().toString();
      const record = {
        id: id,
        title: courseData.meta?.title || 'Без названия',
        course: courseData
      };
      store.put(record);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function getAllCoursesFromDB() {
    if (!db) await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['courses'], 'readonly');
      const store = tx.objectStore('courses');
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function deleteCourseFromDB(id) {
    if (!db) await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['courses'], 'readwrite');
      const store = tx.objectStore('courses');
      store.delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ DOM ----------
  function h(tag, attrs = {}, children = []) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === 'class') el.className = value;
      else if (key === 'textContent') el.textContent = value;
      else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value);
      else if (key === 'disabled') el.disabled = value;
      else if (key === 'dataset') {
        for (const [dataKey, dataValue] of Object.entries(value)) {
          el.dataset[dataKey] = dataValue;
        }
      }
      else el.setAttribute(key, value);
    }
    const childArr = Array.isArray(children) ? children : [children];
    for (const child of childArr) {
      if (child == null) continue;
      el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return el;
  }

  function slugify(text) {
    return text.toLowerCase().trim().replace(/[^\wа-яё]+/gi, '-').replace(/^-+|-+$/g, '');
  }

  function getCourseKey(course) {
    return course.meta.id || slugify(course.meta.title) || 'default';
  }

  // ---------- ТЕМЫ ----------
  const defaultTheme = {
    bg: '#0a0e1a',
    panel: '#111627',
    text: '#d5e5ff',
    muted: '#8b9bbf',
    cyan: '#00f0ff',
    pink: '#ff2a6d',
    green: '#05ffa1',
    purple: '#b967ff',
    yellow: '#ffd700',
    border: 'rgba(0, 240, 255, 0.25)',
    shadow: '0 0 15px rgba(0,240,255,0.1)'
  };

  function applyTheme(theme) {
    if (!themeStyleElement) {
      themeStyleElement = document.createElement('style');
      document.head.appendChild(themeStyleElement);
    }
    const vars = {};
    const source = theme || defaultTheme;
    for (const [key, value] of Object.entries(source)) {
      vars[`--${key}`] = value;
    }
    const css = `:root { ${Object.entries(vars).map(([k, v]) => `${k}: ${v};`).join(' ')} }`;
    themeStyleElement.textContent = css;
  }

  // ---------- ОБРАБОТКА КУРСА ----------
  function setCourse(newCourse) {
    course = newCourse;
    currentLessonId = null;
    const key = getCourseKey(course);
    completedLessons = new Set(courseProgress[key] || []);
    applyTheme(course.meta.theme || null);
    renderInitialState();
    updateSavedCoursesList();
    if (courseManagerPanel) {
      courseManagerPanel.style.display = 'none';
    }
  }

  async function loadCourseFromObject(courseData, recordId) {
    try {
      if (!courseData.meta || !courseData.lessons) {
        throw new Error('Неверный формат курса');
      }
      await saveCourseToDB(courseData, recordId);
      setCourse(courseData);
    } catch (e) {
      alert('Ошибка загрузки курса: ' + e.message);
    }
  }

  // ---------- УПРАВЛЕНИЕ ПАНЕЛЬЮ ----------
  let courseManagerPanel = null;

  function toggleCourseManager() {
    if (courseManagerPanel) {
      const isHidden = courseManagerPanel.style.display === 'none';
      courseManagerPanel.style.display = isHidden ? 'block' : 'none';
    }
  }

  // ---------- РЕНДЕРИНГ UI ----------
  function renderCourseHeader() {
    if (!course) return null;
    const header = h('header', { class: 'course-header' });

    // Строка с заголовком и кнопкой редактора
    const titleRow = h('div', { class: 'course-title-row' });
    titleRow.appendChild(h('h1', { textContent: course.meta.title }));

    const editBtn = h('button', {
      class: 'edit-course-btn',
      type: 'button',
      title: 'Редактор JSON',
      textContent: '✎' // иконка карандаша
    });
    editBtn.addEventListener('click', () => {
      const recordId = course.meta._recordId;
      openJSONEditor(JSON.stringify(course, null, 2), recordId);
    });
    titleRow.appendChild(editBtn);
    header.appendChild(titleRow);

    header.appendChild(h('p', { class: 'description', textContent: course.meta.description }));
    const badges = h('div', { class: 'badges' });
    if (course.meta.author) badges.appendChild(h('span', { class: 'badge', textContent: 'Автор: ' + course.meta.author }));
    if (course.meta.duration) badges.appendChild(h('span', { class: 'badge', textContent: 'Длительность: ' + course.meta.duration }));
    if (course.meta.level) badges.appendChild(h('span', { class: 'badge', textContent: 'Уровень: ' + course.meta.level }));
    header.appendChild(badges);

    return header;
  }

  function renderLessonsNav() {
    if (!course) return null;
    const nav = h('div', { class: 'lessons-nav' });
    course.lessons.forEach(lesson => {
      const btn = h('button', {
        class: 'lesson-btn' + (lesson.id === currentLessonId ? ' active' : '') + (completedLessons.has(lesson.id) ? ' completed' : ''),
        textContent: lesson.title,
        type: 'button'
      });
      btn.addEventListener('click', () => showLesson(lesson.id));
      nav.appendChild(btn);
    });
    return nav;
  }

  function renderProgress() {
    if (!course) return null;
    const total = course.lessons.length;
    const done = [...completedLessons].filter(id => course.lessons.some(l => l.id === id)).length;
    const percent = Math.round((done / total) * 100);
    const container = h('div', { class: 'progress-container' });
    const label = h('div', { class: 'progress-label' });
    label.appendChild(h('span', { textContent: 'Прогресс курса' }));
    label.appendChild(h('span', { textContent: `${done}/${total} (${percent}%)` }));
    const bar = h('div', { class: 'progress-bar' });
    bar.appendChild(h('div', { class: 'progress-fill', style: `width: ${percent}%` }));
    container.appendChild(label);
    container.appendChild(bar);
    return container;
  }

  function renderCourseManager() {
    const manager = h('div', { class: 'course-manager' });
    const title = h('h3', { textContent: 'Управление курсами', class: 'heading' });
    manager.appendChild(title);

    const buttonRow = h('div', { style: 'display:flex; gap:10px; flex-wrap:wrap; margin:10px 0;' });

    // Загрузка из файла
    const fileInput = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      try {
        const data = JSON.parse(text);
        await loadCourseFromObject(data);
      } catch (err) {
        alert('Ошибка парсинга JSON: ' + err.message);
      }
    });
    const fileBtn = h('button', { class: 'quiz-button', textContent: 'Загрузить из файла', type: 'button' });
    fileBtn.addEventListener('click', () => fileInput.click());
    buttonRow.appendChild(fileInput);
    buttonRow.appendChild(fileBtn);

    // Кнопка "Новый курс"
    const newCourseBtn = h('button', { class: 'quiz-button', textContent: 'Новый курс', type: 'button' });
    newCourseBtn.addEventListener('click', () => {
      const emptyCourse = {
        meta: {
          title: "Новый курс",
          description: "Описание курса",
          author: "",
          duration: "",
          level: "",
          theme: {}
        },
        lessons: [
          {
            id: "lesson-1",
            title: "Урок 1",
            description: "Описание урока",
            blocks: [
              { type: "text", text: "Введите текст..." }
            ]
          }
        ]
      };
      openJSONEditor(JSON.stringify(emptyCourse, null, 2), null);
    });
    buttonRow.appendChild(newCourseBtn);

    manager.appendChild(buttonRow);

    // Отдельная строка для URL
    const urlRow = h('div', { style: 'display:flex; gap:10px; margin:10px 0;' });
    const urlInput = h('input', { type: 'text', placeholder: 'URL JSON курса', class: 'fill-blank-input', style: 'flex:1;' });
    const urlBtn = h('button', { class: 'quiz-button', textContent: 'Загрузить по URL', type: 'button' });
    urlBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return;
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Сетевая ошибка');
        const data = await response.json();
        await loadCourseFromObject(data);
      } catch (err) {
        alert('Ошибка загрузки: ' + err.message);
      }
    });
    urlRow.appendChild(urlInput);
    urlRow.appendChild(urlBtn);
    manager.appendChild(urlRow);

    // Список сохранённых курсов
    const savedTitle = h('h4', { textContent: 'Сохранённые курсы:', style: 'margin-top:15px;' });
    manager.appendChild(savedTitle);
    const savedList = h('div', { class: 'saved-courses-list', id: 'savedCoursesList' });
    manager.appendChild(savedList);

    return manager;
  }

  async function updateSavedCoursesList() {
    const listEl = document.getElementById('savedCoursesList');
    if (!listEl) return;
    listEl.innerHTML = '<p class="text">Загрузка списка...</p>';
    try {
      const courses = await getAllCoursesFromDB();
      if (courses.length === 0) {
        listEl.innerHTML = '<p class="text">Сохранённых курсов нет.</p>';
        return;
      }
      listEl.innerHTML = '';
      courses.forEach(record => {
        const item = h('div', { class: 'saved-course-item' });
        item.appendChild(h('span', { textContent: record.title, style: 'flex:1;' }));
        const loadBtn = h('button', { class: 'quiz-button', textContent: 'Загрузить', type: 'button' });
        loadBtn.addEventListener('click', () => {
          if (!record.course.meta) record.course.meta = {};
          record.course.meta._recordId = record.id;
          setCourse(record.course);
        });
        const delBtn = h('button', { class: 'quiz-button', textContent: 'Удалить', type: 'button', style: 'background: rgba(255,42,109,0.1); border-color: var(--pink); color: var(--pink);' });
        delBtn.addEventListener('click', async () => {
          if (confirm('Удалить курс "' + record.title + '"?')) {
            await deleteCourseFromDB(record.id);
            updateSavedCoursesList();
          }
        });
        item.appendChild(loadBtn);
        item.appendChild(delBtn);
        listEl.appendChild(item);
      });
    } catch (e) {
      listEl.innerHTML = '<p class="text">Ошибка загрузки списка.</p>';
      console.error(e);
    }
  }

  function openJSONEditor(initialValue, recordId) {
    const overlay = h('div', { class: 'modal-overlay' });
    const content = h('div', { class: 'modal-content' });
    const closeBtn = h('button', { class: 'modal-close', textContent: '×', type: 'button' });
    closeBtn.addEventListener('click', () => overlay.remove());
    content.appendChild(closeBtn);
    content.appendChild(h('h3', { textContent: 'Редактор JSON курса', class: 'heading' }));

    const textarea = h('textarea', { style: 'width:100%; height:300px; background:#0a0c14; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:10px; font-family:monospace;' });
    textarea.value = initialValue || '';
    content.appendChild(textarea);

    const buttonRow = h('div', { style: 'display:flex; gap:10px; margin-top:10px;' });
    const loadBtn = h('button', { class: 'quiz-button', textContent: 'Загрузить', type: 'button' });
    loadBtn.addEventListener('click', async () => {
      try {
        const data = JSON.parse(textarea.value);
        await loadCourseFromObject(data, recordId);
        overlay.remove();
      } catch (e) {
        alert('Ошибка JSON: ' + e.message);
      }
    });
    const cancelBtn = h('button', { class: 'quiz-button', textContent: 'Отмена', type: 'button' });
    cancelBtn.addEventListener('click', () => overlay.remove());
    buttonRow.appendChild(loadBtn);
    buttonRow.appendChild(cancelBtn);
    content.appendChild(buttonRow);

    overlay.appendChild(content);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
    });
  }

  // ---------- СПРАВКА И ГЕНЕРАЦИЯ ПРОМПТА ----------
  function openHelpModal() {
    const overlay = h('div', { class: 'modal-overlay' });
    const content = h('div', { class: 'modal-content' });
    const closeBtn = h('button', { class: 'modal-close', textContent: '×', type: 'button' });
    closeBtn.addEventListener('click', () => overlay.remove());
    content.appendChild(closeBtn);
    content.appendChild(h('h3', { textContent: 'Справка по LMS Player', class: 'heading' }));

    const helpDiv = h('div', { class: 'help-content' });
    helpDiv.innerHTML = `
      <h4 style="color: #fff; margin-top: 10px;">Общая информация</h4>
      <p>Данный плеер предназначен для отображения интерактивных образовательных курсов в формате JSON. Курс состоит из метаданных и списка уроков. Каждый урок содержит заголовок, описание и набор блоков контента.</p>
      <h4 style="color: #fff; margin-top: 10px;">Структура курса</h4>
      <pre style="background:#0a0c14; padding:10px; border-radius:6px; overflow-x:auto;"><code>{
  "meta": {
    "title": "Название курса",
    "description": "Описание",
    "author": "Автор",
    "duration": "Длительность",
    "level": "Уровень",
    "theme": { ... } // необязательно, переопределение цветов
  },
  "lessons": [
    {
      "id": "lesson-1",
      "title": "Название урока",
      "description": "Описание урока",
      "blocks": [ ... ]
    }
  ]
}</code></pre>
      <h4 style="color: #fff; margin-top: 10px;">Настройка цветовой схемы (тема)</h4>
      <p>В <code>meta.theme</code> можно передать объект с переопределением любых переменных CSS. Доступные ключи:</p>
      <ul>
        <li><code>bg</code> — основной фон (по умолчанию #0a0e1a)</li>
        <li><code>panel</code> — фон панелей (по умолчанию #111627)</li>
        <li><code>text</code> — основной текст (по умолчанию #d5e5ff)</li>
        <li><code>muted</code> — приглушённый текст (по умолчанию #8b9bbf)</li>
        <li><code>cyan</code> — основной акцент (по умолчанию #00f0ff)</li>
        <li><code>pink</code> — розовый акцент (по умолчанию #ff2a6d)</li>
        <li><code>green</code> — зелёный акцент (по умолчанию #05ffa1)</li>
        <li><code>purple</code> — фиолетовый акцент (по умолчанию #b967ff)</li>
        <li><code>yellow</code> — жёлтый акцент (по умолчанию #ffd700)</li>
        <li><code>border</code> — цвет границ (по умолчанию rgba(0, 240, 255, 0.25))</li>
        <li><code>shadow</code> — тень (по умолчанию 0 0 15px rgba(0,240,255,0.1))</li>
      </ul>
      <p>Пример: <code>"theme": { "cyan": "#ff00ff", "bg": "#101010" }</code>.</p>
      <h4 style="color: #fff; margin-top: 10px;">Типы блоков</h4>
      <ul>
        <li><strong>section</strong> — секция с заголовком и вложенными блоками.</li>
        <li><strong>heading</strong> — заголовок уровня h1-h6.</li>
        <li><strong>text</strong> — абзац текста.</li>
        <li><strong>image</strong> — изображение с подписью.</li>
        <li><strong>video</strong> — видео (с возможностью контроля скорости).</li>
        <li><strong>audio</strong> — аудио (с возможностью контроля скорости).</li>
        <li><strong>list</strong> — маркированный/нумерованный список.</li>
        <li><strong>code</strong> — блок кода с подсветкой.</li>
        <li><strong>callout</strong> — выделенный блок (info, warning, success).</li>
        <li><strong>tabs</strong> — вкладки.</li>
        <li><strong>accordion</strong> — аккордеон.</li>
        <li><strong>quiz</strong> — одиночный выбор с проверкой.</li>
        <li><strong>multi-quiz</strong> — множественный выбор.</li>
        <li><strong>match</strong> — сопоставление пар.</li>
        <li><strong>sort</strong> — сортировка элементов стрелками.</li>
        <li><strong>fill-blank</strong> — заполнение пропусков.</li>
        <li><strong>flip-card</strong> — переворачивающаяся карточка.</li>
        <li><strong>poll</strong> — опрос с отображением результатов.</li>
        <li><strong>compare</strong> — сравнение двух блоков с перетаскиваемым разделителем.</li>
        <li><strong>slider</strong> — ползунок.</li>
        <li><strong>timeline</strong> — таймлайн.</li>
        <li><strong>steps</strong> — пошаговый контент.</li>
        <li><strong>embed</strong> — iframe.</li>
        <li><strong>columns</strong> — колонки.</li>
        <li><strong>carousel</strong> — карусель.</li>
        <li><strong>before-after</strong> — сравнение изображений.</li>
        <li><strong>table</strong> — таблица.</li>
        <li><strong>chart</strong> — столбчатая диаграмма.</li>
        <li><strong>pie</strong> — круговая диаграмма.</li>
        <li><strong>modal</strong> — кнопка, открывающая модальное окно.</li>
        <li><strong>tooltip</strong> — текст с подсказкой.</li>
        <li><strong>mermaid</strong> — диаграмма Mermaid.</li>
        <li><strong>drag-sort</strong> — сортировка перетаскиванием.</li>
        <li><strong>progress-tracker</strong> — интерактивный трекер прогресса.</li>
        <li><strong>svg</strong> — встроенное SVG-изображение.</li>
        <li><strong>html</strong> — произвольный HTML-код для расширенного форматирования (поле <code>code</code>).</li>
      </ul>
      <p>Подробное описание параметров каждого блока смотрите в JSON-схеме (открывается через "Генерация промпта").</p>

  function openPromptGenerator() {
    const overlay = h('div', { class: 'modal-overlay' });
    const content = h('div', { class: 'modal-content' });
    const closeBtn = h('button', { class: 'modal-close', textContent: '×', type: 'button' });

    content.appendChild(closeBtn);
    content.appendChild(h('h3', { textContent: 'Генератор промпта для LLM', class: 'heading' }));

    const topicRow = h('div', { style: 'display:flex; gap:10px; margin:15px 0;' });
    const topicInput = h('input', { type: 'text', placeholder: 'Введите тему курса', class: 'fill-blank-input', style: 'flex:1;' });
    const generateBtn = h('button', { class: 'quiz-button', textContent: 'Сгенерировать промпт', type: 'button' });
    topicRow.appendChild(topicInput);
    topicRow.appendChild(generateBtn);
    content.appendChild(topicRow);

    const promptArea = h('textarea', { class: 'prompt-textarea', placeholder: 'Здесь появится промпт...' });
    content.appendChild(promptArea);

    const copyRow = h('div', { style: 'display:flex; gap:10px; margin-top:10px;' });
    const copyBtn = h('button', { class: 'copy-btn', textContent: 'Копировать в буфер', type: 'button' });
    copyBtn.addEventListener('click', async () => {
      if (!promptArea.value) {
        alert('Промпт пуст. Сначала сгенерируйте.');
        return;
      }
      try {
        await navigator.clipboard.writeText(promptArea.value);
        alert('Промпт скопирован в буфер обмена!');
      } catch (e) {
        alert('Не удалось скопировать: ' + e.message);
      }
    });
    copyRow.appendChild(copyBtn);
    content.appendChild(copyRow);

    generateBtn.addEventListener('click', () => {
      const topic = topicInput.value.trim() || 'выбранной теме';
      promptArea.value = generatePrompt(topic);
    });

    overlay.appendChild(content);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
    });
  }

    const prompt = `Ты — эксперт по созданию интерактивных образовательных курсов. Создай JSON-файл курса на тему "${topic}" для LMS-плеера.

- Используй разнообразные типы блоков: текст, изображения, видео (если возможно), викторины, сопоставления, диаграммы, таблицы, аккордеоны и т.д.

- Обязательно включи блоки quiz, fill-blank, и хотя бы один диаграмму (chart или pie).
- Метаданные должны быть заполнены реалистично, в качестве автора укажи себя (например, "AI Assistant").

- SVG-код должен быть валидным и не содержать скриптов (безопасность).
- HTML-код должен быть корректным и не содержать скриптов.

Схема:
${schema}

Сгенерируй только JSON, без пояснений.`;

    return prompt;

  // ---------- РЕНДЕРИНГ БАЗОВОГО UI ----------
  function renderBaseUI() {

  function renderInitialState() {
    app.innerHTML = '';
    if (!course) {
      applyTheme(null);
    }
    renderBaseUI();

      app.appendChild(h('p', { class: 'text', textContent: 'Выберите занятие из списка выше.' }));
    }
