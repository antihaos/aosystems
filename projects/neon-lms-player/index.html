  function showLesson(lessonId) {
    if (!course) return;
    currentLessonId = lessonId;
    app.innerHTML = '';
    renderBaseUI();
    const backBtn = h('button', { class: 'back-btn', textContent: '← К списку занятий', type: 'button' });
    backBtn.addEventListener('click', () => {
      currentLessonId = null;
      renderInitialState();
    });
    app.appendChild(backBtn);

    const lesson = course.lessons.find(l => l.id === lessonId);
    if (!lesson) return;

    const lessonContainer = h('div', { class: 'lesson-container' });
    lessonContainer.appendChild(h('h2', { class: 'heading', textContent: lesson.title }));
    if (lesson.description) lessonContainer.appendChild(h('p', { class: 'text', textContent: lesson.description }));

    const content = h('div', { class: 'lesson-content' });
    renderBlocks(lesson.blocks, content);
    lessonContainer.appendChild(content);

    const completeBtn = h('button', {
      class: 'quiz-button',
      textContent: completedLessons.has(lessonId) ? 'Занятие завершено ✓' : 'Завершить занятие',
      type: 'button'
    });
    completeBtn.addEventListener('click', () => {
      const key = getCourseKey(course);
      if (!courseProgress[key]) courseProgress[key] = [];
      if (completedLessons.has(lessonId)) {
        completedLessons.delete(lessonId);
      } else {
        completedLessons.add(lessonId);
      }
      courseProgress[key] = [...completedLessons];
      localStorage.setItem('lms_course_progress', JSON.stringify(courseProgress));
      showLesson(lessonId);
    });
    lessonContainer.appendChild(completeBtn);

    app.appendChild(lessonContainer);
    postProcess(lessonContainer);
  }

  // ---------- ОБРАБОТЧИКИ БЛОКОВ ----------
  function processMath(element) {
    if (window.renderMathInElement) {
      try {
        window.renderMathInElement(element, {
          delimiters: [
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false},
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      } catch(e) { console.error('KaTeX error:', e); }
    }
  }

  function renderMermaidDiagrams(element) {
    const mermaidElements = element.querySelectorAll('.mermaid');
    if (mermaidElements.length && window.mermaid) {
      mermaidElements.forEach(el => {
        const code = el.textContent;
        el.removeAttribute('data-processed');
        el.innerHTML = code;
      });
      try {
        mermaid.run({ nodes: mermaidElements });
      } catch(e) { console.error('Mermaid error:', e); }
    }
  }

  function postProcess(container) {
    processMath(container);
    renderMermaidDiagrams(container);
  }

  function renderBlocks(blocks, container) {
    blocks.forEach((block, idx) => {
      const element = renderBlock(block, idx);
      if (element) container.appendChild(element);
    });
  }

  function renderContentOrText(value, container) {
    if (typeof value === 'string') {
      container.appendChild(document.createTextNode(value));
    } else if (Array.isArray(value)) {
      renderBlocks(value, container);
    } else if (value && value.type) {
      const el = renderBlock(value, 0);
      if (el) container.appendChild(el);
    }
  }

  function setupDrag(divider, container, setPos) {
    let isDragging = false;
    function onMouseMove(e) { if (isDragging) setPos(e.clientX); }
    function onTouchMove(e) { if (isDragging) { e.preventDefault(); setPos(e.touches[0].clientX); } }
    function endDrag() {
      isDragging = false;
      document.body.style.userSelect = '';
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', endDrag);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('touchend', endDrag);
    }
    function startDrag(e) {
      e.preventDefault();
      isDragging = true;
      document.body.style.userSelect = 'none';
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', endDrag);
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', endDrag);
      if (e.type === 'touchstart') setPos(e.touches[0].clientX);
      else if (e.type === 'mousedown') setPos(e.clientX);
    }
    divider.addEventListener('mousedown', startDrag);
    divider.addEventListener('touchstart', startDrag, { passive: false });
  }

  function setupCompareDrag(container, left, divider) {
    let isDragging = false;
    function setWidthFromClientX(clientX) {
      const rect = container.getBoundingClientRect();
      const dividerWidth = 4;
      const minLeft = 50;
      const minRight = 50;
      let x = clientX - rect.left;
      x = Math.max(minLeft, Math.min(x, rect.width - dividerWidth - minRight));
      left.style.width = x + 'px';
    }
    function onMouseMove(e) { if (isDragging) setWidthFromClientX(e.clientX); }
    function onTouchMove(e) { if (isDragging) { e.preventDefault(); setWidthFromClientX(e.touches[0].clientX); } }
    function endDrag() {
      isDragging = false;
      document.body.style.userSelect = '';
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', endDrag);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('touchend', endDrag);
    }
    function startDrag(e) {
      e.preventDefault();
      isDragging = true;
      document.body.style.userSelect = 'none';
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', endDrag);
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', endDrag);
      if (e.type === 'touchstart') setWidthFromClientX(e.touches[0].clientX);
      else if (e.type === 'mousedown') setWidthFromClientX(e.clientX);
    }
    divider.addEventListener('mousedown', startDrag);
    divider.addEventListener('touchstart', startDrag, { passive: false });
  }

  function renderBlock(block, idx) {
    switch (block.type) {
      case 'section': {
        const section = h('section', { class: 'block-section', id: block.id || slugify(block.title) });
        section.appendChild(h('h2', { class: 'section-title', textContent: block.title }));
        if (block.children) {
          const content = h('div', { class: 'section-content' });
          renderBlocks(block.children, content);
          section.appendChild(content);
        }
        return section;
      }
      case 'heading':
        return h(`h${block.level || 2}`, { class: 'heading', textContent: block.text });
      case 'text':
        return h('p', { class: 'text', textContent: block.text });
      case 'image': {
        const fig = h('figure', { class: 'figure' });
        fig.appendChild(h('img', { src: block.src, alt: block.caption || '' }));
        if (block.caption) fig.appendChild(h('figcaption', { textContent: block.caption }));
        return fig;
      }
      case 'video': {
        const fig = h('figure', { class: 'figure' });
        const video = h('video', { controls: '' });
        if (block.poster) video.setAttribute('poster', block.poster);
        video.appendChild(h('source', { src: block.src, type: block.mimeType || 'video/mp4' }));
        fig.appendChild(video);
        if (block.speedControl) {
          const speedControl = h('div', { class: 'speed-control' });
          speedControl.appendChild(h('label', { textContent: 'Скорость:' }));
          const speedSelect = h('select');
          [0.5, 1, 1.5, 2].forEach(s => speedSelect.appendChild(h('option', { value: s, textContent: s + 'x' })));
          speedSelect.value = '1';
          speedSelect.addEventListener('change', () => video.playbackRate = parseFloat(speedSelect.value));
          speedControl.appendChild(speedSelect);
          fig.appendChild(speedControl);
        }
        if (block.caption) fig.appendChild(h('figcaption', { textContent: block.caption }));
        return fig;
      }
      case 'audio': {
        const fig = h('figure', { class: 'figure' });
        const audio = h('audio', { controls: '' });
        audio.appendChild(h('source', { src: block.src, type: block.mimeType || 'audio/mpeg' }));
        fig.appendChild(audio);
        if (block.speedControl) {
          const speedControl = h('div', { class: 'speed-control' });
          speedControl.appendChild(h('label', { textContent: 'Скорость:' }));
          const speedSelect = h('select');
          [0.5, 1, 1.5, 2].forEach(s => speedSelect.appendChild(h('option', { value: s, textContent: s + 'x' })));
          speedSelect.value = '1';
          speedSelect.addEventListener('change', () => audio.playbackRate = parseFloat(speedSelect.value));
          speedControl.appendChild(speedSelect);
          fig.appendChild(speedControl);
        }
        if (block.caption) fig.appendChild(h('figcaption', { textContent: block.caption }));
        return fig;
      }
      case 'list': {
        const list = h(block.ordered ? 'ol' : 'ul', { class: 'list' });
        block.items.forEach(item => list.appendChild(h('li', { textContent: item })));
        return list;
      }
      case 'code': {
        const wrapper = h('div', { class: 'code-block' });
        wrapper.appendChild(h('div', { class: 'code-header', textContent: block.language || 'code' }));
        const pre = h('pre');
        pre.appendChild(h('code', { textContent: block.code }));
        wrapper.appendChild(pre);
        return wrapper;
      }
      case 'callout': {
        const callout = h('div', { class: `callout callout-${block.variant || 'info'}` });
        if (block.title) callout.appendChild(h('h4', { textContent: block.title }));
        if (block.children) {
          const content = h('div');
          renderBlocks(block.children, content);
          callout.appendChild(content);
        } else if (block.text) {
          callout.appendChild(h('p', { textContent: block.text }));
        }
        return callout;
      }
      case 'tabs': {
        const tabs = h('div', { class: 'tabs' });
        const btnContainer = h('div', { class: 'tab-buttons' });
        const panelContainer = h('div', { class: 'tab-panels' });
        block.tabs.forEach((tab, tabIdx) => {
          const btn = h('button', { class: 'tab-button' + (tabIdx === 0 ? ' active' : ''), textContent: tab.label, type: 'button' });
          const panel = h('div', { class: 'tab-panel' + (tabIdx === 0 ? ' active' : '') });
          renderBlocks(tab.content || [], panel);
          btn.addEventListener('click', () => {
            btnContainer.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            panelContainer.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            panel.classList.add('active');
          });
          btnContainer.appendChild(btn);
          panelContainer.appendChild(panel);
        });
        tabs.appendChild(btnContainer);
        tabs.appendChild(panelContainer);
        return tabs;
      }
      case 'accordion': {
        const accordion = h('div', { class: 'accordion' });
        block.items.forEach((item) => {
          const itemEl = h('div', { class: 'accordion-item' });
          const header = h('button', { class: 'accordion-header', type: 'button' });
          header.appendChild(h('span', { textContent: item.title }));
          header.appendChild(h('span', { class: 'icon', textContent: '+' }));
          const body = h('div', { class: 'accordion-body' });
          const inner = h('div', { class: 'accordion-body-inner' });
          renderBlocks(item.content || [], inner);
          body.appendChild(inner);
          header.addEventListener('click', () => {
            const isOpen = itemEl.classList.contains('open');
            accordion.querySelectorAll('.accordion-item').forEach(el => {
              el.classList.remove('open');
              el.querySelector('.accordion-body').style.maxHeight = '0';
            });
            if (!isOpen) {
              itemEl.classList.add('open');
              body.style.maxHeight = body.scrollHeight + 'px';
            }
          });
          itemEl.appendChild(header);
          itemEl.appendChild(body);
          accordion.appendChild(itemEl);
        });
        return accordion;
      }
      case 'quiz': {
        const quiz = h('div', { class: 'quiz' });
        quiz.appendChild(h('p', { class: 'question', textContent: block.question }));
        const optionsContainer = h('div', { class: 'quiz-options' });
        const radioName = `quiz-${idx}-${Math.random().toString(36).substring(2, 11)}`;
        let selected = null;
        block.options.forEach((opt, optIdx) => {
          const label = h('label', { class: 'quiz-option' });
          const input = h('input', { type: 'radio', name: radioName, value: optIdx });
          input.addEventListener('change', () => { selected = optIdx; });
          label.appendChild(input);
          label.appendChild(document.createTextNode(opt));
          optionsContainer.appendChild(label);
        });
        quiz.appendChild(optionsContainer);
        const button = h('button', { class: 'quiz-button', textContent: 'Проверить', type: 'button' });
        const feedback = h('div', { class: 'quiz-feedback' });
        button.addEventListener('click', () => {
          if (selected === null) { feedback.textContent = 'Выберите вариант!'; feedback.style.color = 'var(--yellow)'; return; }
          const correct = block.correct;
          const labels = optionsContainer.querySelectorAll('.quiz-option');
          labels.forEach((label, i) => {
            label.classList.remove('correct', 'wrong');
            label.querySelector('input').disabled = true;
            if (i === correct) label.classList.add('correct');
            else if (i === selected) label.classList.add('wrong');
          });
          feedback.textContent = selected === correct ? 'Верно! ' + (block.explanation || '') : 'Неверно. ' + (block.explanation || '');
          feedback.style.color = selected === correct ? 'var(--green)' : 'var(--pink)';
          button.disabled = true;
        });
        quiz.appendChild(button);
        quiz.appendChild(feedback);
        return quiz;
      }
      case 'multi-quiz': {
        const container = h('div', { class: 'quiz multi-quiz' });
        container.appendChild(h('p', { class: 'question', textContent: block.question }));
        const optionsContainer = h('div', { class: 'multi-quiz-options' });
        block.options.forEach((opt, i) => {
          const label = h('label', { class: 'option' });
          const input = h('input', { type: 'checkbox', value: i });
          label.appendChild(input);
          label.appendChild(document.createTextNode(opt));
          optionsContainer.appendChild(label);
        });
        container.appendChild(optionsContainer);
        const button = h('button', { class: 'quiz-button', textContent: 'Проверить', type: 'button' });
        const feedback = h('div', { class: 'feedback' });
        button.addEventListener('click', () => {
          const selected = [];
          optionsContainer.querySelectorAll('input:checked').forEach(inp => selected.push(parseInt(inp.value)));
          const correct = block.correct;
          const isCorrect = selected.length === correct.length && selected.every(v => correct.includes(v));
          feedback.textContent = isCorrect ? 'Верно! ' + (block.explanation || '') : 'Неверно. ' + (block.explanation || '');
          feedback.style.color = isCorrect ? 'var(--green)' : 'var(--pink)';
          optionsContainer.querySelectorAll('input').forEach(inp => inp.disabled = true);
          button.disabled = true;
        });
        container.appendChild(button);
        container.appendChild(feedback);
        return container;
      }
      case 'match': {
        const container = h('div', { class: 'match-container' });
        if (block.instruction) container.appendChild(h('p', { class: 'text', textContent: block.instruction }));
        const rightOptions = [...new Set(block.pairs.map(p => p.right))];
        const selects = [];
        block.pairs.forEach((pair, i) => {
          const item = h('div', { class: 'match-item' });
          item.appendChild(h('span', { class: 'term', textContent: pair.left + ' →' }));
          const select = h('select');
          select.appendChild(h('option', { value: '', textContent: 'Выберите...' }));
          rightOptions.forEach(opt => select.appendChild(h('option', { value: opt, textContent: opt })));
          item.appendChild(select);
          container.appendChild(item);
          selects.push({ select, correct: pair.right });
        });
        const checkBtn = h('button', { class: 'match-check-btn', textContent: 'Проверить', type: 'button' });
        const result = h('div', { class: 'match-result' });
        checkBtn.addEventListener('click', () => {
          let allCorrect = true;
          selects.forEach(({ select, correct }) => {
            if (select.value !== correct) { allCorrect = false; select.style.borderColor = 'var(--pink)'; }
            else select.style.borderColor = 'var(--green)';
          });
          result.textContent = allCorrect ? 'Все верно!' : 'Есть ошибки.';
          result.style.color = allCorrect ? 'var(--green)' : 'var(--pink)';
        });
        container.appendChild(checkBtn);
        container.appendChild(result);
        return container;
      }
      case 'sort': {
        const container = h('div', { class: 'sort-container' });
        if (block.instruction) container.appendChild(h('p', { class: 'text', textContent: block.instruction }));
        const list = h('ul', { class: 'sort-list' });
        let items = [...block.items];
        const renderList = () => {
          list.innerHTML = '';
          items.forEach((item, i) => {
            const li = h('li', { class: 'sort-item' });
            li.appendChild(h('span', { textContent: item }));
            const controls = h('div', { class: 'sort-controls' });
            if (i > 0) controls.appendChild(h('button', { class: 'sort-btn', textContent: '↑', type: 'button', onclick: () => { [items[i-1], items[i]] = [items[i], items[i-1]]; renderList(); }}));
            if (i < items.length - 1) controls.appendChild(h('button', { class: 'sort-btn', textContent: '↓', type: 'button', onclick: () => { [items[i], items[i+1]] = [items[i+1], items[i]]; renderList(); }}));
            li.appendChild(controls);
            list.appendChild(li);
          });
        };
        renderList();
        container.appendChild(list);
        const checkBtn = h('button', { class: 'sort-check-btn', textContent: 'Проверить', type: 'button' });
        const result = h('div', { class: 'match-result' });
        checkBtn.addEventListener('click', () => {
          const isCorrect = JSON.stringify(items) === JSON.stringify(block.correctOrder);
          result.textContent = isCorrect ? 'Правильный порядок!' : 'Неправильно.';
          result.style.color = isCorrect ? 'var(--green)' : 'var(--pink)';
        });
        container.appendChild(checkBtn);
        container.appendChild(result);
        return container;
      }
      case 'fill-blank': {
        const container = h('div', { class: 'fill-blank' });
        if (block.instruction) container.appendChild(h('p', { class: 'text', textContent: block.instruction }));
        const regex = /\{\{(\d+)\}\}/g;
        const parts = [];
        let lastIndex = 0, match;
        const inputs = {};
        while ((match = regex.exec(block.text)) !== null) {
          if (match.index > lastIndex) parts.push(block.text.substring(lastIndex, match.index));
          const key = match[1];
          const input = h('input', { type: 'text', class: 'fill-blank-input', placeholder: key });
          inputs[key] = input;
          parts.push(input);
          lastIndex = regex.lastIndex;
        }
        if (lastIndex < block.text.length) parts.push(block.text.substring(lastIndex));
        parts.forEach(part => {
          if (typeof part === 'string') {
            container.appendChild(document.createTextNode(part));
          } else {
            container.appendChild(part);
          }
        });
        const checkBtn = h('button', { class: 'fill-blank-check-btn', textContent: 'Проверить', type: 'button' });
        const feedback = h('div', { class: 'fill-blank-feedback' });
        checkBtn.addEventListener('click', () => {
          let allCorrect = true;
          for (const key in block.answers) {
            if (inputs[key].value.trim().toLowerCase() !== block.answers[key].toLowerCase()) { allCorrect = false; inputs[key].style.borderColor = 'var(--pink)'; }
            else inputs[key].style.borderColor = 'var(--green)';
          }
          feedback.textContent = allCorrect ? 'Верно!' : 'Есть ошибки.';
          feedback.style.color = allCorrect ? 'var(--green)' : 'var(--pink)';
        });
        container.appendChild(checkBtn);
        container.appendChild(feedback);
        return container;
      }
      case 'flip-card': {
        const card = h('div', { class: 'flip-card' });
        const inner = h('div', { class: 'flip-card-inner' });
        const front = h('div', { class: 'flip-card-front' });
        renderContentOrText(block.front, front);
        inner.appendChild(front);
        const back = h('div', { class: 'flip-card-back' });
        renderContentOrText(block.back, back);
        inner.appendChild(back);
        card.appendChild(inner);
        card.addEventListener('click', () => card.classList.toggle('flipped'));
        return card;
      }
      case 'poll': {
        const container = h('div', { class: 'poll' });
        container.appendChild(h('p', { class: 'question', textContent: block.question }));
        const optionsContainer = h('div', { class: 'poll-options' });
        const resultsContainer = h('div', { class: 'poll-results' });
        let selected = null;
        block.options.forEach((opt, i) => {
          const optionEl = h('div', { class: 'poll-option', textContent: opt });
          optionEl.addEventListener('click', () => {
            selected = i;
            optionsContainer.querySelectorAll('.poll-option').forEach(el => el.classList.remove('selected'));
            optionEl.classList.add('selected');
            resultsContainer.innerHTML = '';
            block.options.forEach((o, idx) => {
              const percent = idx === i ? 60 : Math.floor(Math.random() * 30 + 5);
              const bar = h('div', { class: 'poll-bar' });
              bar.appendChild(h('div', { class: 'poll-bar-fill', style: `width: ${percent}%` }));
              resultsContainer.appendChild(h('div', { textContent: `${o}: ${percent}%` }));
              resultsContainer.appendChild(bar);
            });
            resultsContainer.style.animation = 'fadeIn 0.5s ease';
          });
          optionsContainer.appendChild(optionEl);
        });
        container.appendChild(optionsContainer);
        container.appendChild(resultsContainer);
        return container;
      }
      case 'compare': {
        const container = h('div', { class: 'compare-container' });
        const left = h('div', { class: 'compare-left' });
        if (block.left) renderBlocks(block.left, left);
        container.appendChild(left);
        const divider = h('div', { class: 'compare-divider' });
        container.appendChild(divider);
        const right = h('div', { class: 'compare-right' });
        if (block.right) renderBlocks(block.right, right);
        container.appendChild(right);
        setupCompareDrag(container, left, divider);
        return container;
      }
      case 'slider': {
        const container = h('div', { class: 'slider-container' });
        const labelRow = h('div', { class: 'slider-label' });
        labelRow.appendChild(h('span', { textContent: block.label || 'Значение:' }));
        const valueDisplay = h('span', { class: 'slider-value', textContent: block.default || 0 });
        labelRow.appendChild(valueDisplay);
        container.appendChild(labelRow);
        const slider = h('input', { type: 'range', class: 'slider-input', min: block.min || 0, max: block.max || 100, value: block.default || 0 });
        slider.addEventListener('input', () => valueDisplay.textContent = slider.value);
        container.appendChild(slider);
        return container;
      }
      case 'timeline': {
        const timeline = h('div', { class: 'timeline' });
        block.items.forEach(item => {
          const itemEl = h('div', { class: 'timeline-item' });
          itemEl.appendChild(h('div', { class: 'timeline-title', textContent: item.title }));
          itemEl.appendChild(h('div', { class: 'timeline-desc', textContent: item.description }));
          timeline.appendChild(itemEl);
        });
        return timeline;
      }
      case 'steps': {
        const container = h('div', { class: 'steps-container' });
        const header = h('div', { class: 'steps-header' });
        const contentContainer = h('div', { class: 'step-content' });
        let currentStep = 0;
        const renderStep = () => {
          header.innerHTML = '';
          block.steps.forEach((step, i) => {
            const btn = h('button', { class: 'step-btn' + (i === currentStep ? ' active' : ''), textContent: step.title, type: 'button' });
            btn.addEventListener('click', () => { currentStep = i; renderStep(); });
            header.appendChild(btn);
          });
          contentContainer.innerHTML = '';
          renderBlocks(block.steps[currentStep].content || [], contentContainer);
        };
        renderStep();
        container.appendChild(header);
        container.appendChild(contentContainer);
        return container;
      }
      case 'embed': {
        const wrapper = h('div', { class: 'embed' });
        wrapper.appendChild(h('iframe', { src: block.src, allowfullscreen: '' }));
        return wrapper;
      }
      case 'columns': {
        const cols = h('div', { class: 'columns' });
        block.columns.forEach(col => {
          const colDiv = h('div', { class: 'column' });
          renderBlocks(col.blocks || [], colDiv);
          cols.appendChild(colDiv);
        });
        return cols;
      }
      case 'carousel': {
        const carousel = h('div', { class: 'carousel' });
        const track = h('div', { class: 'carousel-track' });
        const slides = block.items.map(item => {
          const slide = h('div', { class: 'carousel-slide' });
          if (item.content) {
            renderBlocks(item.content, slide);
          } else if (item.image) {
            slide.appendChild(h('img', { src: item.image, alt: item.caption || '' }));
            if (item.caption) slide.appendChild(h('div', { class: 'figure', textContent: item.caption }));
          }
          return slide;
        });
        slides.forEach(s => track.appendChild(s));
        carousel.appendChild(track);
        let current = 0;
        const update = () => {
          track.style.transform = `translateX(-${current * 100}%)`;
          dots.forEach((dot, i) => dot.classList.toggle('active', i === current));
        };
        carousel.appendChild(h('button', { class: 'carousel-btn prev', textContent: '‹', type: 'button', onclick: () => { current = (current - 1 + slides.length) % slides.length; update(); }}));
        carousel.appendChild(h('button', { class: 'carousel-btn next', textContent: '›', type: 'button', onclick: () => { current = (current + 1) % slides.length; update(); }}));
        const dotsContainer = h('div', { class: 'carousel-dots' });
        const dots = slides.map((_, i) => h('span', { class: 'carousel-dot' + (i === 0 ? ' active' : ''), onclick: () => { current = i; update(); }}));
        dots.forEach(d => dotsContainer.appendChild(d));
        carousel.appendChild(dotsContainer);
        update();
        return carousel;
      }
      case 'before-after': {
        const container = h('div', { class: 'before-after' });
        container.appendChild(h('img', { src: block.before, alt: 'before' }));
        const after = h('div', { class: 'after' });
        after.appendChild(h('img', { src: block.after, alt: 'after' }));
        container.appendChild(after);
        const divider = h('div', { class: 'divider' });
        container.appendChild(divider);

        const setPos = (x) => {
          const rect = container.getBoundingClientRect();
          const pos = Math.max(0, Math.min(x - rect.left, rect.width));
          after.style.width = pos + 'px';
          divider.style.left = pos + 'px';
        };

        setupDrag(divider, container, setPos);
        return container;
      }
      case 'table': {
        const container = h('div', { class: 'table-container' });
        const table = h('table');
        const thead = h('thead');
        const tr = h('tr');
        block.headers.forEach(hd => tr.appendChild(h('th', { textContent: hd })));
        thead.appendChild(tr);
        table.appendChild(thead);
        const tbody = h('tbody');
        block.rows.forEach(row => {
          const tr2 = h('tr');
          row.forEach(cell => tr2.appendChild(h('td', { textContent: cell })));
          tbody.appendChild(tr2);
        });
        table.appendChild(tbody);
        container.appendChild(table);
        return container;
      }
      case 'chart': {
        const container = h('div', { class: 'chart-block' });
        if (block.title) container.appendChild(h('h4', { textContent: block.title, class: 'heading' }));
        const chart = h('div', { class: 'chart-container' });
        const max = Math.max(...block.values);
        block.values.forEach((val, i) => {
          const barWrap = h('div', { style: 'display: flex; flex-direction: column; align-items: center; flex: 1;' });
          const bar = h('div', { class: 'chart-bar', style: `height: ${(val / max) * 150}px;` });
          bar.appendChild(h('span', { textContent: val + '%' }));
          barWrap.appendChild(bar);
          barWrap.appendChild(h('div', { class: 'chart-bar-label', textContent: block.labels[i] }));
          chart.appendChild(barWrap);
        });
        container.appendChild(chart);
        return container;
      }
      case 'pie': {
        const container = h('div', { class: 'pie-block' });
        if (block.title) container.appendChild(h('h4', { textContent: block.title, class: 'heading' }));
        const total = block.segments.reduce((sum, seg) => sum + seg.value, 0);
        let cumulative = 0;
        const gradientStops = block.segments.map(seg => {
          const start = (cumulative / total) * 100;
          cumulative += seg.value;
          const end = (cumulative / total) * 100;
          return `${seg.color} ${start}% ${end}%`;
        }).join(', ');
        const pie = h('div', { class: 'pie-chart', style: `background: conic-gradient(${gradientStops});` });
        container.appendChild(pie);
        const legend = h('div', { class: 'pie-legend' });
        block.segments.forEach(seg => {
          const item = h('div', { class: 'pie-legend-item' });
          item.appendChild(h('div', { class: 'pie-legend-color', style: `background: ${seg.color};` }));
          item.appendChild(h('span', { textContent: `${seg.label} (${seg.value}%)` }));
          legend.appendChild(item);
        });
        container.appendChild(legend);
        return container;
      }
      case 'modal': {
        const wrapper = h('div', { class: 'modal-block' });
        const btn = h('button', { class: 'modal-open-btn', textContent: block.buttonText || 'Открыть', type: 'button' });
        wrapper.appendChild(btn);
        btn.addEventListener('click', () => {
          const overlay = h('div', { class: 'modal-overlay' });
          const content = h('div', { class: 'modal-content' });
          const closeBtn = h('button', { class: 'modal-close', textContent: '×', type: 'button' });
          closeBtn.addEventListener('click', () => overlay.remove());
          content.appendChild(closeBtn);
          if (block.content) renderBlocks(block.content, content);
          else if (block.text) content.appendChild(h('p', { textContent: block.text }));
          overlay.appendChild(content);
          document.body.appendChild(overlay);
          postProcess(content);
          overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.remove();
          });
        });
        return wrapper;
      }
      case 'tooltip': {
        const tooltip = h('span', { class: 'tooltip', textContent: block.text });
        const tip = h('span', { class: 'tooltip-text', textContent: block.tooltipText });
        tooltip.appendChild(tip);
        return tooltip;
      }
      case 'mermaid': {
        const container = h('div', { class: 'mermaid', textContent: block.code });
        return container;
      }
      case 'svg': {
        const container = h('div', { class: 'svg-container' });
        const wrapper = h('div', { class: 'svg-wrapper' });
        wrapper.innerHTML = block.code;
        container.appendChild(wrapper);
        if (block.caption) {
          container.appendChild(h('div', { class: 'svg-caption', textContent: block.caption }));
        }
        return container;
      }
      case 'html': {
        const container = h('div', { class: 'html-block' });
        container.innerHTML = block.code;
        return container;
      }
      case 'drag-sort': {
        const container = h('div', { class: 'drag-sort' });
        if (block.instruction) container.appendChild(h('p', { class: 'text', textContent: block.instruction }));
        const list = h('ul', { class: 'drag-sort-list' });
        let items = [...block.items];
        const renderList = () => {
          list.innerHTML = '';
          items.forEach((item, index) => {
            const li = h('li', { class: 'drag-sort-item', draggable: 'true', textContent: item, dataset: { index: index } });
            li.addEventListener('dragstart', (e) => {
              li.classList.add('dragging');
              e.dataTransfer.setData('text/plain', index.toString());
            });
            li.addEventListener('dragend', () => li.classList.remove('dragging'));
            li.addEventListener('dragover', (e) => e.preventDefault());
            li.addEventListener('drop', (e) => {
              e.preventDefault();
              const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
              const toIndex = index;
              if (fromIndex !== toIndex) {
                const [moved] = items.splice(fromIndex, 1);
                items.splice(toIndex, 0, moved);
                renderList();
              }
            });
            list.appendChild(li);
          });
        };
        renderList();
        container.appendChild(list);
        const checkBtn = h('button', { class: 'sort-check-btn', textContent: 'Проверить', type: 'button' });
        const result = h('div', { class: 'match-result' });
        checkBtn.addEventListener('click', () => {
          const isCorrect = JSON.stringify(items) === JSON.stringify(block.correctOrder);
          result.textContent = isCorrect ? 'Правильный порядок!' : 'Неправильно.';
          result.style.color = isCorrect ? 'var(--green)' : 'var(--pink)';
        });
        container.appendChild(checkBtn);
        container.appendChild(result);
        return container;
      }
      case 'progress-tracker': {
        const container = h('div', { class: 'progress-tracker' });
        block.tasks.forEach(task => {
          const step = h('div', { class: 'progress-step', textContent: task.label });
          step.addEventListener('click', () => step.classList.toggle('done'));
          container.appendChild(step);
        });
        return container;
      }
      default:
        console.warn('Unknown block type:', block.type);
        return null;
    }
  }

  // ---------- ИНИЦИАЛИЗАЦИЯ ----------
  async function init() {
    await openDB().catch(e => console.warn('IndexedDB не доступна', e));
    renderInitialState();
  }

  init();
})();
</script>
</body>
