<head>

<title>NEON LMS PLAYER</title>

<script>
document.addEventListener('DOMContentLoaded', function() {
if (window.mermaid) {
mermaid.initialize({ startOnLoad: false, theme: 'dark' });
}
});
window.addEventListener('error', function (ev) {
var errBox = document.getElementById('app');
if (errBox && errBox.innerHTML.trim() === '') {
errBox.innerHTML = '<div style="color:#ff2a6d;padding:20px;border:1px solid #ff2a6d;border-radius:8px;font-family:monospace;">Ошибка скрипта: ' + (ev.message || 'неизвестная ошибка') + '</div>';
}
});
</script>
<style>
:root {
--bg: #0a0e1a;
--panel: #111627;
--text: #d5e5ff;
--muted: #8b9bbf;
--cyan: #00f0ff;

--purple: #b967ff;

--shadow: 0 0 15px rgba(0,240,255,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
background: radial-gradient(ellipse at 20% 20%, #141b33 0%, var(--bg) 70%);
color: var(--text);
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

}
#app { max-width: 1200px; margin: 0 auto; }
.app-header {
display: flex; align-items: center; gap: 15px; padding: 15px 20px; margin-bottom: 20px;

}
.app-header .app-icon { font-size: 2.5em; line-height: 1; animation: glow 2s infinite alternate; }

to { text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan); }
}
.app-header .app-info { flex: 1; min-width: 200px; }
.app-header .app-name { font-size: 1.5em; font-weight: bold; color: #fff; text-shadow: 0 0 10px var(--cyan); }
.app-header .app-description { color: var(--muted); font-size: 0.9em; }
.app-header .app-version {
padding: 4px 10px; border: 1px solid var(--cyan); border-radius: 20px;
background: rgba(0,240,255,0.1); color: var(--cyan); font-size: 0.85em; white-space: nowrap;
}
.course-header {
text-align: center; padding: 40px 20px 30px; margin-bottom: 30px;
border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: center;
}
.course-title-row { display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
.course-header h1 { font-size: 2.5em; color: #fff; text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan); }
.course-header .description { color: var(--muted); margin: 10px 0; }
.badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
.badge { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: rgba(0,240,255,0.1); color: var(--cyan); font-size: 0.9em; }
.edit-course-btn {
background: rgba(0,240,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 6px;
cursor: pointer; transition: all 0.3s; font-size: 1.5em; line-height: 1; padding: 6px 10px;
display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px;
}
.edit-course-btn:hover { background: rgba(0,240,255,0.2); box-shadow: 0 0 10px rgba(0,240,255,0.3); transform: translateY(-2px); }
.lessons-nav { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; padding: 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
.lesson-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--text); cursor: pointer; transition: all 0.3s; font-size: 0.95em; }
.lesson-btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3); transform: translateY(-2px); }
.lesson-btn.active { background: rgba(0,240,255,0.15); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 15px rgba(0,240,255,0.4); }

.progress-container { margin: 20px 0; }

.progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }

.block-section { margin: 25px 0; padding: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow), inset 0 0 10px rgba(0,240,255,0.02); }
.block-section h2 { font-size: 1.8em; color: #fff; text-shadow: 0 0 10px var(--cyan); margin-bottom: 15px; }
.heading { color: #fff; text-shadow: 0 0 8px var(--purple); }
.text { margin: 10px 0; }
.figure { margin: 15px 0; text-align: center; }
.figure img, .figure video, .figure audio { max-width: 100%; border-radius: 6px; border: 1px solid var(--border); box-shadow: 0 0 12px rgba(0,240,255,0.2); display: block; margin: 0 auto; }

.tab-button.active { background: rgba(0,240,255,0.15); color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,240,255,0.4); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.accordion-item:hover { border-color: var(--cyan); }
.accordion-header { width: 100%; padding: 12px 18px; background: transparent; color: var(--text); text-align: left; cursor: pointer; font-size: 1em; display: flex; justify-content: space-between; align-items: center; border: none; transition: color 0.3s; }
.accordion-header:hover { color: var(--cyan); }
.accordion-header .icon { transition: transform 0.3s; }
.accordion-item.open .icon { transform: rotate(45deg); }
.accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: rgba(255,255,255,0.02); }
.accordion-body-inner { padding: 15px; }
.quiz, .multi-quiz, .match-container, .sort-container, .fill-blank, .poll, .drag-sort { margin: 15px 0; padding: 15px; border: 1px solid var(--border); border-radius: 8px; background: rgba(255,255,255,0.02); }
.quiz .question, .multi-quiz .question, .poll .question { font-weight: bold; color: #fff; margin-bottom: 10px; }
.quiz-option, .multi-quiz .option, .poll-option { display: block; margin: 8px 0; padding: 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: all 0.3s; }
.quiz-option:hover, .multi-quiz .option:hover, .poll-option:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.2); transform: translateX(5px); }
.quiz-option input, .multi-quiz .option input { margin-right: 10px; accent-color: var(--cyan); }
.quiz-option.correct { border-color: var(--green); background: rgba(5,255,161,0.1); }
.quiz-option.wrong { border-color: var(--pink); background: rgba(255,42,109,0.1); }
.quiz-button, .match-check-btn, .sort-check-btn, .fill-blank-check-btn { margin-top: 15px; padding: 10px 20px; background: rgba(0,240,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 6px; cursor: pointer; transition: all 0.3s; }
.quiz-button:hover, .match-check-btn:hover, .sort-check-btn:hover, .fill-blank-check-btn:hover { background: rgba(0,240,255,0.2); box-shadow: 0 0 15px rgba(0,240,255,0.4); transform: translateY(-2px); }
.quiz-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.quiz-feedback, .match-result, .fill-blank-feedback { margin-top: 10px; font-weight: bold; }
.match-item { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.match-item .term { min-width: 120px; }
.match-item select { background: #0a0c14; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; cursor: pointer; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
.match-item select:hover, .match-item select:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
.sort-list { list-style: none; padding: 0; margin: 10px 0; }
.sort-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 6px; margin: 5px 0; transition: all 0.2s; }
.sort-item:hover { background: rgba(255,255,255,0.05); }
.sort-item span { flex: 1; }
.sort-controls { display: flex; gap: 4px; }
.sort-btn { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--border); color: var(--cyan); width: 28px; height: 28px; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 0.9em; }
.sort-btn:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 8px rgba(0, 240, 255, 0.4); }
.fill-blank-input { background: #0a0c14; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; text-align: center; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
.fill-blank-input:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
.embed { margin: 15px 0; }
.embed iframe { width: 100%; height: 400px; border: 1px solid var(--border); border-radius: 8px; display: block; }
.columns { display: flex; gap: 20px; }
.column { flex: 1; min-width: 0; }
.carousel { position: relative; max-width: 800px; margin: 20px auto; overflow: hidden; border-radius: 8px; border: 1px solid var(--border); }
.carousel-track { display: flex; transition: transform 0.5s ease; }
.carousel-slide { min-width: 100%; flex-shrink: 0; box-sizing: border-box; }
.carousel-slide img { width: 100%; display: block; }
.carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 2em; padding: 0 15px; cursor: pointer; border-radius: 4px; z-index: 10; transition: all 0.3s; }
.carousel-btn:hover { background: rgba(0,240,255,0.7); color: #000; }
.carousel-btn.prev { left: 10px; }
.carousel-btn.next { right: 10px; }
.carousel-dots { text-align: center; padding: 10px 0; }
.carousel-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); margin: 0 5px; cursor: pointer; transition: all 0.3s; }
.carousel-dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.before-after { position: relative; max-width: 800px; margin: 20px auto; user-select: none; }
.before-after img { width: 100%; display: block; }
.before-after .after { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
.before-after .after img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

.before-after .divider::after { content: '⟷'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 50%; padding: 4px; }
.table-container { overflow-x: auto; margin: 15px 0; }
.table-container table { width: 100%; border-collapse: collapse; }
.table-container th, .table-container td { padding: 10px 15px; border: 1px solid var(--border); text-align: left; }
.table-container th { background: rgba(0,240,255,0.1); color: var(--cyan); }
.table-container tr:nth-child(even) { background: rgba(255,255,255,0.03); }
.chart-container { display: flex; align-items: flex-end; gap: 10px; height: 200px; margin: 20px 0; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 8px; }
.chart-bar { background: linear-gradient(to top, var(--cyan), var(--green)); border-radius: 4px 4px 0 0; min-width: 30px; position: relative; transition: height 0.3s; }
.chart-bar span { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 0.8em; }
.chart-bar-label { text-align: center; margin-top: 5px; font-size: 0.8em; color: var(--muted); }
.pie-chart { width: 150px; height: 150px; border-radius: 50%; margin: 20px auto; transition: transform 0.3s; }
.pie-chart:hover { transform: scale(1.05); }
.pie-legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
.pie-legend-item { display: flex; align-items: center; gap: 5px; }
.pie-legend-color { width: 15px; height: 15px; border-radius: 3px; }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.2s ease; }
.modal-content {
background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px;
max-width: 600px; width: 90%; position: relative; box-shadow: 0 0 30px rgba(0,240,255,0.3);
animation: slideUp 0.3s ease; max-height: 80vh; overflow-y: auto;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text); font-size: 1.5em; cursor: pointer; transition: color 0.3s; }
.modal-close:hover { color: var(--pink); }
.modal-open-btn { padding: 8px 16px; background: rgba(0,240,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 6px; cursor: pointer; transition: all 0.3s; }
.modal-open-btn:hover { background: rgba(0,240,255,0.2); box-shadow: 0 0 10px rgba(0,240,255,0.3); }
.tooltip { position: relative; display: inline-block; border-bottom: 1px dotted var(--cyan); cursor: help; }
.tooltip .tooltip-text { visibility: hidden; width: 200px; background: #0a0c14; color: var(--text); text-align: center; border-radius: 6px; padding: 5px; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -100px; opacity: 0; transition: opacity 0.3s; border: 1px solid var(--border); }
.tooltip:hover .tooltip-text { visibility: visible; opacity: 1; }
.drag-sort-list { list-style: none; padding: 0; }
.drag-sort-item { padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; margin: 5px 0; cursor: grab; user-select: none; transition: all 0.2s; }
.drag-sort-item:hover { background: rgba(255,255,255,0.08); }
.drag-sort-item.dragging { opacity: 0.5; border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,240,255,0.5); }
.steps-container { margin: 20px 0; }
.steps-header { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.step-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text); cursor: pointer; transition: all 0.3s; }
.step-btn:hover { border-color: var(--cyan); color: var(--cyan); }
.step-btn.active { background: rgba(0,240,255,0.15); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3); }
.step-content { padding: 15px; border: 1px solid var(--border); border-radius: 6px; }
.progress-tracker { display: flex; gap: 5px; flex-wrap: wrap; margin: 15px 0; }

.progress-step.done { background: rgba(5,255,161,0.15); border-color: var(--green); color: var(--green); box-shadow: 0 0 8px rgba(5,255,161,0.3); }
.mermaid { background: #0a0c14; padding: 10px; border-radius: 8px; overflow-x: auto; }
.speed-control { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px auto; padding: 4px 8px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 20px; width: fit-content; }
.speed-control label { font-size: 0.85em; color: var(--muted); }
.speed-control select { background: #0a0c14; color: var(--text); border: none; border-radius: 12px; padding: 4px 8px; cursor: pointer; outline: none; font-size: 0.9em; transition: box-shadow 0.3s; }
.speed-control select:hover, .speed-control select:focus { box-shadow: 0 0 8px rgba(0, 240, 255, 0.4); }

.compare-left { flex: 0 0 auto; width: 50%; background: var(--panel); overflow: hidden; padding: 15px; transition: width 0.1s; }
.compare-right { flex: 1; background: rgba(255, 255, 255, 0.02); padding: 15px; overflow: hidden; }
.compare-divider { flex: 0 0 4px; background: #fff; cursor: ew-resize; z-index: 10; box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); position: relative; }
.compare-divider::after { content: '⟷'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 50%; padding: 4px; font-size: 0.8em; }
.svg-container { margin: 15px 0; text-align: center; }

.course-manager { margin: 20px 0; padding: 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
.saved-course-item { display: flex; gap: 10px; align-items: center; margin: 5px 0; }
.toggle-manager-btn {
display: inline-block; padding: 8px 16px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
border-radius: 6px; cursor: pointer; transition: all 0.3s; margin-bottom: 10px; font-family: inherit; font-size: 0.95em;
}
.toggle-manager-btn:hover { background: rgba(0,240,255,0.1); box-shadow: 0 0 10px rgba(0,240,255,0.3); transform: translateY(-2px); }

<body>
<div id="app"></div>
<script>
(function() {
const app = document.getElementById('app');
let course = null;
let currentLessonId = null;
let courseProgress = {};
try {
courseProgress = JSON.parse(localStorage.getItem('lms_course_progress') || '{}');
if (!courseProgress || typeof courseProgress !== 'object') courseProgress = {};
} catch (e) {
courseProgress = {};
}
let completedLessons = new Set();
let themeStyleElement = null;
let editMode = true;
try {
const savedEditMode = localStorage.getItem('lms_edit_mode');
if (savedEditMode !== null) editMode = savedEditMode === '1';
} catch (e) {}
const DB_NAME = 'lms_courses_db';
const DB_VERSION = 1;
let db;
function openDB() {
return new Promise((resolve, reject) => {
if (!window.indexedDB) { reject(new Error('IndexedDB недоступна')); return; }
const request = indexedDB.open(DB_NAME, DB_VERSION);
request.onerror = () => reject(request.error);
request.onsuccess = () => {
db = request.result;
resolve(db);
};
request.onupgradeneeded = (event) => {
const database = event.target.result;
if (!database.objectStoreNames.contains('courses')) {
const store = database.createObjectStore('courses', { keyPath: 'id' });
store.createIndex('title', 'title', { unique: false });
}
};
});
}
async function saveCourseToDB(courseData, recordId) {
if (!db) await openDB();
return new Promise((resolve, reject) => {
const tx = db.transaction(['courses'], 'readwrite');
const store = tx.objectStore('courses');
const id = recordId || generateRecordId();
const record = {
id: id,
title: (courseData.meta && courseData.meta.title) || 'Без названия',
course: courseData
};
store.put(record);
tx.oncomplete = () => resolve();
tx.onerror = () => reject(tx.error);
});
}
function generateRecordId() {
if (window.crypto && crypto.randomUUID) {
return crypto.randomUUID();
}
return 'course-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
}
async function getAllCoursesFromDB() {
if (!db) await openDB();
return new Promise((resolve, reject) => {
const tx = db.transaction(['courses'], 'readonly');
const store = tx.objectStore('courses');
const request = store.getAll();
request.onsuccess = () => resolve(request.result || []);
request.onerror = () => reject(request.error);
});
}
async function deleteCourseFromDB(id) {
if (!db) await openDB();
return new Promise((resolve, reject) => {
const tx = db.transaction(['courses'], 'readwrite');
const store = tx.objectStore('courses');
store.delete(id);
tx.oncomplete = () => resolve();
tx.onerror = () => reject(tx.error);
});
}
function h(tag, attrs = {}, children = []) {
const el = document.createElement(tag);
for (const [key, value] of Object.entries(attrs)) {
if (key === 'class') el.className = value;
else if (key === 'textContent') el.textContent = value;
else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value);
else if (key === 'disabled') el.disabled = value;
else if (key === 'dataset') {
for (const [dataKey, dataValue] of Object.entries(value)) {
el.dataset[dataKey] = dataValue;
}
}
else el.setAttribute(key, value);
}
const childArr = Array.isArray(children) ? children : [children];
for (const child of childArr) {
if (child == null) continue;
el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
}
return el;
}
function slugify(text) {
return String(text == null ? '' : text).toLowerCase().trim().replace(/[^\wа-яё]+/gi, '-').replace(/^-+|-+$/g, '');
}
function getCourseKey(courseObj) {
return (courseObj.meta && courseObj.meta.id) || slugify(courseObj.meta && courseObj.meta.title) || 'default';
}
const defaultTheme = {
bg: '#0a0e1a', panel: '#111627', text: '#d5e5ff', muted: '#8b9bbf',
cyan: '#00f0ff', pink: '#ff2a6d', green: '#05ffa1', purple: '#b967ff', yellow: '#ffd700',
border: 'rgba(0, 240, 255, 0.25)', shadow: '0 0 15px rgba(0,240,255,0.1)'
};
function applyTheme(theme) {
if (!themeStyleElement) {
themeStyleElement = document.createElement('style');
document.head.appendChild(themeStyleElement);
}
const source = (theme && typeof theme === 'object' && Object.keys(theme).length > 0) ? theme : defaultTheme;
const vars = {};
for (const [key, value] of Object.entries(source)) {
vars[`--${key}`] = value;
}
const css = `:root { ${Object.entries(vars).map(([k, v]) => `${k}: ${v};`).join(' ')} }`;
themeStyleElement.textContent = css;
}
function setCourse(newCourse) {
course = newCourse;
if (!course.meta) course.meta = {};
if (!Array.isArray(course.lessons)) course.lessons = [];
if (!Array.isArray(course.meta.canvases)) course.meta.canvases = [];
currentLessonId = null;
const key = getCourseKey(course);
completedLessons = new Set(courseProgress[key] || []);
applyTheme(course.meta.theme || null);
renderInitialState();
updateSavedCoursesList();
if (courseManagerPanel) {
courseManagerPanel.style.display = 'none';
}
onCourseChangedForCanvas();
}
async function loadCourseFromObject(courseData, recordId) {
if (!courseData || typeof courseData !== 'object' || Array.isArray(courseData) || !courseData.meta || !courseData.lessons) {
throw new Error('Неверный формат курса: требуются поля meta и lessons');
}
const id = recordId || generateRecordId();
courseData.meta._recordId = id;
await saveCourseToDB(courseData, id);
setCourse(courseData);
}
async function loadCoursesFromData(data) {
let items = [];
if (Array.isArray(data)) {
items = data;
} else if (data && typeof data === 'object' && data.courses && Array.isArray(data.courses)) {
items = data.courses;
} else if (data && data.meta && data.lessons) {
items = [data];
} else {
throw new Error('Неверный формат данных: ожидается курс, массив курсов/URL или объект с полем courses');
}
const coursesArray = [];
const errors = [];
for (const item of items) {
if (typeof item === 'string') {
try {
const response = await fetch(item);
if (!response.ok) throw new Error(`HTTP ${response.status}`);
const courseData = await response.json();
if (courseData.meta && courseData.lessons) {
coursesArray.push(courseData);
} else {
throw new Error('URL не вернул корректный курс');
}
} catch (e) {
errors.push(`Ошибка загрузки ${item}: ${e.message}`);
}
} else if (item && item.meta && item.lessons) {
coursesArray.push(item);
} else {
errors.push(`Неизвестный элемент: ${JSON.stringify(item).substring(0, 100)}`);
}
}
if (coursesArray.length === 0) {
throw new Error('Нет успешно загруженных курсов');
}
for (const courseData of coursesArray) {
const id = generateRecordId();
if (!courseData.meta) courseData.meta = {};
courseData.meta._recordId = id;
await saveCourseToDB(courseData, id);
}
updateSavedCoursesList();
setCourse(coursesArray[0]);
return { count: coursesArray.length, errors };
}
let courseManagerPanel = null;
function toggleCourseManager() {
if (courseManagerPanel) {
const isHidden = courseManagerPanel.style.display === 'none';
courseManagerPanel.style.display = isHidden ? 'block' : 'none';
}
}
function setEditMode(value) {
editMode = !!value;
try {
localStorage.setItem('lms_edit_mode', editMode ? '1' : '0');
} catch (e) {}
if (currentLessonId) {
showLesson(currentLessonId);
} else {
renderInitialState();
}
}
function renderModeToggle() {

function renderProgress() {
if (!course) return null;
const total = course.lessons.length;
const done = [...completedLessons].filter(id => course.lessons.some(l => l.id === id)).length;
const percent = total > 0 ? Math.round((done / total) * 100) : 0;
const container = h('div', { class: 'progress-container' });
const label = h('div', { class: 'progress-label' });
label.appendChild(h('span', { textContent: 'Прогресс курса' }));
label.appendChild(h('span', { textContent: `${done}/${total} (${percent}%)` }));
const bar = h('div', { class: 'progress-bar' });
bar.appendChild(h('div', { class: 'progress-fill', style: `width: ${percent}%` }));
container.appendChild(label);
container.appendChild(bar);
return container;
}

async function updateSavedCoursesList() {
const listEl = document.getElementById('savedCoursesList');
if (!listEl) return;
listEl.innerHTML = '<p class="text">Загрузка списка...</p>';
try {
const courses = await getAllCoursesFromDB();
if (!document.body.contains(listEl)) return;
if (courses.length === 0) {
listEl.innerHTML = '<p class="text">Сохранённых курсов нет.</p>';
return;
}
listEl.innerHTML = '';
courses.forEach(record => {
const item = h('div', { class: 'saved-course-item' });
item.appendChild(h('span', { textContent: record.title || 'Без названия', style: 'flex:1;' }));
const loadBtn = h('button', { class: 'quiz-button', textContent: 'Загрузить', type: 'button' });
loadBtn.addEventListener('click', () => {
if (!record.course.meta) record.course.meta = {};
record.course.meta._recordId = record.id;
setCourse(record.course);
});
const delBtn = h('button', { class: 'quiz-button', textContent: 'Удалить', type: 'button', style: 'background: rgba(255,42,109,0.1); border-color: var(--pink); color: var(--pink);' });
delBtn.addEventListener('click', async () => {
if (confirm('Удалить курс "' + (record.title || 'Без названия') + '"?')) {
try {
await deleteCourseFromDB(record.id);
updateSavedCoursesList();
} catch (e) {
alert('Ошибка удаления: ' + e.message);
}
}
});
item.appendChild(loadBtn);
item.appendChild(delBtn);
listEl.appendChild(item);
});
} catch (e) {
listEl.innerHTML = '<p class="text">Ошибка загрузки списка.</p>';
console.error(e);
}
}
function openJSONEditor(initialValue, options = {}) {
const title = options.title || 'Редактор JSON';
const editorHeight = options.height || '300px';
const onSave = options.onSave;
const overlay = h('div', { class: 'modal-overlay' });
const content = h('div', { class: 'modal-content' });
const closeBtn = h('button', { class: 'modal-close', textContent: '×', type: 'button' });
closeBtn.addEventListener('click', () => overlay.remove());
content.appendChild(closeBtn);
content.appendChild(h('h3', { textContent: title, class: 'heading' }));
const textarea = h('textarea', { style: 'width:100%; height:' + editorHeight + '; background:#0a0c14; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:10px; font-family:monospace;' });
textarea.value = initialValue || '';
content.appendChild(textarea);
const buttonRow = h('div', { style: 'display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;' });
const saveBtn = h('button', { class: 'quiz-button', textContent: 'Сохранить', type: 'button' });
saveBtn.addEventListener('click', async () => {
let data;
try {
data = JSON.parse(textarea.value);
} catch (e) {
alert('Ошибка JSON: ' + e.message);
return;
}
try {
if (typeof onSave === 'function') {
await onSave(data);
}
overlay.remove();
} catch (e) {
alert('Ошибка сохранения: ' + e.message);
}
});
const cancelBtn = h('button', { class: 'quiz-button', textContent: 'Отмена', type: 'button' });
cancelBtn.addEventListener('click', () => overlay.remove());
buttonRow.appendChild(saveBtn);
buttonRow.appendChild(cancelBtn);
content.appendChild(buttonRow);
overlay.appendChild(content);
document.body.appendChild(overlay);
overlay.addEventListener('click', (e) => {
if (e.target === overlay) overlay.remove();
});
}

function readFormField(def, control) {
if (def.type === 'checkbox') {
const val = control.checked;
if (def.omitTrue && val) return undefined;
if (def.omitFalse && !val) return undefined;
return val;
}
if (def.type === 'number') {
const raw = String(control.value).trim();
if (raw === '') return undefined;
const num = Number(raw);
if (isNaN(num)) throw new Error('Поле "' + def.key + '": ожидается число');
return num;
}
if (def.type === 'select') {
return control.value === '' ? undefined : control.value;
}
if (def.type === 'json') {
const raw = String(control.value).trim();
if (raw === '') return undefined;
try {
return JSON.parse(raw);
} catch (e) {
throw new Error('Поле "' + def.key + '": некорректный JSON — ' + e.message);
}
}
const val = control.value;
return val === '' ? undefined : val;
}
function fillFormField(def, control, value) {
const isEmpty = (value === undefined || value === null);
if (def.type === 'checkbox') {
control.checked = isEmpty ? !!def.defaultChecked : !!value;
} else if (def.type === 'number') {
control.value = isEmpty ? '' : String(value);
} else if (def.type === 'select') {
control.value = isEmpty ? '' : String(value);
if (!isEmpty && control.value === '') {
const opt = document.createElement('option');
opt.value = String(value);
opt.textContent = String(value);
control.appendChild(opt);

<p><strong>Создание нового курса:</strong> используйте редактор JSON через кнопку "Новый курс" (доступна в режиме редактирования). Для генерации подробных лекций используйте «Генерацию промпта».</p>
<h4 style="color: #fff; margin-top: 10px;">🎨 Виртуальные холсты для заметок</h4>
<p>Плавающая кнопка <strong>🎨</strong> (sticky-кнопка) доступна при загруженном курсе. Её можно <strong>перетащить</strong> в любое место экрана — позиция фиксируется и запоминается между сессиями; обычный клик (без перетаскивания) открывает рабочее окно холстов. Кнопка 🎨 также есть в заголовке каждого урока.</p>
<p><strong>Инструменты рисования:</strong> карандаш (✏), маркер-выделитель (🖍), ластик (⌫ — удаляет штрихи целиком), линия (╱), стрелка (↗), прямоугольник (▭), эллипс (◯) и текст (T). Доступны палитра цветов, произвольный цвет, толщина линии, режим заливки фигур, отмена/повтор (Ctrl+Z / Ctrl+Y) и очистка холста. Горячие клавиши инструментов: P, H, E, L, A, R, O, T.</p>
<p><strong>Перемещение и масштаб холста:</strong> инструмент «Рука» (✋, клавиша V) — перетаскивание страницы; <strong>средняя кнопка мыши</strong> или <strong>удерживаемый пробел</strong> — временное перемещение любым инструментом; <strong>колесо мыши</strong> — прокрутка/панорамирование, <strong>Ctrl + колесо</strong> — масштабирование к курсору; <strong>щипок двумя пальцами</strong> на сенсорном экране — масштабирование, два пальца — перемещение. Кнопки панели: <code>−</code>/<code>+</code> — зум, <code>%</code> — сброс к 100 %, <code>▣</code> — вписать холст в окно, <code>1:1</code> — фактический размер. Клавиши: Ctrl + «+» / Ctrl + «−» / Ctrl + 0 (вписать) / Ctrl + 1 (100 %). Масштаб и позиция вида сохраняются для каждого холста отдельно.</p>
<p><strong>Управление холстами:</strong> в левой панели — список холстов курса: создание, дублирование, удаление, переименование, привязка к конкретному уроку, цвет фона и сетка. Также доступны экспорт в PNG, экспорт/импорт JSON холста.</p>
<p><strong>Окно холста</strong> можно перемещать за заголовок, изменять его размер за края и углы, разворачивать на весь экран (⤢) и переводить в нативный полноэкранный режим (⛶), сворачивать (—) и закрывать (×). Позиция и размер окна запоминаются.</p>
<p><strong>Хранение:</strong> все штрихи хранятся как векторные последовательности нормализованных координат (0…1 от размера виртуальной страницы 1280×800) в поле <code>meta.canvases</code> описания курса и автоматически сохраняются в IndexedDB вместе с курсом. Формат записи:</p>
<pre style="background:#0a0c14; padding:10px; border-radius:6px; overflow-x:auto;"><code>"canvases": [
{
"id": "cv-...", "title": "Холст 1", "lessonId": null,
"background": "#0a0c14", "showGrid": true,
"view": { "scale": 0.72, "cx": 640, "cy": 400 },
"createdAt": "...", "updatedAt": "...",
"strokes": [

{ "tool": "text", "color": "#ffffff", "text": "Заметка", "fontSize": 0.03, "points": [[0.3,0.1]] }
]
}
]</code></pre>
<h4 style="color: #fff; margin-top: 10px;">Редактирование блоков</h4>
<p>Откройте урок в режиме редактирования и наведите курсор на любой блок — появится панель инструментов: <code>✎</code> — редактировать блок, <code>↑</code>/<code>↓</code> — переместить, <code>＋</code> — добавить новый блок после текущего, <code>🗑</code> — удалить. Редактор блока содержит вкладки <strong>«Форма»</strong> и <strong>«JSON»</strong>.</p>
<h4 style="color: #fff; margin-top: 10px;">Аудио и видео</h4>
<p>Блоки <code>video</code> и <code>audio</code> поддерживают поля: <code>src</code> (URL медиафайла), <code>caption</code>, <code>mimeType</code> (определяется автоматически по расширению, если не задан), <code>speedControl</code> (переключатель скорости), <code>loop</code>, <code>muted</code>, <code>autoplay</code> (для видео автозапуск включается без звука из-за ограничений браузеров). Видео масштабируется на всю ширину блока; при ошибке загрузки отображается предупреждение со ссылкой.</p>
<h4 style="color: #fff; margin-top: 10px;">Размеры и масштабирование блоков</h4>
<p>Любой блок поддерживает поля <code>width</code>, <code>height</code>, <code>maxWidth</code>, <code>maxHeight</code>, <code>minWidth</code>, <code>minHeight</code> и флаг <code>autoScale</code> (по умолчанию включён). Для медиаблоков размеры применяются непосредственно к медиаэлементу с сохранением пропорций. Для контейнерных блоков при заданной высоте включается внутренняя прокрутка, поэтому содержимое не перекрывает последующие блоки.</p>
<h4 style="color: #fff; margin-top: 10px;">График функции (тип <code>graph</code>)</h4>
<p>2D (<code>y = f(x)</code>), 3D-поверхность (<code>z = f(x,y)</code>), параметрические кривые (<code>parametric: true</code> + <code>paramX/paramY/paramZ</code>). Интерактивные параметры — массив <code>params</code> отображаются как слайдеры.</p>
<h4 style="color: #fff; margin-top: 10px;">3D объект (тип <code>model3d</code>)</h4>
<p>Просмотр 3D-моделей <code>.glb</code>/<code>.gltf</code>: по URL (поле <code>src</code>) или из локального файла. В панели доступно управление освещением: пресеты (<code>lightPreset</code>: studio, warm, cold, night, neon), интенсивность и цвет ключевого света (<code>lightIntensity</code>, <code>lightColor</code>), интенсивность и цвет рассеянного света (<code>ambientIntensity</code>, <code>ambientColor</code>), цвет фона (<code>background</code>), автовращение (<code>autoRotate</code>) и видимость сетки (<code>showGrid</code>).</p>
<h4 style="color: #fff; margin-top: 10px;">Дополнительные типы блоков</h4>
<p><code>flashcards</code>, <code>checklist</code>, <code>quote</code>, <code>glossary</code>, <code>equation</code>, <code>youtube</code>, <code>kanban</code>, <code>stats</code>, <code>countdown</code>, <code>tree</code>, <code>truefalse</code>, <code>divider</code>, <code>download</code>, <code>hotspots</code>, <code>crossword</code>.</p>
`;

function getCourseCanvases() {
if (!course) return [];
if (!course.meta) course.meta = {};
if (!Array.isArray(course.meta.canvases)) course.meta.canvases = [];
return course.meta.canvases;
}
function createCanvasRecord(title) {
const list = getCourseCanvases();
const nowIso = new Date().toISOString();
return {
id: 'cv-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7),
title: title || ('Холст ' + (list.length + 1)),
createdAt: nowIso,
updatedAt: null,
background: '#0a0c14',
showGrid: true,
lessonId: null,
view: null,
strokes: []
};
}
function normalizeCanvasRecord(rec) {
if (!rec || typeof rec !== 'object') return null;
if (!rec.id) rec.id = 'cv-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
if (typeof rec.title !== 'string' || !rec.title) rec.title = 'Холст';
if (!Array.isArray(rec.strokes)) rec.strokes = [];
rec.strokes = rec.strokes.filter(s => s && typeof s === 'object' && Array.isArray(s.points));
if (typeof rec.background !== 'string') rec.background = '#0a0c14';
if (typeof rec.showGrid !== 'boolean') rec.showGrid = true;
if (rec.lessonId == null) rec.lessonId = null;
if (!rec.view || typeof rec.view !== 'object') rec.view = null;
return rec;
}
async function persistCanvases() {
if (!course) return;
await persistCourse();
updateCanvasFab();
}
function lessonTitleById(id) {
if (!course || !id) return '';
const found = course.lessons.find(l => l.id === id);
return found ? (found.title || found.id) : id;
}
function downloadBlob(blob, filename) {
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = filename;
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(() => URL.revokeObjectURL(url), 3000);
}

// ---------- Плавающая (sticky) кнопка открытия холстов ----------
function createCanvasFab() {
if (canvasFab) return canvasFab;
const fab = h('button', {
class: 'canvas-fab',
type: 'button',
title: 'Виртуальные холсты — перетащите, чтобы закрепить кнопку в удобном месте'
});
fab.appendChild(h('span', { textContent: '🎨' }));
const badge = h('span', { class: 'fab-badge' });
fab.appendChild(badge);
const hint = h('span', { class: 'fab-hint', textContent: 'Холсты заметок · перетащите меня' });
fab.appendChild(hint);
document.body.appendChild(fab);
canvasFab = fab;
let fabDrag = null;
fab.addEventListener('pointerdown', (e) => {
if (e.button !== 0 && e.pointerType === 'mouse') return;
const rect = fab.getBoundingClientRect();
fabDrag = { startX: e.clientX, startY: e.clientY, origLeft: rect.left, origTop: rect.top, moved: false };
try { fab.setPointerCapture(e.pointerId); } catch (err) {}
});
fab.addEventListener('pointermove', (e) => {
if (!fabDrag) return;
const dx = e.clientX - fabDrag.startX;
const dy = e.clientY - fabDrag.startY;
if (!fabDrag.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
fabDrag.moved = true;
fab.classList.add('dragging');
const size = fab.offsetWidth || 58;
let nx = fabDrag.origLeft + dx;
let ny = fabDrag.origTop + dy;
nx = Math.max(4, Math.min(nx, window.innerWidth - size - 4));
ny = Math.max(4, Math.min(ny, window.innerHeight - size - 4));
fab.style.left = nx + 'px';
fab.style.top = ny + 'px';
fab.style.right = 'auto';
fab.style.bottom = 'auto';
});
const fabRelease = () => {
if (!fabDrag) return;
const wasMoved = fabDrag.moved;
fabDrag = null;
fab.classList.remove('dragging');
if (wasMoved) {
saveCanvasFabPosition();
} else {
openCanvasWorkspace();
}
};
fab.addEventListener('pointerup', fabRelease);
fab.addEventListener('pointercancel', fabRelease);
window.addEventListener('resize', () => { clampCanvasFabPosition(); });
restoreCanvasFabPosition();
return fab;
}
function saveCanvasFabPosition() {
if (!canvasFab) return;
try {
const rect = canvasFab.getBoundingClientRect();
localStorage.setItem(CANVAS_FAB_POS_KEY, JSON.stringify({ x: Math.round(rect.left), y: Math.round(rect.top) }));
} catch (e) {}
}
function clampCanvasFabPosition() {
if (!canvasFab) return;
const size = canvasFab.offsetWidth || 58;
let x = parseFloat(canvasFab.style.left);
let y = parseFloat(canvasFab.style.top);
if (!isFinite(x)) x = window.innerWidth - size - 24;
if (!isFinite(y)) y = window.innerHeight - size - 24;
x = Math.max(4, Math.min(x, Math.max(4, window.innerWidth - size - 4)));
y = Math.max(4, Math.min(y, Math.max(4, window.innerHeight - size - 4)));
canvasFab.style.left = x + 'px';
canvasFab.style.top = y + 'px';
canvasFab.style.right = 'auto';
canvasFab.style.bottom = 'auto';
}
function restoreCanvasFabPosition() {
if (!canvasFab) return;
let pos = null;
try { pos = JSON.parse(localStorage.getItem(CANVAS_FAB_POS_KEY) || 'null'); } catch (e) {}
const size = canvasFab.offsetWidth || 58;
let x = (pos && isFinite(pos.x)) ? pos.x : (window.innerWidth - size - 24);
let y = (pos && isFinite(pos.y)) ? pos.y : (window.innerHeight - size - 24);
canvasFab.style.left = x + 'px';
canvasFab.style.top = y + 'px';
clampCanvasFabPosition();
}
function updateCanvasFab() {
if (!canvasFab) createCanvasFab();
if (!canvasFab) return;
canvasFab.classList.toggle('visible', !!course);
const badge = canvasFab.querySelector('.fab-badge');
if (badge) {
const count = course ? getCourseCanvases().length : 0;
if (count > 0) { badge.textContent = String(count); badge.classList.add('visible'); }
else badge.classList.remove('visible');
}
clampCanvasFabPosition();
}
function openCanvasWorkspace(canvasId) {
if (!course) {
alert('Холсты привязываются к курсу. Сначала загрузите курс («Управление курсами»).');
return;
}
if (!canvasWorkspace) {
canvasWorkspace = createCanvasWorkspace();
document.body.appendChild(canvasWorkspace.root);
}
canvasWorkspace.open(canvasId);
}
function openCanvasWorkspaceForLesson(lessonId) {
if (!course) { openCanvasWorkspace(); return; }
const list = getCourseCanvases();
const linked = list.filter(c => c.lessonId === lessonId);
if (linked.length > 0) { openCanvasWorkspace(linked[0].id); return; }
if (!canvasWorkspace) {
canvasWorkspace = createCanvasWorkspace();
document.body.appendChild(canvasWorkspace.root);
}
canvasWorkspace.open(null);
const rec = createCanvasRecord(lessonTitleById(lessonId) ? ('Заметки: ' + lessonTitleById(lessonId)) : 'Холст урока');
rec.lessonId = lessonId;
list.push(rec);
canvasWorkspace.open(rec.id);
persistCanvases().catch(e => console.warn('Не удалось сохранить холст:', e));
}
function onCourseChangedForCanvas() {
updateCanvasFab();
if (canvasWorkspace) canvasWorkspace.handleCourseChange();
}

if (canvasWorkspace) canvasWorkspace.handleLessonChange();

function startResize(e, dir, el) {
if (root.classList.contains('maximized')) return;
e.preventDefault();
e.stopPropagation();
const start = root.getBoundingClientRect();
const sx = e.clientX, sy = e.clientY;
const minW = 320, minH = 240;
try { el.setPointerCapture(e.pointerId); } catch (err) {}
root.classList.add('resizing');
function move(ev) {
const dx = ev.clientX - sx;
const dy = ev.clientY - sy;
let x = start.left, y = start.top, w = start.width, hh = start.height;
if (dir.indexOf('e') !== -1) w = Math.max(minW, start.width + dx);
if (dir.indexOf('s') !== -1) hh = Math.max(minH, start.height + dy);
if (dir.indexOf('w') !== -1) { w = Math.max(minW, start.width - dx); x = start.left + (start.width - w); }
if (dir.indexOf('n') !== -1) { hh = Math.max(minH, start.height - dy); y = start.top + (start.height - hh); }
x = Math.max(0, Math.min(x, window.innerWidth - 80));
y = Math.max(0, Math.min(y, window.innerHeight - 40));
w = Math.min(w, window.innerWidth - x);
hh = Math.min(hh, window.innerHeight - y);
root.style.left = x + 'px';
root.style.top = y + 'px';
root.style.width = w + 'px';
root.style.height = hh + 'px';
}
function up() {
root.classList.remove('resizing');
el.removeEventListener('pointermove', move);
el.removeEventListener('pointerup', up);
el.removeEventListener('pointercancel', up);
saveWinRect();
resizeSurface();
}
el.addEventListener('pointermove', move);
el.addEventListener('pointerup', up);
el.addEventListener('pointercancel', up);
}

// ---------- Геометрия окна ----------
function loadWinRect() {
try {
const r = JSON.parse(localStorage.getItem(CANVAS_WIN_POS_KEY) || 'null');
if (r && isFinite(r.w) && isFinite(r.h)) return r;
} catch (e) {}
const w = Math.min(1040, Math.max(320, window.innerWidth - 80));
const hh = Math.min(680, Math.max(280, window.innerHeight - 80));
return { x: Math.max(10, (window.innerWidth - w) / 2), y: Math.max(10, (window.innerHeight - hh) / 2), w: w, h: hh };
}
function applyWinRect() {
const r = loadWinRect();
root.style.left = Math.max(0, Math.min(r.x, window.innerWidth - 100)) + 'px';
root.style.top = Math.max(0, Math.min(r.y, window.innerHeight - 60)) + 'px';
root.style.width = Math.min(r.w, window.innerWidth) + 'px';
root.style.height = Math.min(r.h, window.innerHeight) + 'px';
}
function saveWinRect() {
if (root.classList.contains('maximized')) return;
try {
const r = root.getBoundingClientRect();
localStorage.setItem(CANVAS_WIN_POS_KEY, JSON.stringify({ x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) }));
} catch (e) {}
}

// ---------- ПРЕОБРАЗОВАНИЯ КООРДИНАТ (ЭКРАН ↔ СТРАНИЦА ХОЛСТА) ----------
function stageCoords(clientX, clientY) {
const rect = stageCanvas.getBoundingClientRect();
return [clientX - rect.left, clientY - rect.top];
}
function screenToDoc(sx, sy) {
return [(sx - view.x) / view.scale, (sy - view.y) / view.scale];
}
function docToScreen(dx, dy) {
return [dx * view.scale + view.x, dy * view.scale + view.y];
}
function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function toNorm(e) {
const sc = stageCoords(e.clientX, e.clientY);
const d = screenToDoc(sc[0], sc[1]);
return [clamp01(d[0] / DOC_W), clamp01(d[1] / DOC_H)];
}
function eraserRadiusDoc() {
return Math.max(6, (parseInt(sizeInput.value, 10) || 3) * 1.6) / view.scale;
}

// ---------- МАСШТАБ И ПАН ----------
function updateZoomLabel() {
const p = Math.round(view.scale * 100);
zoomLabel.textContent = p + '%';
stZoom.textContent = 'Масштаб: ' + p + '%';
}
function setZoom(newScale, anchor) {
const s = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
const ax = anchor ? anchor.x : W / 2;
const ay = anchor ? anchor.y : H / 2;
const docX = (ax - view.x) / view.scale;
const docY = (ay - view.y) / view.scale;
view.scale = s;
view.x = ax - docX * s;
view.y = ay - docY * s;
userAdjustedView = true;
afterViewChange();
}
function zoomBy(factor, anchor) {
setZoom(view.scale * factor, anchor);
}
function zoomFit() {
const s = Math.min(W / DOC_W, H / DOC_H) * 0.96;
view.scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, s));
view.x = (W - DOC_W * view.scale) / 2;
view.y = (H - DOC_H * view.scale) / 2;
userAdjustedView = false;
afterViewChange();
}
function panBy(dx, dy) {
view.x += dx;
view.y += dy;
userAdjustedView = true;
afterViewChange();
}
function afterViewChange() {
updateZoomLabel();
saveViewToRecord();
render();
}
function saveViewToRecord() {
const rec = activeRecord();
if (!rec) return;
rec.view = {
scale: view.scale,
cx: (W / 2 - view.x) / view.scale,
cy: (H / 2 - view.y) / view.scale
};
scheduleSave();
}
function restoreViewFromRecord(rec) {
if (rec && rec.view && isFinite(rec.view.scale) && rec.view.scale > 0) {
view.scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, rec.view.scale));
view.x = W / 2 - (Number(rec.view.cx) || DOC_W / 2) * view.scale;
view.y = H / 2 - (Number(rec.view.cy) || DOC_H / 2) * view.scale;
userAdjustedView = true;
} else {
zoomFit();
return;
}
updateZoomLabel();
}

// ---------- РЕНДЕР ----------
function resizeSurface() {
const rect = stage.getBoundingClientRect();
if (rect.width < 2 || rect.height < 2) return;
const dpr = window.devicePixelRatio || 1;
W = Math.max(1, Math.floor(rect.width));
H = Math.max(1, Math.floor(rect.height));
stageCanvas.width = Math.floor(W * dpr);
stageCanvas.height = Math.floor(H * dpr);
stageCanvas.style.width = W + 'px';
stageCanvas.style.height = H + 'px';
if (!userAdjustedView) {
zoomFit();
}
ensureBaseRes();
renderBase();
render();
}
function ensureBaseRes() {
const dpr = window.devicePixelRatio || 1;
const target = Math.max(1, Math.min(4, view.scale * dpr));
if (baseRes <= 0 || Math.abs(target - baseRes) / baseRes > 0.3) {
baseRes = target;
baseCanvas.width = Math.max(1, Math.round(DOC_W * baseRes));
baseCanvas.height = Math.max(1, Math.round(DOC_H * baseRes));
renderBase();
}
}
function currentCtxScale(ctx) {
try {
if (ctx.getTransform) {
const t = ctx.getTransform();
if (t && isFinite(t.a) && t.a > 0) return t.a;
}
} catch (e) {}
return view.scale;
}
function drawGrid(ctx) {
const sc = currentCtxScale(ctx);
let step = 40;
if (sc * step < 14) step = 160;
else if (sc * step > 200) step = 10;
ctx.save();
ctx.strokeStyle = 'rgba(0,240,255,0.08)';
ctx.lineWidth = 1 / Math.max(0.0001, sc);
ctx.beginPath();
for (let x = step; x < DOC_W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, DOC_H); }
for (let y = step; y < DOC_H; y += step) { ctx.moveTo(0, y); ctx.lineTo(DOC_W, y); }
ctx.stroke();
ctx.strokeStyle = 'rgba(0,240,255,0.16)';
ctx.lineWidth = 1.4 / Math.max(0.0001, sc);
ctx.beginPath();
const major = step * 5;
for (let x = major; x < DOC_W; x += major) { ctx.moveTo(x, 0); ctx.lineTo(x, DOC_H); }
for (let y = major; y < DOC_H; y += major) { ctx.moveTo(0, y); ctx.lineTo(DOC_W, y); }
ctx.stroke();
ctx.restore();
}
function drawArrowHead(ctx, x1, y1, x2, y2, lw) {
const ang = Math.atan2(y2 - y1, x2 - x1);
const len = Math.max(9, lw * 3.6);
ctx.beginPath();
ctx.moveTo(x2, y2);
ctx.lineTo(x2 - len * Math.cos(ang - Math.PI / 7), y2 - len * Math.sin(ang - Math.PI / 7));
ctx.lineTo(x2 - len * Math.cos(ang + Math.PI / 7), y2 - len * Math.sin(ang + Math.PI / 7));
ctx.closePath();
ctx.fill();
}
function drawStroke(ctx, s) {
if (!s || !Array.isArray(s.points) || s.points.length === 0) return;
const alpha = (s.opacity == null ? 1 : Number(s.opacity));
ctx.save();
ctx.lineJoin = 'round';
ctx.lineCap = (s.tool === 'highlighter') ? 'butt' : 'round';
ctx.strokeStyle = s.color || '#00f0ff';
ctx.fillStyle = s.color || '#00f0ff';
ctx.lineWidth = Math.max(0.5, Number(s.size) || 3);
ctx.globalAlpha = isFinite(alpha) ? alpha : 1;
if (s.tool === 'text') {
const p = s.points[0];
const fs = Math.max(6, (Number(s.fontSize) || 0.025) * DOC_H);
ctx.font = fs + "px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
ctx.textBaseline = 'top';
ctx.fillText(String(s.text || ''), p[0] * DOC_W, p[1] * DOC_H);
ctx.restore();
return;
}
const P = s.points.map(p => [Number(p[0]) * DOC_W, Number(p[1]) * DOC_H]);
const a = P[0];
const b = P[P.length - 1];
if (s.tool === 'line' || s.tool === 'arrow') {
ctx.beginPath();
ctx.moveTo(a[0], a[1]);
ctx.lineTo(b[0], b[1]);
ctx.stroke();
if (s.tool === 'arrow') drawArrowHead(ctx, a[0], a[1], b[0], b[1], ctx.lineWidth);
} else if (s.tool === 'rect') {
const x = Math.min(a[0], b[0]);
const y = Math.min(a[1], b[1]);
const w = Math.abs(b[0] - a[0]);
const hh = Math.abs(b[1] - a[1]);
if (s.fill) {
const ga = ctx.globalAlpha;
ctx.globalAlpha = ga * 0.22;
ctx.fillRect(x, y, w, hh);
ctx.globalAlpha = ga;
}
ctx.strokeRect(x, y, w, hh);
} else if (s.tool === 'ellipse') {
const cx = (a[0] + b[0]) / 2;
const cy = (a[1] + b[1]) / 2;
const rx = Math.max(0.5, Math.abs(b[0] - a[0]) / 2);
const ry = Math.max(0.5, Math.abs(b[1] - a[1]) / 2);
ctx.beginPath();
if (ctx.ellipse) ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
else ctx.arc(cx, cy, Math.max(rx, ry), 0, Math.PI * 2);
if (s.fill) {
const ga = ctx.globalAlpha;
ctx.globalAlpha = ga * 0.22;
ctx.fill();
ctx.globalAlpha = ga;
}
ctx.stroke();
} else {
ctx.beginPath();
ctx.moveTo(P[0][0], P[0][1]);
if (P.length < 3) {
if (P.length === 1) ctx.lineTo(P[0][0] + 0.6, P[0][1] + 0.6);
else ctx.lineTo(P[1][0], P[1][1]);
} else {
for (let i = 1; i < P.length - 1; i++) {
const mx = (P[i][0] + P[i + 1][0]) / 2;
const my = (P[i][1] + P[i + 1][1]) / 2;
ctx.quadraticCurveTo(P[i][0], P[i][1], mx, my);
}
ctx.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
}
ctx.stroke();
}
ctx.restore();
}
function renderBase() {
if (!bctx) return;
bctx.setTransform(baseRes, 0, 0, baseRes, 0, 0);
bctx.clearRect(0, 0, DOC_W, DOC_H);
const rec = activeRecord();
if (!rec) return;
rec.strokes.forEach(s => drawStroke(bctx, s));
}
function render() {
if (!mctx) return;
const rec = activeRecord();
const dpr = window.devicePixelRatio || 1;
mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
mctx.clearRect(0, 0, W, H);
mctx.fillStyle = '#05070f';
mctx.fillRect(0, 0, W, H);
ensureBaseRes();
mctx.save();
mctx.translate(view.x, view.y);
mctx.scale(view.scale, view.scale);
mctx.fillStyle = (rec && rec.background) || '#0a0c14';
mctx.fillRect(0, 0, DOC_W, DOC_H);
if (!rec || rec.showGrid !== false) drawGrid(mctx);
mctx.drawImage(baseCanvas, 0, 0, DOC_W, DOC_H);
if (currentStroke) drawStroke(mctx, currentStroke);
mctx.restore();
mctx.save();
mctx.strokeStyle = 'rgba(0,240,255,0.5)';
mctx.lineWidth = 1;
mctx.shadowColor = 'rgba(0,240,255,0.35)';
mctx.shadowBlur = 8;
mctx.strokeRect(view.x + 0.5, view.y + 0.5, DOC_W * view.scale - 1, DOC_H * view.scale - 1);
mctx.restore();
if (tool === 'eraser' && lastPointerScreen) {
mctx.save();
mctx.strokeStyle = 'rgba(255,42,109,0.9)';
mctx.lineWidth = 1.5;
mctx.beginPath();
mctx.arc(lastPointerScreen.x, lastPointerScreen.y, Math.max(6, (parseInt(sizeInput.value, 10) || 3) * 1.6), 0, Math.PI * 2);
mctx.stroke();
mctx.restore();
}
emptyHint.style.display = rec ? 'none' : 'flex';
}

// ---------- Пустое состояние ----------

emptyHint.appendChild(h('div', { textContent: '🎨 В этом курсе пока нет холстов для заметок.' }));
const emptyBtn = h('button', { class: 'canvas-side-btn', type: 'button', textContent: '＋ Создать первый холст' });
emptyBtn.addEventListener('click', () => createNewCanvas());

// ---------- Удаление штрихов ластиком ----------
function distToSegmentDoc(px, py, x1, y1, x2, y2) {
const dx = x2 - x1, dy = y2 - y1;
const len2 = dx * dx + dy * dy;
let t = len2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / len2;
t = Math.max(0, Math.min(1, t));
return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function strokeHit(s, nx, ny, rDoc) {
if (!s || !Array.isArray(s.points) || s.points.length === 0) return false;
const px = nx * DOC_W, py = ny * DOC_H;
const tol = (Number(s.size) || 3) / 2 + rDoc;
if (s.tool === 'text') {
const p = s.points[0];
const fs = Math.max(6, (Number(s.fontSize) || 0.025) * DOC_H);
const wApprox = String(s.text || '').length * fs * 0.55;
return px >= p[0] * DOC_W - rDoc && px <= p[0] * DOC_W + wApprox + rDoc && py >= p[1] * DOC_H - rDoc && py <= p[1] * DOC_H + fs + rDoc;
}
const a = s.points[0];
const b = s.points[s.points.length - 1];
if (s.tool === 'line' || s.tool === 'arrow') {
return distToSegmentDoc(px, py, a[0] * DOC_W, a[1] * DOC_H, b[0] * DOC_W, b[1] * DOC_H) <= tol;
}
if (s.tool === 'rect') {
const x1 = Math.min(a[0], b[0]) * DOC_W, y1 = Math.min(a[1], b[1]) * DOC_H;
const x2 = Math.max(a[0], b[0]) * DOC_W, y2 = Math.max(a[1], b[1]) * DOC_H;
if (s.fill && px >= x1 && px <= x2 && py >= y1 && py <= y2) return true;
return distToSegmentDoc(px, py, x1, y1, x2, y1) <= tol ||
distToSegmentDoc(px, py, x2, y1, x2, y2) <= tol ||
distToSegmentDoc(px, py, x2, y2, x1, y2) <= tol ||
distToSegmentDoc(px, py, x1, y2, x1, y1) <= tol;
}
if (s.tool === 'ellipse') {
const cx = (a[0] + b[0]) / 2 * DOC_W, cy = (a[1] + b[1]) / 2 * DOC_H;
const rx = Math.max(1, Math.abs(b[0] - a[0]) / 2 * DOC_W);
const ry = Math.max(1, Math.abs(b[1] - a[1]) / 2 * DOC_H);
const v = Math.pow((px - cx) / rx, 2) + Math.pow((py - cy) / ry, 2);
if (s.fill && v <= 1) return true;
return Math.abs(Math.sqrt(v) - 1) * Math.min(rx, ry) <= tol;
}
for (let i = 0; i < s.points.length; i++) {
const p = s.points[i];
if (i > 0) {
const q = s.points[i - 1];
if (distToSegmentDoc(px, py, q[0] * DOC_W, q[1] * DOC_H, p[0] * DOC_W, p[1] * DOC_H) <= tol) return true;
} else if (Math.hypot(p[0] * DOC_W - px, p[1] * DOC_H - py) <= tol) return true;
}
return false;
}
function eraseAt(nx, ny) {
const rec = activeRecord();
if (!rec) return;
const rDoc = eraserRadiusDoc();
const kept = rec.strokes.filter(s => !strokeHit(s, nx, ny, rDoc));
if (kept.length !== rec.strokes.length) rec.strokes = kept;
}

// ---------- ЖЕСТЫ: ПАН И ПИНЧ ----------
function beginPan(e) {
panning = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
try { stageCanvas.setPointerCapture(e.pointerId); } catch (err) {}
root.classList.add('panning');
}
function endPan() {
if (!panning) return;
panning = null;
root.classList.remove('panning');
saveViewToRecord();
}
function beginPinch() {
if (pointers.size < 2) return;
const pts = [...pointers.values()];
const rect = stageCanvas.getBoundingClientRect();
const cx = (pts[0].x + pts[1].x) / 2 - rect.left;
const cy = (pts[0].y + pts[1].y) / 2 - rect.top;
pinch = {
dist: Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y)),
ax: cx, ay: cy,
scale: view.scale, vx: view.x, vy: view.y
};
if (strokeHistoryPushed) {
const rec = activeRecord();
if (rec) {
const hh = history(rec.id);
if (hh.undo.length > 0) rec.strokes = hh.undo.pop();
}
strokeHistoryPushed = false;
updateHistoryButtons();
}
currentStroke = null;
drawing = false;
erasing = false;
root.classList.add('panning');
render();
}
function updatePinch() {
if (!pinch || pointers.size < 2) return;
const pts = [...pointers.values()];
const rect = stageCanvas.getBoundingClientRect();
const dist = Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y));
const cx = (pts[0].x + pts[1].x) / 2 - rect.left;
const cy = (pts[0].y + pts[1].y) / 2 - rect.top;
const factor = dist / pinch.dist;
const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinch.scale * factor));
const docX = (pinch.ax - pinch.vx) / pinch.scale;
const docY = (pinch.ay - pinch.vy) / pinch.scale;
view.scale = newScale;
view.x = cx - docX * newScale;
view.y = cy - docY * newScale;
userAdjustedView = true;
ensureBaseRes();
updateZoomLabel();
render();
}
function endPinch() {
if (!pinch) return;
pinch = null;
root.classList.remove('panning');
saveViewToRecord();
}

// ---------- Колесо мыши: пан / зум ----------
stageCanvas.addEventListener('wheel', (e) => {
e.preventDefault();
const sc = stageCoords(e.clientX, e.clientY);
if (e.ctrlKey || e.metaKey) {
const factor = Math.exp(-e.deltaY * 0.01);
zoomBy(factor, { x: sc[0], y: sc[1] });
} else {
panBy(-e.deltaX, -e.deltaY);
}
}, { passive: false });

// ---------- Рисование ----------
function makeStroke(t, p) {
const s = { tool: t, color: colorInput.value, size: parseInt(sizeInput.value, 10) || 3, points: [p] };
if (t === 'highlighter') { s.opacity = 0.3; s.size = Math.max(8, s.size * 4); }
if (t === 'rect' || t === 'ellipse' || t === 'line' || t === 'arrow') {
s.points = [p, [p[0], p[1]]];
s.fill = !!fillCheck.checked;
}
return s;
}
function pushHistory(rec) {
const hh = history(rec.id);
hh.undo.push(rec.strokes);
if (hh.undo.length > 100) hh.undo.shift();
hh.redo.length = 0;
updateHistoryButtons();
}
stageCanvas.addEventListener('pointerdown', (e) => {
const sc = stageCoords(e.clientX, e.clientY);
lastPointerScreen = { x: sc[0], y: sc[1] };
pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
if (pointers.size === 2) {
e.preventDefault();
beginPinch();
return;
}
const rec = activeRecord();
if (!rec) return;
const isMiddle = (e.pointerType === 'mouse' && e.button === 1);
const wantPan = (tool === 'pan') || spaceDown || isMiddle;
if (wantPan) {
e.preventDefault();
beginPan(e);
return;
}
if (e.pointerType === 'mouse' && e.button !== 0) return;
e.preventDefault();
try { stageCanvas.setPointerCapture(e.pointerId); } catch (err) {}
const p = toNorm(e);
if (tool === 'text') { openTextInput(p, sc); return; }
drawing = true;
pushHistory(rec);
strokeHistoryPushed = true;
if (tool === 'eraser') {
erasing = true;
eraseAt(p[0], p[1]);
renderBase();
render();
} else {
currentStroke = makeStroke(tool, p);
render();
}
});
stageCanvas.addEventListener('pointermove', (e) => {
if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
const sc = stageCoords(e.clientX, e.clientY);
lastPointerScreen = { x: sc[0], y: sc[1] };
if (pinch && pointers.size >= 2) { updatePinch(); return; }
if (panning && e.pointerId === panning.id) {
view.x = panning.ox + (e.clientX - panning.sx);
view.y = panning.oy + (e.clientY - panning.sy);
userAdjustedView = true;
updateZoomLabel();
render();
return;
}
const d = screenToDoc(sc[0], sc[1]);
stPos.textContent = 'x: ' + Math.round(d[0]) + ' y: ' + Math.round(d[1]);
if (!drawing) { if (tool === 'eraser') render(); return; }
const rec = activeRecord();
if (!rec) return;
const p = toNorm(e);
if (erasing) {
eraseAt(p[0], p[1]);
renderBase();
render();
return;
}
if (!currentStroke) return;
if (currentStroke.tool === 'pencil' || currentStroke.tool === 'highlighter') {
const last = currentStroke.points[currentStroke.points.length - 1];
const threshold = 1.4 / Math.max(0.05, view.scale) / DOC_W;
const dx = p[0] - last[0];
const dy = (p[1] - last[1]) * (DOC_H / DOC_W);
if (Math.hypot(dx, dy) < threshold) return;
currentStroke.points.push(p);
} else {
currentStroke.points[1] = p;
}
render();
});
const endStroke = (e) => {
if (e && pointers.has(e.pointerId)) pointers.delete(e.pointerId);
if (pinch && pointers.size < 2) endPinch();
if (panning && (!e || e.pointerId === panning.id)) endPan();
if (!drawing) return;
drawing = false;
strokeHistoryPushed = false;
const rec = activeRecord();
if (erasing) {
erasing = false;
renderBase();
render();
if (rec) afterChange(rec);
updateHistoryButtons();
return;
}
if (currentStroke && rec) {
let keep = true;
if (currentStroke.tool === 'pencil' || currentStroke.tool === 'highlighter') {
if (currentStroke.points.length === 1) {
currentStroke.points.push([
Math.min(1, currentStroke.points[0][0] + 0.002),
Math.min(1, currentStroke.points[0][1] + 0.002)
]);
}
} else {
const a = currentStroke.points[0];
const b = currentStroke.points[1];
if (Math.hypot((b[0] - a[0]) * DOC_W, (b[1] - a[1]) * DOC_H) * view.scale < 3) keep = false;
}
if (keep) {
rec.strokes = rec.strokes.concat([currentStroke]);
} else {
const hh = history(rec.id);
hh.undo.pop();
hh.redo.length = 0;
}
}
currentStroke = null;
renderBase();
render();
if (rec) afterChange(rec);
updateHistoryButtons();
};
stageCanvas.addEventListener('pointerup', endStroke);
stageCanvas.addEventListener('pointercancel', endStroke);
stageCanvas.addEventListener('pointerleave', () => {
if (!drawing && !panning) stPos.textContent = 'x: — y: —';
});
stageCanvas.addEventListener('contextmenu', (e) => e.preventDefault());

function openTextInput(p, sc) {
const rec = activeRecord();
if (!rec) return;
const existing = stage.querySelector('.canvas-text-input');
if (existing) existing.remove();
const baseSize = (parseInt(sizeInput.value, 10) || 3) * 5;
const fsScreen = Math.max(12, baseSize * view.scale);
const inp = h('input', { type: 'text', class: 'canvas-text-input', placeholder: 'Текст → Enter' });
inp.style.left = Math.max(2, sc.x) + 'px';
inp.style.top = Math.max(2, sc.y) + 'px';
inp.style.color = colorInput.value;
inp.style.fontSize = fsScreen + 'px';
inp.style.maxWidth = Math.max(120, W - sc.x - 8) + 'px';
stage.appendChild(inp);
setTimeout(() => inp.focus(), 10);
let finished = false;
const commit = () => {
if (finished) return;
finished = true;
const value = inp.value.trim();
const color = colorInput.value;
inp.remove();
if (!value) return;
const cur = activeRecord();
if (!cur) return;
pushHistory(cur);
const docFontSize = fsScreen / Math.max(0.05, view.scale);
cur.strokes = cur.strokes.concat([{
tool: 'text',
color: color,
text: value,
fontSize: docFontSize / DOC_H,
points: [p]
}]);
renderBase();
render();
afterChange(cur);
};
inp.addEventListener('keydown', (e) => {
e.stopPropagation();
if (e.key === 'Enter') { e.preventDefault(); commit(); }
else if (e.key === 'Escape') { finished = true; inp.remove(); }
});
inp.addEventListener('blur', commit);
}

function doUndo() {
const rec = activeRecord();
if (!rec) return;
const hh = history(rec.id);
if (hh.undo.length === 0) return;
hh.redo.push(rec.strokes);
rec.strokes = hh.undo.pop();
renderBase();
render();
afterChange(rec);
updateHistoryButtons();
}
function doRedo() {
const rec = activeRecord();
if (!rec) return;
const hh = history(rec.id);
if (hh.redo.length === 0) return;

rec.strokes = hh.redo.pop();

function itemMeta(rec) {

return 'штрихов';
}

function exportPNG() {
const rec = activeRecord();
if (!rec) return;
const scale = 2;
const c = document.createElement('canvas');
c.width = Math.round(DOC_W * scale);
c.height = Math.round(DOC_H * scale);
const ctx = c.getContext('2d');
ctx.setTransform(scale, 0, 0, scale, 0, 0);
ctx.fillStyle = rec.background || '#0a0c14';
ctx.fillRect(0, 0, DOC_W, DOC_H);
if (rec.showGrid !== false) drawGrid(ctx);
rec.strokes.forEach(s => drawStroke(ctx, s));
c.toBlob((blob) => {
if (!blob) { alert('Не удалось сформировать PNG.'); return; }
downloadBlob(blob, slugify(rec.title || 'canvas') + '.png');
}, 'image/png');
}
function exportJSON() {

function setTool(id) {

CANVAS_TOOL_LIST.forEach(t => {
if (toolButtons[t.id]) toolButtons[t.id].classList.toggle('active', t.id === id);
});
if (id === 'pan') stageCanvas.style.cursor = 'grab';
else if (id === 'eraser') stageCanvas.style.cursor = 'cell';
else if (id === 'text') stageCanvas.style.cursor = 'text';
else stageCanvas.style.cursor = 'crosshair';
updateStatus();

}
function syncSwatches() {
const cur = colorInput.value.toLowerCase();
swatchEls.forEach((sw, i) => sw.classList.toggle('active', CANVAS_SWATCHES[i].toLowerCase() === cur));
}

// ---------- Горячие клавиши ----------
const HOTKEYS = {};
CANVAS_TOOL_LIST.forEach(t => { HOTKEYS[t.hotkey] = t.id; });
document.addEventListener('keydown', (e) => {
if (e.code === 'Space' && isVisible()) {
const t = e.target;
if (!(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'))) {
if (!spaceDown) {
spaceDown = true;
root.classList.add('space-pan');
}
e.preventDefault();
}
}
if (!isVisible()) return;
const t = e.target;
if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
const k = (e.key || '').toLowerCase();
if ((e.ctrlKey || e.metaKey) && (k === 'z') && !e.shiftKey) { e.preventDefault(); doUndo(); return; }
if ((e.ctrlKey || e.metaKey) && (k === 'y' || (e.shiftKey && k === 'z'))) { e.preventDefault(); doRedo(); return; }
if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); doSave(); return; }
if ((e.ctrlKey || e.metaKey) && (k === '=' || k === '+')) { e.preventDefault(); zoomBy(1.25, null); return; }
if ((e.ctrlKey || e.metaKey) && (k === '-' || k === '_')) { e.preventDefault(); zoomBy(1 / 1.25, null); return; }
if ((e.ctrlKey || e.metaKey) && k === '0') { e.preventDefault(); zoomFit(); return; }
if ((e.ctrlKey || e.metaKey) && k === '1') { e.preventDefault(); setZoom(1, null); return; }
if (e.altKey && k === 'escape') { e.preventDefault(); hideWindow(); return; }
if (!e.ctrlKey && !e.metaKey && !e.altKey && HOTKEYS[k]) { e.preventDefault(); setTool(HOTKEYS[k]); return; }
if (!e.ctrlKey && !e.metaKey && !e.altKey && (k === 'arrowleft' || k === 'arrowright' || k === 'arrowup' || k === 'arrowdown')) {
e.preventDefault();
const stepPx = e.shiftKey ? 120 : 40;
if (k === 'arrowleft') panBy(stepPx, 0);
if (k === 'arrowright') panBy(-stepPx, 0);
if (k === 'arrowup') panBy(0, stepPx);
if (k === 'arrowdown') panBy(0, -stepPx);
}
});
document.addEventListener('keyup', (e) => {
if (e.code === 'Space') {
spaceDown = false;
root.classList.remove('space-pan');
}
});
window.addEventListener('blur', () => {
spaceDown = false;
root.classList.remove('space-pan');
});

// ---------- Видимость окна ----------
function isVisible() { return root.classList.contains('visible'); }
function showWindow() {
root.classList.add('visible');
requestAnimationFrame(() => { resizeSurface(); });
}
function hideWindow() {
if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; doSave(); }
root.classList.remove('visible');
}
function open(initialId) {
if (!course) return;
const list = getCourseCanvases();
list.forEach(normalizeCanvasRecord);
if (list.length === 0) {
createNewCanvas();
} else if (initialId && list.some(c => c.id === initialId)) {
selectCanvas(initialId);
} else if (!list.some(c => c.id === activeId)) {
selectCanvas(list[0].id);
} else {
refreshList();
refreshOptions();
}
refreshLessonOptions();
refreshOptions();
showWindow();
setTimeout(() => { resizeSurface(); }, 40);
}
function handleCourseChange() {
activeId = null;
Object.keys(historyMap).forEach(k => delete historyMap[k]);
if (isVisible()) hideWindow();
if (course && !Array.isArray(course.meta.canvases)) course.meta.canvases = [];
userAdjustedView = false;
refreshLessonOptions();
refreshList();
refreshOptions();
renderBase();
render();
}
function handleLessonChange() {

refreshOptions();
refreshList();
}

if (window.ResizeObserver) {
const ro = new ResizeObserver(() => resizeSurface());
ro.observe(stage);
}
window.addEventListener('resize', () => { if (isVisible()) resizeSurface(); });
refreshLessonOptions();
refreshList();
refreshOptions();
updateHistoryButtons();
updateZoomLabel();
setSaveState('', '');

return {
root: root,
open: open,
close: hideWindow,
isVisible: isVisible,
handleCourseChange: handleCourseChange,
handleLessonChange: handleLessonChange
};
}
