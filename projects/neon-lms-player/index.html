  // ---------- БЛОК: ГРАФИК ФУНКЦИИ (2D/3D) ----------
  function renderGraphBlock(block) {
    const element = h('div', { class: 'graph-block' });
    if (block.title) element.appendChild(h('h4', { class: 'heading', textContent: block.title }));

    if (!window.Plotly) {
      element.appendChild(h('p', { class: 'block-note', textContent: '⚠ Библиотека Plotly не загрузилась — график недоступен.' }));
      return element;
    }

    const mode = block.mode === '3d' ? '3d' : '2d';
    const parametric = !!block.parametric;
    const params = Array.isArray(block.params) ? block.params.filter(p => p && p.name) : [];
    const paramValues = {};
    params.forEach(p => { paramValues[p.name] = toNum(p.value, 0); });
    const varNames = Object.keys(paramValues);

    const plotDiv = h('div', { class: 'graph-plot' });
    element.appendChild(plotDiv);

    if (params.length > 0) {
      const controls = h('div', { class: 'graph-controls' });
      params.forEach(p => {
        const row = h('div', { class: 'slider-container graph-param' });
        const labelRow = h('div', { class: 'slider-label' });
        labelRow.appendChild(h('span', { textContent: 'Параметр ' + p.name }));
        const valueSpan = h('span', { class: 'slider-value', textContent: String(paramValues[p.name]) });
        labelRow.appendChild(valueSpan);
        row.appendChild(labelRow);
        const input = h('input', {
          type: 'range', class: 'slider-input',
          min: toNum(p.min, -10),
          max: toNum(p.max, 10),
          step: toNum(p.step, 0.1),
          value: paramValues[p.name]
        });
        input.addEventListener('input', () => {
          paramValues[p.name] = parseFloat(input.value);
          valueSpan.textContent = input.value;
          redraw();
        });
        row.appendChild(input);
        controls.appendChild(row);
      });
      element.appendChild(controls);
    }

    const errBox = h('div', { class: 'graph-error' });
    element.appendChild(errBox);

    function envFor(extra) {
      const env = {};
      varNames.forEach(k => { env[k] = paramValues[k]; });
      if (extra) Object.keys(extra).forEach(k => { env[k] = extra[k]; });
      return env;
    }

    function redraw() {
      errBox.textContent = '';
      try {
        if (mode === '2d') {
          if (parametric) {
            const fx = compileMathExpression(block.paramX || 't', ['t'].concat(varNames));
            const fy = compileMathExpression(block.paramY || 't', ['t'].concat(varNames));
            const tMin = toNum(block.tMin, 0);
            const tMax = toNum(block.tMax, 2 * Math.PI);
            const n = toPointCount(block.points, 300);
            const xs = [], ys = [];
            for (let i = 0; i <= n; i++) {
              const t = tMin + (tMax - tMin) * i / n;
              xs.push(fx(envFor({ t: t })));
              ys.push(fy(envFor({ t: t })));
            }
            Plotly.react(plotDiv, [{ x: xs, y: ys, type: 'scatter', mode: 'lines', line: { color: '#00f0ff', width: 3 } }], plotlyLayout2d(), PLOTLY_CONFIG);
          } else {
            const f = compileMathExpression(block.equation || 'x', ['x'].concat(varNames));
            const xMin = toNum(block.rangeMin, -10);
            const xMax = toNum(block.rangeMax, 10);
            const n = toPointCount(block.points, 300);
            const xs = [], ys = [];
            for (let i = 0; i <= n; i++) {
              const x = xMin + (xMax - xMin) * i / n;
              xs.push(x);
              ys.push(f(envFor({ x: x })));
            }
            Plotly.react(plotDiv, [{ x: xs, y: ys, type: 'scatter', mode: 'lines', line: { color: '#00f0ff', width: 3 } }], plotlyLayout2d(), PLOTLY_CONFIG);
          }
        } else {
          if (parametric) {
            if (!block.paramX || !block.paramY || !block.paramZ) {
              throw new Error('для параметрической 3D-кривой задайте paramX, paramY и paramZ');
            }
            const fx = compileMathExpression(block.paramX, ['t'].concat(varNames));
            const fy = compileMathExpression(block.paramY, ['t'].concat(varNames));
            const fz = compileMathExpression(block.paramZ, ['t'].concat(varNames));
            const tMin = toNum(block.tMin, 0);
            const tMax = toNum(block.tMax, 4 * Math.PI);
            const n = toPointCount(block.points, 300);
            const xs = [], ys = [], zs = [];
            for (let i = 0; i <= n; i++) {
              const t = tMin + (tMax - tMin) * i / n;
              xs.push(fx(envFor({ t: t })));
              ys.push(fy(envFor({ t: t })));
              zs.push(fz(envFor({ t: t })));
            }
            Plotly.react(plotDiv, [{ x: xs, y: ys, z: zs, type: 'scatter3d', mode: 'lines', line: { color: '#00f0ff', width: 4 } }], plotlyLayout3d(), PLOTLY_CONFIG);
          } else {
            const f = compileMathExpression(block.equation || 'sin(x)*cos(y)', ['x', 'y'].concat(varNames));
            const xMin = toNum(block.rangeMin, -5);
            const xMax = toNum(block.rangeMax, 5);
            const yMin = toNum(block.rangeYMin, -5);
            const yMax = toNum(block.rangeYMax, 5);
            const g = Math.min(toPointCount(block.points, 40), 80);
            const xArr = [], yArr = [], zGrid = [];
            for (let i = 0; i <= g; i++) xArr.push(xMin + (xMax - xMin) * i / g);
            for (let j = 0; j <= g; j++) yArr.push(yMin + (yMax - yMin) * j / g);
            for (let j = 0; j <= g; j++) {
              const rowArr = [];
              for (let i = 0; i <= g; i++) {
                rowArr.push(f(envFor({ x: xArr[i], y: yArr[j] })));
              }
              zGrid.push(rowArr);
            }
            Plotly.react(plotDiv, [{ x: xArr, y: yArr, z: zGrid, type: 'surface', colorscale: 'Viridis' }], plotlyLayout3d(), PLOTLY_CONFIG);
          }
        }
      } catch (e) {
        errBox.textContent = 'Ошибка построения графика: ' + e.message;
      }
    }

    // Первая отрисовка — только когда элемент появится в DOM
    function initialDraw() {
      if (plotDiv.isConnected) {
        redraw();
      } else {
        requestAnimationFrame(initialDraw);
      }
    }
    requestAnimationFrame(initialDraw);

    return element;
  }

  // ---------- БЛОК: 3D ОБЪЕКТ (GLB/GLTF) ----------
  function renderModel3DBlock(block) {
    const element = h('div', { class: 'model3d-block' });

    const viewer = h('div', { class: 'model3d-viewer' });
    viewer.style.height = block.height || '450px';
    element.appendChild(viewer);

    // Сворачиваемая панель управления
    const panel = h('div', { class: 'collapse-panel' });
    const panelToggle = h('button', { class: 'collapse-panel-toggle', type: 'button' });
    const toggleIcon = h('span', { class: 'collapse-icon', textContent: '▶' });
    panelToggle.appendChild(toggleIcon);
    panelToggle.appendChild(h('span', { textContent: 'Управление моделью: загрузить по URL или открыть файл' }));
    const panelBody = h('div', { class: 'collapse-panel-body' });
    panelBody.style.display = 'none';
    panelToggle.addEventListener('click', () => {
      const isOpen = panelBody.style.display !== 'none';
      panelBody.style.display = isOpen ? 'none' : 'flex';
      toggleIcon.textContent = isOpen ? '▶' : '▼';
      panelToggle.classList.toggle('open', !isOpen);
    });
    panel.appendChild(panelToggle);
    panel.appendChild(panelBody);

    const urlRow = h('div', { class: 'model3d-url-row' });
    const urlInput = h('input', { type: 'text', class: 'fill-blank-input', placeholder: 'URL модели .glb / .gltf' });
    urlInput.value = block.src || '';
    const loadUrlBtn = h('button', { class: 'quiz-button', type: 'button', textContent: 'Загрузить по URL', style: 'margin-top:0;' });
    urlRow.appendChild(urlInput);
    urlRow.appendChild(loadUrlBtn);
    panelBody.appendChild(urlRow);

    const fileRow = h('div', { class: 'model3d-file-row' });
    const fileInput = h('input', { type: 'file', accept: '.glb,.gltf,model/gltf-binary,model/gltf+json', style: 'display:none;' });
    const fileBtn = h('button', { class: 'quiz-button', type: 'button', textContent: '📁 Открыть файл .glb / .gltf', style: 'margin-top:0;' });
    fileBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      const objectUrl = URL.createObjectURL(file);
      loadModel(objectUrl, file.name, true);
      fileInput.value = '';
    });
    fileRow.appendChild(fileInput);
    fileRow.appendChild(fileBtn);
    panelBody.appendChild(fileRow);

    const statusEl = h('div', { class: 'model3d-status' });
    panelBody.appendChild(statusEl);

    element.appendChild(panel);

    if (block.caption) {
      element.appendChild(h('div', { class: 'svg-caption', textContent: block.caption }));
    }

    function setStatus(text, kind) {
      statusEl.textContent = text || '';
      statusEl.classList.remove('ok', 'err');
      if (kind) statusEl.classList.add(kind);
    }

    if (!window.THREE || !window.THREE.GLTFLoader || !window.THREE.OrbitControls) {
      setStatus('⚠ Библиотека Three.js не загрузилась — 3D-просмотр недоступен.', 'err');
      return element;
    }

    let scene, camera, renderer, controls;
    try {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(block.background || '#0a0c14');

      camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
      camera.position.set(3, 2, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.domElement.style.display = 'block';
      viewer.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.0));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      const grid = new THREE.GridHelper(10, 20, 0x00f0ff, 0x113344);
      grid.material.opacity = 0.25;
      grid.material.transparent = true;
      scene.add(grid);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.autoRotate = block.autoRotate !== false;
    } catch (e) {
      setStatus('⚠ Не удалось инициализировать WebGL: ' + e.message, 'err');
      return element;
    }

    function resize() {
      const w = viewer.clientWidth;
      const hh = viewer.clientHeight;
      if (w === 0 || hh === 0) return;
      camera.aspect = w / hh;
      camera.updateProjectionMatrix();
      renderer.setSize(w, hh);
    }
    resize();
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(resize);
      ro.observe(viewer);
    }

    let currentModel = null;
    let lastObjectUrl = null;

    function clearModel() {
      if (currentModel) {
        scene.remove(currentModel);
        currentModel.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            mats.forEach(m => m.dispose());
          }
        });
        currentModel = null;
      }
      if (lastObjectUrl) {
        URL.revokeObjectURL(lastObjectUrl);
        lastObjectUrl = null;
      }
    }

    function fitCameraToObject() {
      const box = new THREE.Box3().setFromObject(currentModel);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      currentModel.position.sub(center);
      const dist = maxDim * 1.8;
      camera.position.set(dist, dist * 0.6, dist);
      camera.near = maxDim / 100;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0);
      controls.update();
    }

    const loader = new THREE.GLTFLoader();

    function loadModel(url, name, isObjectUrl) {
      setStatus('Загрузка: ' + (name || url) + ' …');
      loader.load(url, (gltf) => {
        clearModel();
        if (isObjectUrl) lastObjectUrl = url;
        currentModel = gltf.scene || (gltf.scenes && gltf.scenes[0]);
        if (!currentModel) {
          setStatus('✖ В файле не найдено 3D-сцены.', 'err');
          return;
        }
        scene.add(currentModel);
        fitCameraToObject();
        setStatus('✔ Модель загружена: ' + (name || url), 'ok');
      }, undefined, (err) => {
        console.error('GLTF load error:', err);
        setStatus('✖ Ошибка загрузки модели. Проверьте URL/файл (для .gltf с внешними ресурсами используйте .glb, для внешних URL требуется CORS).', 'err');
      });
    }

    loadUrlBtn.addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (!url) {
        setStatus('Укажите URL модели.', 'err');
        return;
      }
      loadModel(url, null, false);
    });

    function animate() {
      if (!viewer.isConnected) {
        renderer.dispose();
        return;
      }
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function waitConnected() {
      if (viewer.isConnected) {
        resize();
        animate();
      } else {
        requestAnimationFrame(waitConnected);
      }
    }
    requestAnimationFrame(waitConnected);

    if (block.src) {
      loadModel(block.src, null, false);
    } else {
      setStatus('Укажите URL модели или откройте локальный файл .glb / .gltf.');
    }

    return element;
  }

  // ---------- НОВЫЕ ТИПЫ БЛОКОВ ----------
  function renderFlashcardsBlock(block) {
    const element = h('div', { class: 'flashcards-block' });
    if (block.title) element.appendChild(h('h4', { class: 'heading', textContent: block.title }));
    const cards = Array.isArray(block.cards) ? block.cards.filter(c => c && typeof c === 'object') : [];
    if (cards.length === 0) {
      element.appendChild(h('p', { class: 'block-note', textContent: 'Карточки не заданы.' }));
      return element;
    }
    let idx = 0;

    const cardEl = h('div', { class: 'flip-card flashcards-card' });
    const inner = h('div', { class: 'flip-card-inner' });
    const front = h('div', { class: 'flip-card-front' });
    const back = h('div', { class: 'flip-card-back' });
    inner.appendChild(front);
    inner.appendChild(back);
    cardEl.appendChild(inner);
    cardEl.addEventListener('click', () => cardEl.classList.toggle('flipped'));
    element.appendChild(cardEl);

    const nav = h('div', { class: 'flashcards-nav' });
    const prevBtn = h('button', { class: 'quiz-button', type: 'button', textContent: '← Назад' });
    const counter = h('span', { class: 'flashcards-counter' });
    const nextBtn = h('button', { class: 'quiz-button', type: 'button', textContent: 'Вперёд →' });
    nav.appendChild(prevBtn);
    nav.appendChild(counter);
    nav.appendChild(nextBtn);
    element.appendChild(nav);
    element.appendChild(h('p', { class: 'form-hint', style: 'text-align:center;', textContent: 'Нажмите на карточку, чтобы перевернуть.' }));

    function fillSide(node, value) {
      node.innerHTML = '';
      if (typeof value === 'string' || typeof value === 'number') {
        node.appendChild(document.createTextNode(String(value)));
      } else if (Array.isArray(value)) {
        renderBlocks(value, node);
      } else if (value && value.type) {
        const el = renderBlock(value, 0);
        if (el) node.appendChild(el);
      }
    }

    function update() {
      cardEl.classList.remove('flipped');
      const card = cards[idx];
      fillSide(front, card.front);
      fillSide(back, card.back);
      counter.textContent = (idx + 1) + ' / ' + cards.length;
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === cards.length - 1;
    }
    prevBtn.addEventListener('click', () => { if (idx > 0) { idx--; update(); } });
    nextBtn.addEventListener('click', () => { if (idx < cards.length - 1) { idx++; update(); } });
    update();
    return element;
  }

  function renderChecklistBlock(block) {
    const element = h('div', { class: 'checklist-block' });
    if (block.title) element.appendChild(h('h4', { class: 'heading', textContent: block.title }));
    const items = Array.isArray(block.items) ? block.items : [];
    if (items.length === 0) {
      element.appendChild(h('p', { class: 'block-note', textContent: 'Пункты чек-листа не заданы.' }));
      return element;
    }
    const progressRow = h('div', { class: 'checklist-progress-row' });
    const progressText = h('span', { class: 'checklist-progress-text' });
    progressRow.appendChild(progressText);
    element.appendChild(progressRow);
    const bar = h('div', { class: 'progress-bar' });
    const fill = h('div', { class: 'progress-fill', style: 'width: 0%' });
    bar.appendChild(fill);
    element.appendChild(bar);

    const listEl = h('div', { class: 'checklist-items' });
    let checkedCount = 0;
    function updateProgress() {
      const percent = Math.round((checkedCount / items.length) * 100);
      progressText.textContent = 'Выполнено: ' + checkedCount + ' из ' + items.length + ' (' + percent + '%)';
      fill.style.width = percent + '%';
    }
    items.forEach(item => {
      const label = h('label', { class: 'checklist-item' });
      const input = h('input', { type: 'checkbox' });
      input.addEventListener('change', () => {
        checkedCount += input.checked ? 1 : -1;
        label.classList.toggle('checked', input.checked);
        updateProgress();
      });
      label.appendChild(input);
      label.appendChild(h('span', { textContent: item != null ? String(item) : '' }));
      listEl.appendChild(label);
    });
    element.appendChild(listEl);
    updateProgress();
    return element;
  }

  function renderQuoteBlock(block) {
    const element = h('blockquote', { class: 'quote-block' });
    element.appendChild(h('p', { class: 'quote-text', textContent: block.text != null ? String(block.text) : '' }));
    if (block.author) {
      element.appendChild(h('footer', { class: 'quote-author', textContent: '— ' + block.author }));
    }
    return element;
  }

  function renderGlossaryBlock(block) {
    const element = h('div', { class: 'glossary-block' });

  function extractYouTubeId(src) {
    const s = String(src || '').trim();
    if (!s) return '';
    if (/^https?:\/\//i.test(s)) {
      try {
        const u = new URL(s);
        const v = u.searchParams.get('v');
        if (v) return v;
        let m = s.match(/youtu\.be\/([\w-]{4,})/i);
        if (m) return m[1];
        m = s.match(/\/(embed|shorts)\/([\w-]{4,})/i);
        if (m) return m[2];
      } catch (e) {}
    }
    return s;
  }

  function renderYouTubeBlock(block) {
    const element = h('figure', { class: 'figure' });
    const id = extractYouTubeId(block.videoId || block.src);
    if (!id) {
      element.appendChild(h('p', { class: 'block-note', textContent: '⚠ Укажите videoId или ссылку YouTube.' }));
      return element;
    }
    const wrap = h('div', { class: 'youtube-wrap' });
    wrap.appendChild(h('iframe', {
      src: 'https://www.youtube.com/embed/' + encodeURIComponent(id),
      allowfullscreen: '',
      allow: 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture'
    }));
    element.appendChild(wrap);
    if (block.caption) element.appendChild(h('figcaption', { textContent: block.caption }));
    return element;
  }

  function renderKanbanBlock(block) {
    const element = h('div', { class: 'kanban-block' });

  function renderStatsBlock(block) {
    const element = h('div', { class: 'stats-block' });

  function renderCountdownBlock(block) {
    const totalSeconds = Math.max(1, parseInt(block.seconds, 10) || 60);
    let remaining = totalSeconds;
    let timerId = null;

    const element = h('div', { class: 'countdown-block' });
    if (block.title) element.appendChild(h('h4', { class: 'heading', textContent: block.title }));
    const display = h('div', { class: 'countdown-display', textContent: formatSeconds(remaining) });
    element.appendChild(display);
    if (block.label) element.appendChild(h('p', { class: 'countdown-label', textContent: block.label }));

    const controls = h('div', { class: 'countdown-controls' });
    const startBtn = h('button', { class: 'quiz-button', type: 'button', textContent: '▶ Старт' });
    const pauseBtn = h('button', { class: 'quiz-button', type: 'button', textContent: '⏸ Пауза' });
    const resetBtn = h('button', { class: 'quiz-button', type: 'button', textContent: '⟲ Сброс' });
    controls.appendChild(startBtn);
    controls.appendChild(pauseBtn);
    controls.appendChild(resetBtn);
    element.appendChild(controls);

    function formatSeconds(s) {
      const m = Math.floor(s / 60);
      const ss = s % 60;
      return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
    }

    function renderTime() { display.textContent = formatSeconds(Math.max(0, remaining)); }

    function stopTimer() {
      if (timerId !== null) { clearInterval(timerId); timerId = null; }
    }

    function tick() {
      if (!element.isConnected) { stopTimer(); return; }
      remaining--;
      renderTime();
      if (remaining <= 0) {
        stopTimer();
        display.classList.add('finished');
      }
    }

    startBtn.addEventListener('click', () => {
      if (timerId !== null) return;
      if (remaining <= 0) remaining = totalSeconds;
      display.classList.remove('finished');
      timerId = setInterval(tick, 1000);
    });
    pauseBtn.addEventListener('click', stopTimer);
    resetBtn.addEventListener('click', () => {
      stopTimer();
      remaining = totalSeconds;
      display.classList.remove('finished');
      renderTime();
    });

    return element;
  }

  function renderTreeBlock(block) {
    const element = h('div', { class: 'tree-block' });
    if (block.title) element.appendChild(h('h4', { class: 'heading', textContent: block.title }));
    const items = Array.isArray(block.items) ? block.items.filter(i => i) : [];
    if (items.length === 0) {
      element.appendChild(h('p', { class: 'block-note', textContent: 'Узлы дерева не заданы.' }));
      return element;
    }

    function buildNode(node) {
      const li = h('li', { class: 'tree-node' });
      const row = h('div', { class: 'tree-row' });
      const text = node.text != null ? String(node.text) : (node.title != null ? String(node.title) : '');
      const children = Array.isArray(node.children) ? node.children.filter(c => c) : [];
      if (children.length > 0) {
        const toggle = h('button', { class: 'tree-toggle', type: 'button', textContent: '▶' });
        const kids = h('ul', { class: 'tree-children' });
        kids.style.display = 'none';
        children.forEach(ch => kids.appendChild(buildNode(ch)));
        toggle.addEventListener('click', () => {
          const open = kids.style.display !== 'none';
          kids.style.display = open ? 'none' : 'block';
          toggle.textContent = open ? '▶' : '▼';
        });
        row.appendChild(toggle);
        row.appendChild(h('span', { class: 'tree-text has-kids', textContent: text }));
        li.appendChild(row);
        li.appendChild(kids);
      } else {
        row.appendChild(h('span', { class: 'tree-leaf', textContent: '•' }));
        row.appendChild(h('span', { class: 'tree-text', textContent: text }));
        li.appendChild(row);
      }
      return li;
    }

    const root = h('ul', { class: 'tree-root' });
    items.forEach(it => root.appendChild(buildNode(it)));
    element.appendChild(root);
    return element;
  }

  function renderTrueFalseBlock(block) {
    const element = h('div', { class: 'quiz truefalse-block' });
    element.appendChild(h('p', { class: 'question', textContent: block.question != null ? String(block.question) : 'Утверждение верно?' }));
    const answerBool = block.answer === true || block.answer === 'true';
    const btnRow = h('div', { class: 'truefalse-btns' });
    const trueBtn = h('button', { class: 'quiz-button', type: 'button', textContent: '✔ Верно' });
    const falseBtn = h('button', { class: 'quiz-button', type: 'button', textContent: '✘ Неверно' });
    btnRow.appendChild(trueBtn);
    btnRow.appendChild(falseBtn);
    element.appendChild(btnRow);
    const feedback = h('div', { class: 'quiz-feedback' });
    element.appendChild(feedback);

    function respond(userSaidTrue) {
      const correct = userSaidTrue === answerBool;
      trueBtn.disabled = true;
      falseBtn.disabled = true;
      const chosen = userSaidTrue ? trueBtn : falseBtn;
      const other = userSaidTrue ? falseBtn : trueBtn;
      chosen.style.borderColor = correct ? 'var(--green)' : 'var(--pink)';
      if (!correct) other.style.borderColor = 'var(--green)';
      feedback.textContent = correct ? 'Верно! ' + (block.explanation || '') : 'Неверно. ' + (block.explanation || '');
      feedback.style.color = correct ? 'var(--green)' : 'var(--pink)';
    }
    trueBtn.addEventListener('click', () => respond(true));
    falseBtn.addEventListener('click', () => respond(false));
    return element;
  }

    return element;

      if (!promptArea.value) {

        return;

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {

          document.execCommand('copy');

        alert('Промпт скопирован в буфер обмена!');

    });
    copyRow.appendChild(copyBtn);
    content.appendChild(copyRow);

    generateBtn.addEventListener('click', () => {
      const topic = topicInput.value.trim() || 'выбранной теме';
      promptArea.value = generatePrompt(topic);
    });

    document.body.appendChild(overlay);

    const prompt = `Ты — эксперт по созданию интерактивных образовательных курсов. Создай JSON-файл курса на тему "${topic}" для LMS-плеера.

Требования:
- Курс должен содержать 10-15 уроков, каждый с несколькими блоками разного типа.

- Основной упор — на теоретический материал, практика второстепенна.
- Используй разнообразные типы блоков: текст, изображения, викторины, сопоставления, диаграммы, таблицы, аккордеоны, графики функций (graph), 3D-модели (model3d), карточки (flashcards), глоссарии, канбан-доски, таймеры и другие — где это уместно.
- Отдавай предпочтение иллюстрациям mermaid и svg для визуализации.
- Используй формулы KaTeX при необходимости (блок equation или синтаксис внутри текста).
- Блоки кода преимущественно размещай внутри блока modal.
- JSON должен быть валидным и соответствовать схеме ниже.
- Не добавляй комментарии в JSON.
- Обязательно включи блоки quiz, fill-blank и хотя бы одну диаграмму (chart или pie).
- Метаданные должны быть заполнены реалистично, в качестве автора укажи себя (например, "AI Assistant").
- Все URL изображений/видео/3D-моделей должны быть рабочими (используй https://picsum.photos для изображений, если нужно).
- При желании можешь добавить кастомную тему через meta.theme.
- SVG-код должен быть валидным и не содержать скриптов (безопасность).
- HTML-код должен быть корректным и не содержать скриптов.

ФОРМУЛЫ:
- Для вставки формул в текстовых блоках (type: "text") используй KaTeX: inline — \\\\(...\\\\), display — \\\\[...\\\\]. Также допустимы $...$ и $$...$$.
- Для отдельной формулы используй блок "equation" с полем "latex" (без ограничителей $$).
- Если теоретический материал требует расширенного форматирования (списки, выделение, таблицы), используй блок "html".
- Для визуализации математических зависимостей используй блок "graph" с уравнениями и интерактивными параметрами через массив "params".

РАЗМЕРЫ БЛОКОВ:
- Любой блок может содержать поля width, height, maxWidth, maxHeight, minWidth, minHeight (CSS-значения).
- Поле autoScale (по умолчанию true) автоматически масштабирует блок под ширину контейнера.

Схема:
${schema}

Сгенерируй только JSON, без пояснений.`;

  // ---------- РЕНДЕРИНГ БАЗОВОГО UI ----------
  function renderBaseUI() {
    app.appendChild(renderAppHeader());

    const buttonsContainer = h('div', { style: 'display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; align-items:center;' });

    const toggleBtn = h('button', { class: 'toggle-manager-btn', textContent: 'Управление курсами', type: 'button' });
    toggleBtn.addEventListener('click', toggleCourseManager);
    buttonsContainer.appendChild(toggleBtn);

    const helpBtn = h('button', { class: 'toggle-manager-btn', textContent: 'Справка', type: 'button' });
    helpBtn.addEventListener('click', openHelpModal);
    buttonsContainer.appendChild(helpBtn);

    const promptBtn = h('button', { class: 'toggle-manager-btn', textContent: 'Генерация промпта', type: 'button' });
    promptBtn.addEventListener('click', openPromptGenerator);
    buttonsContainer.appendChild(promptBtn);

    buttonsContainer.appendChild(renderModeToggle());

    app.appendChild(buttonsContainer);

    courseManagerPanel = renderCourseManager();
    courseManagerPanel.style.display = 'none';
    app.appendChild(courseManagerPanel);
    updateSavedCoursesList();

    if (course) {
      const header = renderCourseHeader();
      if (header) app.appendChild(header);

    }
  }

  function renderInitialState() {
    app.innerHTML = '';
    if (!course) {
      applyTheme(null);
    }
    renderBaseUI();
    if (course) {
      app.appendChild(h('p', { class: 'text', textContent: 'Выберите занятие из списка выше.' }));
    }
  }

  function showLesson(lessonId) {
    if (!course) return;
    currentLessonId = lessonId;
    app.innerHTML = '';
    renderBaseUI();
    const backBtn = h('button', { class: 'back-btn', textContent: '← К списку занятий', type: 'button' });
    backBtn.addEventListener('click', () => {
      currentLessonId = null;
      renderInitialState();
    });
    app.appendChild(backBtn);

    const lesson = course.lessons.find(l => l.id === lessonId);
    if (!lesson) return;

    const lessonContainer = h('div', { class: 'lesson-container' });

    const lessonTitleRow = h('div', { class: 'lesson-title-row' });
    lessonTitleRow.appendChild(h('h2', { class: 'heading', textContent: lesson.title || lesson.id }));
    if (editMode) {
      const lessonEditBtn = h('button', {
        class: 'lesson-edit-btn',
        type: 'button',
        title: 'Редактировать JSON урока',
        textContent: '✎'
      });
      lessonEditBtn.addEventListener('click', () => openLessonEditor(lesson));
      lessonTitleRow.appendChild(lessonEditBtn);
    }
    lessonContainer.appendChild(lessonTitleRow);

    if (lesson.description) lessonContainer.appendChild(h('p', { class: 'text', textContent: lesson.description }));
    if (editMode) {
      lessonContainer.appendChild(h('p', { class: 'editor-hint', textContent: '💡 Наведите курсор на любой блок, чтобы отредактировать его, переместить, добавить новый или удалить.' }));
    }

    const content = h('div', { class: 'lesson-content' });
    if (editMode) {
      renderLessonBlocksEditable(lesson, content);
      const addBlockBtn = h('button', { class: 'add-block-btn', type: 'button', textContent: '＋ Добавить блок в конец урока' });
      addBlockBtn.addEventListener('click', () => openAddBlockEditor(lesson, ensureLessonBlocks(lesson).length));
      content.appendChild(addBlockBtn);
    } else {
      renderBlocks(ensureLessonBlocks(lesson), content);
    }

    lessonContainer.appendChild(content);

    const completeBtn = h('button', {
      class: 'quiz-button',
      textContent: completedLessons.has(lessonId) ? 'Занятие завершено ✓' : 'Завершить занятие',
      type: 'button'
    });
    completeBtn.addEventListener('click', () => {
      const key = getCourseKey(course);
      if (!courseProgress[key]) courseProgress[key] = [];
      if (completedLessons.has(lessonId)) {
        completedLessons.delete(lessonId);
      } else {
        completedLessons.add(lessonId);
      }
      courseProgress[key] = [...completedLessons];
      try {
        localStorage.setItem('lms_course_progress', JSON.stringify(courseProgress));
      } catch (e) {
        console.warn('Не удалось сохранить прогресс', e);
      }
      showLesson(lessonId);
      setTimeout(() => {
        const nav = document.querySelector('.lessons-nav');
        if (nav) nav.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    });
    lessonContainer.appendChild(completeBtn);

    // ----- НАВИГАЦИЯ МЕЖДУ УРОКАМИ -----
    const lessonIndex = course.lessons.findIndex(l => l.id === lessonId);
    const navContainer = h('div', { style: 'display: flex; gap: 10px; margin-top: 20px; justify-content: space-between; flex-wrap: wrap;' });

    const prevBtn = h('button', {
      class: 'quiz-button',
      textContent: '← Предыдущий урок',
      type: 'button',
      disabled: lessonIndex <= 0
    });
    prevBtn.addEventListener('click', () => {
      if (lessonIndex > 0) {
        const prevLesson = course.lessons[lessonIndex - 1];
        showLesson(prevLesson.id);
        window.scrollTo(0, 0);
      }
    });

    const nextBtn = h('button', {
      class: 'quiz-button',
      textContent: 'Следующий урок →',
      type: 'button',
      disabled: lessonIndex >= course.lessons.length - 1
    });
    nextBtn.addEventListener('click', () => {
      if (lessonIndex < course.lessons.length - 1) {
        const nextLesson = course.lessons[lessonIndex + 1];
        showLesson(nextLesson.id);
        window.scrollTo(0, 0);
      }
    });

    navContainer.appendChild(prevBtn);
    navContainer.appendChild(nextBtn);
    lessonContainer.appendChild(navContainer);
    // ----- КОНЕЦ НАВИГАЦИИ -----

    app.appendChild(lessonContainer);
    postProcess(lessonContainer);
  }

  // ---------- ОБРАБОТЧИКИ БЛОКОВ ----------
  function processMath(element) {
    if (window.renderMathInElement) {
      try {
        window.renderMathInElement(element, {
          delimiters: [
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false},
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      } catch(e) { console.error('KaTeX error:', e); }
    }
  }

  function renderMermaidDiagrams(element) {
    const mermaidElements = element.querySelectorAll('.mermaid');
    if (mermaidElements.length && window.mermaid && window.mermaid.run) {
      mermaidElements.forEach(el => {
        const code = el.textContent;
        el.removeAttribute('data-processed');
        el.innerHTML = code;
      });
      try {
        mermaid.run({ nodes: mermaidElements });
      } catch(e) { console.error('Mermaid error:', e); }
    }
  }

  function postProcess(container) {
    processMath(container);
    renderMermaidDiagrams(container);
  }

  function renderBlocks(blocks, container) {
    if (!Array.isArray(blocks)) return;
    blocks.forEach((block, idx) => {
      const element = renderBlock(block, idx);
      if (element) container.appendChild(element);
    });
  }

  function renderContentOrText(value, container) {
    if (typeof value === 'string' || typeof value === 'number') {
      container.appendChild(document.createTextNode(String(value)));
    } else if (Array.isArray(value)) {
      renderBlocks(value, container);
    } else if (value && value.type) {
      const el = renderBlock(value, 0);
      if (el) container.appendChild(el);
    }
  }

  function setupDrag(divider, container, setPos) {
    let isDragging = false;
    function onMouseMove(e) { if (isDragging) setPos(e.clientX); }
    function onTouchMove(e) { if (isDragging) { e.preventDefault(); setPos(e.touches[0].clientX); } }
    function endDrag() {
      isDragging = false;
      document.body.style.userSelect = '';
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', endDrag);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('touchend', endDrag);
    }
    function startDrag(e) {
      e.preventDefault();
      isDragging = true;
      document.body.style.userSelect = 'none';
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', endDrag);
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', endDrag);
      if (e.type === 'touchstart') setPos(e.touches[0].clientX);
      else if (e.type === 'mousedown') setPos(e.clientX);
    }
    divider.addEventListener('mousedown', startDrag);
    divider.addEventListener('touchstart', startDrag, { passive: false });
  }

  function setupCompareDrag(container, left, divider) {
    let isDragging = false;
    function setWidthFromClientX(clientX) {
      const rect = container.getBoundingClientRect();
      const dividerWidth = 4;
      const minLeft = 50;
      const minRight = 50;
      let x = clientX - rect.left;
      x = Math.max(minLeft, Math.min(x, rect.width - dividerWidth - minRight));
      left.style.width = x + 'px';
    }
    function onMouseMove(e) { if (isDragging) setWidthFromClientX(e.clientX); }
    function onTouchMove(e) { if (isDragging) { e.preventDefault(); setWidthFromClientX(e.touches[0].clientX); } }
    function endDrag() {
      isDragging = false;
      document.body.style.userSelect = '';
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', endDrag);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('touchend', endDrag);
    }
    function startDrag(e) {
      e.preventDefault();
      isDragging = true;
      document.body.style.userSelect = 'none';
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', endDrag);
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', endDrag);
      if (e.type === 'touchstart') setWidthFromClientX(e.touches[0].clientX);
      else if (e.type === 'mousedown') setWidthFromClientX(e.clientX);
    }
    divider.addEventListener('mousedown', startDrag);
    divider.addEventListener('touchstart', startDrag, { passive: false });
  }

  function applySizing(block, element) {
    if (!element) return;
    const sizingFields = ['width', 'height', 'maxWidth', 'maxHeight', 'minWidth', 'minHeight'];
    sizingFields.forEach(field => {
      if (block[field] !== undefined) {
        element.style[field] = block[field];
      }
    });
    const autoScale = block.autoScale !== undefined ? block.autoScale : true;
    if (autoScale) {
      element.style.maxWidth = '100%';
      if (['IMG', 'VIDEO', 'AUDIO', 'SVG'].includes(element.tagName)) {
        element.style.height = 'auto';
        element.style.objectFit = 'contain';
      }
    }
  }

  function renderBlock(block, idx) {
    if (!block || typeof block !== 'object') return null;
    let element;
    switch (block.type) {
      case 'section':
        element = h('section', { class: 'block-section', id: block.id || slugify(block.title) || ('section-' + idx) });
        element.appendChild(h('h2', { class: 'section-title', textContent: block.title != null ? String(block.title) : 'Секция' }));
        if (block.children) {
          const content = h('div', { class: 'section-content' });
          renderBlocks(block.children, content);
          element.appendChild(content);
        }
        break;
      case 'heading':
        element = h(`h${Math.min(6, Math.max(1, parseInt(block.level, 10) || 2))}`, { class: 'heading', textContent: block.text != null ? String(block.text) : '' });
        break;
      case 'text':
        element = h('p', { class: 'text', textContent: block.text != null ? String(block.text) : '' });
        break;
      case 'image':
        element = h('figure', { class: 'figure' });
        const img = h('img', { src: block.src, alt: block.caption || '' });
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', () => openImagePreview(block.src, null, block.caption, block.previewWidth, block.previewHeight));
        element.appendChild(img);
        if (block.caption) element.appendChild(h('figcaption', { textContent: block.caption }));
        break;
      case 'video':
        element = h('figure', { class: 'figure' });
        const video = h('video', { controls: '' });
        if (block.poster) video.setAttribute('poster', block.poster);
        video.appendChild(h('source', { src: block.src, type: block.mimeType || 'video/mp4' }));
        element.appendChild(video);
        if (block.speedControl) {
          const speedControl = h('div', { class: 'speed-control' });
          speedControl.appendChild(h('label', { textContent: 'Скорость:' }));
          const speedSelect = h('select');
          [0.5, 1, 1.5, 2].forEach(s => speedSelect.appendChild(h('option', { value: s, textContent: s + 'x' })));
          speedSelect.value = '1';
          speedSelect.addEventListener('change', () => video.playbackRate = parseFloat(speedSelect.value));
          speedControl.appendChild(speedSelect);
          element.appendChild(speedControl);
        }
        if (block.caption) element.appendChild(h('figcaption', { textContent: block.caption }));
        break;
      case 'audio':
        element = h('figure', { class: 'figure' });
        const audio = h('audio', { controls: '' });
        audio.appendChild(h('source', { src: block.src, type: block.mimeType || 'audio/mpeg' }));
        element.appendChild(audio);
        if (block.speedControl) {
          const audioSpeedControl = h('div', { class: 'speed-control' });
          audioSpeedControl.appendChild(h('label', { textContent: 'Скорость:' }));
          const audioSpeedSelect = h('select');
          [0.5, 1, 1.5, 2].forEach(s => audioSpeedSelect.appendChild(h('option', { value: s, textContent: s + 'x' })));
          audioSpeedSelect.value = '1';
          audioSpeedSelect.addEventListener('change', () => audio.playbackRate = parseFloat(audioSpeedSelect.value));
          audioSpeedControl.appendChild(audioSpeedSelect);
          element.appendChild(audioSpeedControl);
        }
        if (block.caption) element.appendChild(h('figcaption', { textContent: block.caption }));
        break;
      case 'list':
        element = h(block.ordered ? 'ol' : 'ul', { class: 'list' });
        (Array.isArray(block.items) ? block.items : []).forEach(item => element.appendChild(h('li', { textContent: item != null ? String(item) : '' })));
        break;
      case 'code':
        element = h('div', { class: 'code-block' });
        element.appendChild(h('div', { class: 'code-header', textContent: block.language || 'code' }));
        const pre = h('pre');
        pre.appendChild(h('code', { textContent: block.code != null ? String(block.code) : '' }));
        element.appendChild(pre);
        break;
      case 'callout':
        element = h('div', { class: `callout callout-${block.variant || 'info'}` });
        if (block.title) element.appendChild(h('h4', { textContent: block.title }));
        if (block.children) {
          const content = h('div');
          renderBlocks(block.children, content);
          element.appendChild(content);
        } else if (block.text) {
          element.appendChild(h('p', { textContent: block.text }));
        }
        break;
      case 'tabs':
        element = h('div', { class: 'tabs' });
        const btnContainer = h('div', { class: 'tab-buttons' });
        const panelContainer = h('div', { class: 'tab-panels' });
        (Array.isArray(block.tabs) ? block.tabs : []).forEach((tab, tabIdx) => {
          const btn = h('button', { class: 'tab-button' + (tabIdx === 0 ? ' active' : ''), textContent: tab.label, type: 'button' });
          const panel = h('div', { class: 'tab-panel' + (tabIdx === 0 ? ' active' : '') });
          renderBlocks(tab.content || [], panel);
          btn.addEventListener('click', () => {
            btnContainer.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            panelContainer.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            panel.classList.add('active');
          });
          btnContainer.appendChild(btn);
          panelContainer.appendChild(panel);
        });
        element.appendChild(btnContainer);
        element.appendChild(panelContainer);
        break;
      case 'accordion':
        element = h('div', { class: 'accordion' });
        (Array.isArray(block.items) ? block.items : []).forEach((item) => {

        element.appendChild(dragList);
        const dragCheckBtn = h('button', { class: 'sort-check-btn', textContent: 'Проверить', type: 'button' });
        const dragResult = h('div', { class: 'match-result' });
        dragCheckBtn.addEventListener('click', () => {
          if (!Array.isArray(block.correctOrder)) {
            dragResult.textContent = 'Правильный порядок не задан.';
            dragResult.style.color = 'var(--yellow)';
            return;
          }
          const isCorrect = JSON.stringify(dragItems) === JSON.stringify(block.correctOrder);
          dragResult.textContent = isCorrect ? 'Правильный порядок!' : 'Неправильно.';
          dragResult.style.color = isCorrect ? 'var(--green)' : 'var(--pink)';
        });
        element.appendChild(dragCheckBtn);
        element.appendChild(dragResult);
        break;
      case 'progress-tracker':
        element = h('div', { class: 'progress-tracker' });
        (Array.isArray(block.tasks) ? block.tasks : []).forEach(task => {
          const step = h('div', { class: 'progress-step', textContent: task.label != null ? String(task.label) : '' });
          step.addEventListener('click', () => step.classList.toggle('done'));
          element.appendChild(step);
        });
        break;
      case 'graph':
        element = renderGraphBlock(block);
        break;
      case 'model3d':
        element = renderModel3DBlock(block);
        break;
      case 'flashcards':
        element = renderFlashcardsBlock(block);
        break;
      case 'checklist':
        element = renderChecklistBlock(block);
        break;
      case 'quote':
        element = renderQuoteBlock(block);
        break;
      case 'glossary':
        element = renderGlossaryBlock(block);
        break;
      case 'equation':
        element = renderEquationBlock(block);
        break;
      case 'youtube':
        element = renderYouTubeBlock(block);
        break;
      case 'kanban':
        element = renderKanbanBlock(block);
        break;
      case 'stats':
        element = renderStatsBlock(block);
        break;
      case 'countdown':
        element = renderCountdownBlock(block);
        break;
      case 'tree':
        element = renderTreeBlock(block);
        break;
      case 'truefalse':
        element = renderTrueFalseBlock(block);
        break;
      case 'divider':
        element = renderDividerBlock(block);
        break;
      case 'download':
        element = renderDownloadBlock(block);
        break;
      default:
        console.warn('Unknown block type:', block.type);
        element = null;
    }
    if (element) {
      applySizing(block, element);
      if (block.type === 'image' || block.type === 'video' || block.type === 'audio') {
        const media = element.querySelector('img, video, audio');
        if (media) applySizing(block, media);
      }
    }
    return element;
  }

  // ---------- ИНИЦИАЛИЗАЦИЯ ----------
  async function init() {
    await openDB().catch(e => console.warn('IndexedDB не доступна', e));
    renderInitialState();

    const urlParams = new URLSearchParams(window.location.search);
    const autoUrl = urlParams.get('url') || urlParams.get('source') || urlParams.get('course');
    if (autoUrl) {
      try {
        const response = await fetch(autoUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const result = await loadCoursesFromData(data);
        console.log(`Автозагрузка: загружено курсов ${result.count}`);
        if (result.errors.length > 0) {
          console.warn('Ошибки при автозагрузке:', result.errors);
        }
      } catch (err) {
        console.error('Ошибка автозагрузки:', err);
        alert('Ошибка автозагрузки курса: ' + err.message);
      }
    }
  }

  init().catch(e => {
    console.error('Критическая ошибка инициализации:', e);
    if (app && app.innerHTML.trim() === '') {
      app.innerHTML = '<div style="color:#ff2a6d;padding:20px;border:1px solid #ff2a6d;border-radius:8px;font-family:monospace;">Критическая ошибка: ' + (e && e.message ? e.message : String(e)) + '</div>';
    }
  });
})();
</script>
</body>
</html>
