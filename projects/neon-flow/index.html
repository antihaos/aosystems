<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeonFlow — аудио-пайплайны | SIP → Whisper</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/orbitron@5.0.20/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.19/index.css">
<style>
:root{
  --bg:#060910; --bg2:#0a0f1d; --panel:#0c1222; --panel2:#101830; --border:#1b2542; --border2:#26345e;
  --neon:#00e5ff; --neon-dim:rgba(0,229,255,.35); --mag:#ff2ec4; --vio:#8b5cf6; --grn:#22ff88; --amb:#ffb020; --red:#ff3b5c;
  --text:#dce6ff; --muted:#7d8bb3; --mono:'JetBrains Mono',monospace; --disp:'Orbitron',sans-serif; --body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:rgba(0,229,255,.3)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#22305c;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#2e3f78}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 2px rgba(0,229,255,.15)}
#app{display:flex;flex-direction:column;height:100dvh;user-select:none;-webkit-user-select:none}

/* ---------- TOPBAR ---------- */
#topbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(180deg,#0d1428,#0a0f1e);border-bottom:1px solid var(--border);position:relative;z-index:30}
#topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--neon-dim),rgba(255,46,196,.3),transparent)}
.iconbtn{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s;flex:none}
.iconbtn:hover{background:rgba(0,229,255,.08);color:var(--neon)}
#burger{display:none}
.logo{display:flex;align-items:baseline;gap:8px;font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:2px;color:var(--neon);text-shadow:0 0 14px var(--neon-dim);white-space:nowrap;cursor:default}
.logo b{color:var(--mag);text-shadow:0 0 14px rgba(255,46,196,.5)}
.logo .hex{animation:pulseHex 3s ease-in-out infinite}
@keyframes pulseHex{0%,100%{opacity:1}50%{opacity:.45}}
.logo-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:none;font-weight:400}
#menus{display:flex;gap:2px;margin-left:6px}
.menu{position:relative}
.menu-btn{padding:7px 12px;border-radius:7px;color:var(--muted);font-size:13px;transition:.15s}
.menu-btn:hover,.menu.open .menu-btn{background:rgba(0,229,255,.08);color:var(--text)}
.menu-items{position:absolute;top:calc(100% + 6px);left:0;min-width:230px;background:var(--panel2);border:1px solid var(--border2);border-radius:10px;padding:6px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px rgba(0,229,255,.06);z-index:60}
.menu.open .menu-items{display:block;animation:menuIn .14s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;color:var(--text);font-size:13px}
.mi:hover{background:rgba(0,229,255,.1);color:var(--neon)}
.mi .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.mi.danger:hover{background:rgba(255,59,92,.12);color:var(--red)}
.msep{height:1px;background:var(--border);margin:5px 8px}
.top-spacer{flex:1}
.proj-name{width:210px;background:transparent;border:1px solid transparent;font-family:var(--mono);font-size:13px;text-align:right;transition:.15s}
.proj-name:hover{border-color:var(--border)}
.proj-name:focus{border-color:var(--neon);background:var(--bg2)}
.save-info{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--neon);color:var(--neon);box-shadow:0 0 12px rgba(0,229,255,.2)}
.btn.neon{border-color:var(--neon-dim);color:var(--neon);background:rgba(0,229,255,.06)}
.btn.neon:hover{background:rgba(0,229,255,.14);box-shadow:0 0 16px var(--neon-dim)}

/* ---------- TOOLBAR ---------- */
#toolbar{height:46px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;z-index:20}
#toolbar::-webkit-scrollbar{height:0}
.tb{min-width:34px;height:32px;padding:0 8px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12px;transition:.15s;flex:none;border:1px solid transparent}
.tb:hover{background:rgba(0,229,255,.08);color:var(--neon)}
.tb.active{background:rgba(0,229,255,.12);color:var(--neon);border-color:var(--neon-dim);box-shadow:0 0 10px rgba(0,229,255,.15) inset}
.tb svg{width:16px;height:16px;flex:none}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 6px;flex:none}
#runBtn{margin-left:auto;border:1px solid rgba(34,255,136,.4);color:var(--grn);background:rgba(34,255,136,.06);padding:6px 18px;border-radius:8px;font-family:var(--disp);font-size:12px;letter-spacing:1.5px;font-weight:700;transition:.2s;flex:none}
#runBtn:hover{background:rgba(34,255,136,.14);box-shadow:0 0 18px rgba(34,255,136,.35)}
#runBtn.running{border-color:rgba(255,59,92,.5);color:var(--red);background:rgba(255,59,92,.08);animation:runGlow 1.6s ease-in-out infinite}
#runBtn.starting{opacity:.6;pointer-events:none}
@keyframes runGlow{0%,100%{box-shadow:0 0 8px rgba(255,59,92,.25)}50%{box-shadow:0 0 22px rgba(255,59,92,.5)}}

/* ---------- WORKSPACE ---------- */
#workspace{flex:1;display:flex;min-height:0;position:relative}
#sidebar{width:284px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40;transition:transform .25s ease}
.sb-tabs{display:flex;border-bottom:1px solid var(--border);flex:none}
.sb-tab{flex:1;padding:11px 2px;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;transition:.15s;font-family:var(--disp);font-weight:600;white-space:nowrap}
.sb-tab:hover{color:var(--text)}
.sb-tab.active{color:var(--neon);border-bottom-color:var(--neon);text-shadow:0 0 10px var(--neon-dim)}
.sb-body{flex:1;overflow-y:auto;padding:10px}
.sb-panel{display:none}
.sb-panel.active{display:block}
.pal-cat{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:12px 4px 6px}
.pal-cat:first-child{margin-top:2px}
.pal-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:1px solid transparent;cursor:grab;transition:.15s;margin-bottom:3px}
.pal-item:hover{background:var(--panel2);border-color:var(--border2);transform:translateX(2px)}
.pal-item:active{cursor:grabbing}
.pal-dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.pal-name{font-size:13px}
.pal-desc{margin-left:auto;font-size:10px;color:var(--muted);font-family:var(--mono)}
.proj-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;transition:.15s}
.proj-card:hover{border-color:var(--border2)}
.proj-card .pn{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.proj-card .pd{font-family:var(--mono);font-size:10px;color:var(--muted);margin:4px 0 8px}
.proj-card .acts{display:flex;gap:6px}
.mini-btn{padding:4px 10px;font-size:11px;border-radius:6px;border:1px solid var(--border2);color:var(--muted);transition:.15s}
.mini-btn:hover{color:var(--neon);border-color:var(--neon)}
.mini-btn.danger:hover{color:var(--red);border-color:var(--red)}

/* --- пресеты --- */
.preset-card{background:linear-gradient(180deg,var(--panel2),#0d1428);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;transition:.15s}
.preset-card:hover{border-color:var(--neon-dim);box-shadow:0 0 14px rgba(0,229,255,.12)}
.ps-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ps-icon{font-size:16px;flex:none}
.ps-desc{color:var(--muted);font-size:11.5px;line-height:1.5;margin:6px 0 9px}
.ps-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ps-tag{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid var(--border2);color:var(--muted)}

.log-line{font-family:var(--mono);font-size:10.5px;padding:3px 6px;border-left:2px solid var(--border2);margin-bottom:3px;color:var(--muted);word-break:break-word}
.log-line .t{color:#4a5680;margin-right:6px}
.log-line.ok{border-color:var(--grn);color:#b8ffd9}
.log-line.err{border-color:var(--red);color:#ffb8c4}
.log-line.warn{border-color:var(--amb);color:#ffe0b0}
.log-line.info{border-color:var(--neon)}
#sbBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;backdrop-filter:blur(2px)}

/* ---------- CANVAS ---------- */
#viewport{flex:1;position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(circle,rgba(0,229,255,.13) 1px,transparent 1.4px),radial-gradient(circle,rgba(139,92,246,.07) 1px,transparent 1.4px);background-size:26px 26px,130px 130px;background-position:0 0;touch-action:none;cursor:default}
#viewport.nogrid{background-image:none}
#viewport.panmode{cursor:grab}
#viewport.panmode:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;width:0;height:0}
#edgesSvg{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px}

.edge-glow{fill:none;stroke:currentColor;stroke-width:7;opacity:.22;pointer-events:none}
.edge-flow{fill:none;stroke:#eaffff;stroke-width:1.2;stroke-dasharray:3 15;stroke-linecap:round;opacity:0;pointer-events:none}
.edge-vis{fill:none;stroke:currentColor;stroke-width:2.4;pointer-events:none}
.edge-hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.edge.t-audio{color:#19d7ff}
.edge.t-text{color:#ffb020}
body.pipe-run .edge-flow{opacity:.85;animation:flowMove .9s linear infinite}
body.pipe-run .edge-vis{filter:drop-shadow(0 0 4px currentColor)}
@keyframes flowMove{to{stroke-dashoffset:-18}}
g.edge.selected .edge-vis{stroke-width:3.3;stroke-dasharray:9 6;animation:dashMove .6s linear infinite}
g.edge.selected .edge-glow{opacity:.5}
@keyframes dashMove{to{stroke-dashoffset:-15}}
#tempPath{fill:none;stroke:var(--mag);stroke-width:2.2;stroke-dasharray:6 5;filter:drop-shadow(0 0 5px var(--mag));pointer-events:none;animation:dashMove .5s linear infinite}

.node{position:absolute;width:212px;background:linear-gradient(180deg,#111a34,#0c1226);border:1px solid var(--border2);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.5);cursor:grab;transition:box-shadow .15s;overflow:visible;touch-action:none;-webkit-touch-callout:none}
.node:hover{border-color:#35478a}
.node:active{cursor:grabbing}
.node.selected{border-color:var(--nc,var(--neon));box-shadow:0 0 0 1px var(--nc,var(--neon)),0 0 22px rgba(0,229,255,.25),0 8px 28px rgba(0,0,0,.55)}
.nhead{display:flex;align-items:center;gap:7px;padding:9px 9px 7px;border-bottom:1px solid rgba(255,255,255,.05)}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--nc);box-shadow:0 0 9px var(--nc);flex:none}
.ntitle{font-size:12.5px;font-weight:600;letter-spacing:.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nled{width:7px;height:7px;border-radius:50%;background:#26315a;flex:none;transition:.3s}
.nled.on{background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulseHex 1.2s ease-in-out infinite}
.nled.err{background:var(--red);box-shadow:0 0 8px var(--red)}
.ngear,.ndel{width:22px;height:22px;border-radius:6px;color:#54628f;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s}
.ngear:hover{background:rgba(0,229,255,.12);color:var(--neon)}
.ndel{font-size:10px}
.ndel:hover{background:rgba(255,59,92,.15);color:var(--red)}
@media (hover:none){.ngear{color:#8a97c9}.ndel{color:#a26a7c}}
.nsub{padding:5px 11px 2px;font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ports{padding:9px 0 10px}
.prow{display:flex;justify-content:space-between;align-items:center;min-height:24px}

.port{display:flex;align-items:center;gap:7px;padding:3px 10px;cursor:crosshair;touch-action:none}
.port em{font-style:normal;font-size:9.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.3px}
.port i{width:15px;height:15px;border-radius:50%;background:#05080f;border:2px solid var(--pc,#00e5ff);box-shadow:0 0 9px rgba(0,229,255,.45);box-shadow:0 0 9px color-mix(in srgb,var(--pc,#00e5ff) 55%,transparent);position:relative;flex:none;transition:transform .13s,box-shadow .13s}
.port i::after{content:'';position:absolute;inset:3.5px;border-radius:50%;background:var(--pc,#00e5ff);box-shadow:0 0 6px var(--pc,#00e5ff)}
.port i::before{content:'';position:absolute;top:50%;width:9px;height:2px;transform:translateY(-50%);opacity:.55}
.port[data-type="audio"]{--pc:#00e5ff}
.port[data-type="text"]{--pc:#ffb020}
.port.p-in{padding-left:2px}
.port.p-in i{margin-left:-11px}
.port.p-in i::before{left:100%;background:linear-gradient(90deg,var(--pc),transparent)}
.port.p-out{padding-right:2px}
.port.p-out i{margin-right:-11px}
.port.p-out i::before{right:100%;background:linear-gradient(270deg,var(--pc),transparent)}
.port:hover i,.port.linkable i{transform:scale(1.3);box-shadow:0 0 16px var(--pc,#00e5ff)}
.tpreview{margin:2px 10px 10px;background:#070b16;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-family:var(--mono);font-size:10px;line-height:1.55;color:#9fe8c8;height:70px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent);word-break:break-word;white-space:pre-wrap}
#marquee{position:absolute;border:1px solid var(--neon);background:rgba(0,229,255,.07);display:none;pointer-events:none;z-index:5;box-shadow:0 0 12px rgba(0,229,255,.2) inset}
#emptyHint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:1}
#emptyHint>div{text-align:center;color:var(--muted);font-size:14px;line-height:2}
#emptyHint .big{font-family:var(--disp);font-size:18px;color:#3d4c80;letter-spacing:2px}

#delFab{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:24px;background:rgba(24,10,18,.92);border:1px solid rgba(255,59,92,.6);color:#ffc2cd;font-size:12.5px;box-shadow:0 0 20px rgba(255,59,92,.3),0 8px 22px rgba(0,0,0,.5);backdrop-filter:blur(6px);animation:fabIn .18s ease;white-space:nowrap}
#delFab:hover{background:rgba(255,59,92,.2)}
#delFab .cnt{background:var(--red);color:#fff;border-radius:10px;padding:1px 8px;font-family:var(--mono);font-size:11px}
@keyframes fabIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

@media (pointer:coarse){
  .edge-hit{stroke-width:36}
  .port{padding-top:6px;padding-bottom:6px}
  .port i{width:18px;height:18px}
  .port.p-in i{margin-left:-12px}
  .port.p-out i{margin-right:-12px}
  .ngear,.ndel{width:28px;height:28px;font-size:14px}
}

/* ---------- STATUSBAR ---------- */
#statusbar{height:30px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--bg2);border-top:1px solid var(--border);font-family:var(--mono);font-size:10.5px;color:var(--muted);z-index:30;position:relative}
#statusbar::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,46,196,.3),var(--neon-dim),transparent)}
.sb-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;border:1px solid var(--border2);white-space:nowrap}
.sb-pill .d{width:7px;height:7px;border-radius:50%;background:#3a4670}
.sb-pill.on{border-color:rgba(34,255,136,.5);color:#b8ffd9}
.sb-pill.on .d{background:var(--grn);box-shadow:0 0 7px var(--grn);animation:pulseHex 1.4s infinite}
.sb-pill.err{border-color:rgba(255,59,92,.5);color:#ffb8c4}
.sb-pill.err .d{background:var(--red);box-shadow:0 0 7px var(--red)}
#sbVu{width:110px;height:7px;background:#0a0f1d;border:1px solid var(--border);border-radius:5px;overflow:hidden;flex:none}
#vuFill{height:100%;width:0%;background:linear-gradient(90deg,var(--grn),var(--amb),var(--red));box-shadow:0 0 8px rgba(34,255,136,.5);transition:width .06s linear}
#sbMsg{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-right{display:flex;gap:14px;white-space:nowrap}

/* ---------- MODAL ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(4,6,14,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:var(--mw,560px);max-height:calc(100dvh - 60px);background:linear-gradient(180deg,#101832,#0b1122);border:1px solid var(--border2);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 40px rgba(0,229,255,.07);animation:modalIn .18s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.modal.fs{max-width:none;width:100%;height:100%;max-height:none;border-radius:0}
.mhead{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--border);flex:none;background:rgba(0,229,255,.03)}
.mtitle{font-family:var(--disp);font-size:13px;letter-spacing:1.5px;color:var(--neon);text-shadow:0 0 12px var(--neon-dim);flex:1;text-transform:uppercase}
.mbtn{width:30px;height:30px;border-radius:7px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;transition:.15s}
.mbtn:hover{background:rgba(0,229,255,.1);color:var(--neon)}
.mbtn.mx:hover{background:rgba(255,59,92,.12);color:var(--red)}
.mbody{padding:16px;overflow-y:auto;flex:1;min-height:0}
.mfoot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex:none}
.f-row{margin-bottom:13px}
.f-row label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-family:var(--mono);letter-spacing:.5px}
.qa-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:.12s}
.qa-item:hover{background:var(--panel2);border-color:var(--border2)}
.tlog{font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.tlog .tl-t{color:#4a5680;margin-right:8px;font-size:10px}
.tlog .tl-x{color:#c5ffe0}

/* ---------- TOAST / CTX ---------- */
#toasts{position:fixed;right:16px;bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:1300;max-width:min(360px,86vw)}
.toast{padding:11px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--border2);font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastIn .2s ease;display:flex;gap:9px;align-items:center}

/* ================= ЗАГРУЗКА SIP.JS (мульти-CDN, лениво) ================= */
let sipLibPromise = null;
function loadScriptOnce(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error('не загрузился ' + src));
    document.head.appendChild(s);
  });
}
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('таймаут загрузки')), ms))]);
}
function ensureSipLib() {
  if (window.SIP && window.SIP.UserAgent) return Promise.resolve(window.SIP);
  if (sipLibPromise) return sipLibPromise;
  sipLibPromise = (async () => {
    appendLog('info', 'Загрузка библиотеки sip.js…');
    const esmUrls = [
      'https://cdn.jsdelivr.net/npm/sip.js@0.21.2/+esm',
      'https://esm.run/sip.js@0.21.2',
      'https://esm.sh/sip.js@0.21.2'
    ];
    for (const u of esmUrls) {
      try {
        const mod = await withTimeout(import(u), 25000);
        const ns = (mod && mod.default && mod.default.UserAgent) ? mod.default : mod;
        if (ns && ns.UserAgent && ns.Inviter && ns.Registerer) {
          window.SIP = ns;
          appendLog('ok', 'sip.js загружен (' + u.replace(/^https:\/\//, '') + ')');
          return ns;
        }
      } catch (e) { /* пробуем следующий CDN */ }
    }
    try {
      await withTimeout(loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/sip.js/0.21.2/sip.min.js'), 25000);
      if (window.SIP && window.SIP.UserAgent) {
        appendLog('ok', 'sip.js загружен (cdnjs)');
        return window.SIP;
      }
    } catch (e) { /* всё плохо */ }
    sipLibPromise = null;
    throw new Error('Не удалось загрузить sip.js ни с одного CDN. Проверьте доступ в интернет / блокировщик и повторите.');
  })();
  return sipLibPromise;
}

/* ================= INDEXEDDB ================= */
const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const q = indexedDB.open('neonflow-db', 1);
      q.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' }); };
      q.onsuccess = e => { IDB.db = e.target.result; res(); };
      q.onerror = () => rej(q.error);
    });
  },
  store(mode) { return IDB.db.transaction('projects', mode).objectStore('projects'); },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  put(p) { return IDB.req(IDB.store('readwrite').put(p)); },
  get(id) { return IDB.req(IDB.store('readonly').get(id)); },
  del(id) { return IDB.req(IDB.store('readwrite').delete(id)); },
  all() { return IDB.req(IDB.store('readonly').getAll()); }
};

/* ================= СОСТОЯНИЕ ================= */
let nodes = new Map(), edges = new Map();
let nodeEls = new Map(), edgeEls = new Map();
let selectedNodes = new Set(), selectedEdges = new Set();
let project = { id: null, name: 'Новый проект' };
let view = { x: 60, y: 60, s: 1 };
let dirty = false, lastSavedAt = null;
let panTool = false, spaceDown = false;
let pendingLink = null;
let sidebarVisible = true;
const viewport = $('#viewport'), world = $('#world'), edgesSvg = $('#edgesSvg'), tempPath = $('#tempPath');
const SVG_NS = 'http://www.w3.org/2000/svg';

/* ================= ХОЛСТ / ТРАНСФОРМ ================= */
function applyView() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  const gs = 26 * view.s;
  viewport.style.backgroundSize = `${gs}px ${gs}px, ${gs * 5}px ${gs * 5}px`;
  viewport.style.backgroundPosition = `${view.x}px ${view.y}px, ${view.x}px ${view.y}px`;
  $('#zoomLabel').textContent = Math.round(view.s * 100) + '%';
}
function clientToWorld(cx, cy) {
  const r = viewport.getBoundingClientRect();
  return { x: (cx - r.left - view.x) / view.s, y: (cy - r.top - view.y) / view.s };
}
function zoomAt(cx, cy, factor) {
  const ns = clamp(view.s * factor, 0.08, 4);
  const r = viewport.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  view.x = px - (px - view.x) * (ns / view.s);
  view.y = py - (py - view.y) * (ns / view.s);
  view.s = ns;
  applyView();
}
function nodesBounds(list) {
  if (!list.length) return null;
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  for (const n of list) {
    const el = nodeEls.get(n.id);
    const w = el ? el.offsetWidth : 212, h = el ? el.offsetHeight : 80;
    x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
    x2 = Math.max(x2, n.x + w); y2 = Math.max(y2, n.y + h);
  }
  return { x1, y1, x2, y2 };
}
function fitBounds(b, mode) {
  if (!b) return;
  const r = viewport.getBoundingClientRect();
  const w = b.x2 - b.x1, h = b.y2 - b.y1, pad = 70;
  let s;
  if (mode === 'w') s = r.width / (w + pad * 2);
  else if (mode === 'h') s = r.height / (h + pad * 2);
  else s = Math.min(r.width / (w + pad * 2), r.height / (h + pad * 2));
  s = clamp(s, 0.08, mode === 'all' || mode === 'sel' ? 2 : 4);
  view.s = s;
  view.x = (r.width - w * s) / 2 - b.x1 * s;
  view.y = (r.height - h * s) / 2 - b.y1 * s;
  applyView();
}
function fitAll() { const b = nodesBounds([...nodes.values()]); if (b) fitBounds(b, 'all'); }
function fitSelection() {
  const sel = [...selectedNodes].map(id => nodes.get(id)).filter(Boolean);
  const b = nodesBounds(sel.length ? sel : [...nodes.values()]);
  if (b) fitBounds(b, sel.length ? 'sel' : 'all');
}
function fit100() {
  const r = viewport.getBoundingClientRect();
  const cw = (r.width / 2 - view.x) / view.s, ch = (r.height / 2 - view.y) / view.s;
  view.s = 1; view.x = r.width / 2 - cw; view.y = r.height / 2 - ch; applyView();
}

/* ================= ВЫДЕЛЕНИЕ + FAB УДАЛЕНИЯ ================= */
function updateDelFab() {
  const n = selectedNodes.size + selectedEdges.size;
  const fab = $('#delFab');
  fab.hidden = n === 0;
  fab.querySelector('.cnt').textContent = n;
}
$('#delFab').addEventListener('click', () => deleteSelection());

function selectNode(id, additive) {
  if (!additive) clearSelection();
  selectedNodes.add(id);
  nodeEls.get(id)?.classList.add('selected');
  updateSbMsg(); updateDelFab();
}
function selectEdge(id, additive) {
  if (!additive) clearSelection();
  selectedEdges.add(id);
  edgeEls.get(id)?.classList.add('selected');
  updateSbMsg(); updateDelFab();
}
function clearSelection() {
  selectedNodes.forEach(id => nodeEls.get(id)?.classList.remove('selected'));
  selectedEdges.forEach(id => edgeEls.get(id)?.classList.remove('selected'));
  selectedNodes.clear(); selectedEdges.clear();
  updateSbMsg(); updateDelFab();
}
function deleteSelection() {
  const had = selectedNodes.size + selectedEdges.size;

  [...selectedNodes].forEach(removeNode);

}
function updateSbMsg() {

}
function setSbMsg(t) { $('#sbMsg').textContent = t; }

/* ================= УЗЛЫ ================= */
function nodeSummary(n) {

    case 'mic': return 'локальный аудиовход';
    case 'tone': return `${p.freq} Гц · ${p.wave}`;

}
function createNodeEl(node) {
  const t = NODE_TYPES[node.type];

  el.querySelector('.nsub').textContent = nodeSummary(node);
  const gear = el.querySelector('.ngear');

  });
  el.addEventListener('pointerdown', e => onNodePointerDown(e, node));
  el.addEventListener('dblclick', e => {

}
function nodeCtxItems(node) {
  return [
    { label: '⚙ Настройки', fn: () => openNodeSettings(node) },
    { label: node.type === 'transcript' ? '📝 Открыть транскрипт' : '⧉ Дублировать',
      fn: () => node.type === 'transcript' ? openTranscriptModal(node) : duplicateNode(node) },
    { sep: true },

}
function updateNodeSummary(node) {
  const el = nodeEls.get(node.id);
  if (el) el.querySelector('.nsub').textContent = nodeSummary(node);
}
function addNode(type, x, y, params) {
  const t = NODE_TYPES[type];
  if (!t) return null;
  const node = { id: uid(), type, x: Math.round(x), y: Math.round(y), params: { ...t.defParams, ...(params || {}) } };
  if (type === 'transcript') node.lines = [];
  nodes.set(node.id, node);
  createNodeEl(node);
  markDirty();
  return node;
}
function removeNode(id) {
  for (const [eid, e] of [...edges]) if (e.from.n === id || e.to.n === id) removeEdge(eid);
  const el = nodeEls.get(id);
  if (el) el.remove();
  nodeEls.delete(id);
  nodes.delete(id);
  selectedNodes.delete(id);
  updateEmptyHint(); updateDelFab();
}
function duplicateNode(node) {
  const c = addNode(node.type, node.x + 30, node.y + 30, JSON.parse(JSON.stringify(node.params)));
  if (c) { clearSelection(); selectNode(c.id, false); toast('Блок продублирован', 'ok', 1500); }
}
function updateEmptyHint() { $('#emptyHint').style.display = nodes.size === 0 ? 'flex' : 'none'; $('#sbNodes').textContent = nodes.size + ' блоков'; }

/* ================= РЁБРА ================= */
function portPos(node, portId, dir) {
  const el = nodeEls.get(node.id);
  const pe = el.querySelector(`.port[data-id="${portId}"][data-dir="${dir}"]`);
  if (!pe) return { x: node.x, y: node.y };
  const nr = el.getBoundingClientRect(), pr = pe.getBoundingClientRect();
  return { x: node.x + (pr.left + pr.width / 2 - nr.left) / view.s, y: node.y + (pr.top + pr.height / 2 - nr.top) / view.s };
}
function edgePathD(p1, p2) {
  const dx = Math.max(46, Math.abs(p2.x - p1.x) * 0.5);
  return `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`;
}
function createEdgeEl(edge) {
  const g = document.createElementNS(SVG_NS, 'g');
  g.classList.add('edge', 't-' + edge.type);
  g.dataset.id = edge.id;
  const glow = document.createElementNS(SVG_NS, 'path'); glow.setAttribute('class', 'edge-glow');
  const flow = document.createElementNS(SVG_NS, 'path'); flow.setAttribute('class', 'edge-flow');
  const vis = document.createElementNS(SVG_NS, 'path'); vis.setAttribute('class', 'edge-vis');
  const hit = document.createElementNS(SVG_NS, 'path'); hit.setAttribute('class', 'edge-hit');
  g.append(glow, flow, vis, hit);
  hit.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); selectEdge(edge.id, e.shiftKey); });
  hit.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    showCtx(e.clientX, e.clientY, [{ label: '🗑 Удалить соединение', danger: true, fn: () => { removeEdge(edge.id); markDirty(); } }]);
  });
  edgesSvg.appendChild(g);
  edgeEls.set(edge.id, g);
  updateEdge(edge);
}
function updateEdge(edge) {
  const g = edgeEls.get(edge.id);
  if (!g) return;
  const fn = nodes.get(edge.from.n), tn = nodes.get(edge.to.n);
  if (!fn || !tn) return;
  const d = edgePathD(portPos(fn, edge.from.p, 'out'), portPos(tn, edge.to.p, 'in'));
  g.querySelectorAll('path').forEach(p => p.setAttribute('d', d));
}
function updateEdgesForNode(nid) { for (const e of edges.values()) if (e.from.n === nid || e.to.n === nid) updateEdge(e); }
function updateAllEdges() { for (const e of edges.values()) updateEdge(e); }
function addEdge(fromN, fromP, toN, toP, type, silent) {
  for (const [eid, e] of [...edges]) {
    if (e.from.n === fromN && e.from.p === fromP && e.to.n === toN && e.to.p === toP) return null;
    if (e.to.n === toN && e.to.p === toP) removeEdge(eid);
  }
  const edge = { id: uid(), from: { n: fromN, p: fromP }, to: { n: toN, p: toP }, type };
  edges.set(edge.id, edge);
  createEdgeEl(edge);
  if (!silent) { markDirty(); toast('Соединение создано', 'ok', 1200); }
  return edge;
}
function removeEdge(id) {
  const g = edgeEls.get(id);
  if (g) g.remove();
  edgeEls.delete(id);
  edges.delete(id);
  selectedEdges.delete(id);
  updateDelFab();
}

/* ================= ВЗАИМОДЕЙСТВИЕ С ХОЛСТОМ ================= */
const pointers = new Map();
let drag = null, pinch = null;

function cancelLinkVisual() {
  tempPath.style.display = 'none';
  tempPath.setAttribute('d', '');
  $$('.port.linkable').forEach(p => p.classList.remove('linkable'));
  pendingLink = null;
}
function markLinkablePorts(type) {
  $$('.port').forEach(p => { if (p.dataset.type === type) p.classList.add('linkable'); });
}

viewport.addEventListener('pointerdown', e => {
  hideCtx();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { cancelDrag(); startPinch(); return; }
  if (drag) return;
  if (pendingLink) cancelLinkVisual();
  const wantPan = panTool || spaceDown || e.button === 1 || e.pointerType === 'touch';
  if (wantPan) {
    drag = { type: 'pan', sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
    viewport.classList.add('panmode');
  } else if (e.button === 0) {
    drag = { type: 'marquee', sx: e.clientX, sy: e.clientY };
    if (!e.shiftKey) clearSelection();
  }
});
window.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) { updatePinch(); return; }
  if (drag) dragMove(e);
  if (pendingLink) {
    const w = clientToWorld(e.clientX, e.clientY);
    const n0 = nodes.get(pendingLink.node);
    if (n0) {
      const p0 = portPos(n0, pendingLink.port, pendingLink.dir);
      tempPath.setAttribute('d', pendingLink.dir === 'out' ? edgePathD(p0, w) : edgePathD(w, p0));
      tempPath.style.display = '';
    }
  }
});
window.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (pinch && pointers.size < 2) pinch = null;
  if (drag) {
    if (drag.lpTimer) clearTimeout(drag.lpTimer);
    dragUp(e);
    drag = null;
    viewport.classList.remove('panmode');
  }
});
window.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag?.lpTimer) clearTimeout(drag.lpTimer);
  drag = null;
});

function cancelDrag() { if (drag && drag.type === 'marquee') $('#marquee').style.display = 'none'; if (drag?.lpTimer) clearTimeout(drag.lpTimer); drag = null; }
function dragMove(e) {
  if (drag.type === 'pan') {
    view.x = drag.ox + (e.clientX - drag.sx);
    view.y = drag.oy + (e.clientY - drag.sy);
    applyView();
  } else if (drag.type === 'marquee') {
    const r = viewport.getBoundingClientRect();
    const x1 = Math.min(drag.sx, e.clientX) - r.left, y1 = Math.min(drag.sy, e.clientY) - r.top;
    const x2 = Math.max(drag.sx, e.clientX) - r.left, y2 = Math.max(drag.sy, e.clientY) - r.top;
    const m = $('#marquee');
    m.style.display = 'block';
    m.style.left = x1 + 'px'; m.style.top = y1 + 'px';
    m.style.width = (x2 - x1) + 'px'; m.style.height = (y2 - y1) + 'px';
    drag.rect = { x1, y1, x2, y2 };
  } else if (drag.type === 'node') {
    const dx = (e.clientX - drag.sx) / view.s, dy = (e.clientY - drag.sy) / view.s;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 9) {
      drag.moved = true;
      if (drag.lpTimer) { clearTimeout(drag.lpTimer); drag.lpTimer = null; }
    }
    if (!drag.moved) return;
    for (const [id, st] of drag.starts) {
      const n = nodes.get(id); if (!n) continue;
      n.x = Math.round(st.x + dx); n.y = Math.round(st.y + dy);
      const el = nodeEls.get(id);
      el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
      updateEdgesForNode(id);
    }
  }
}
function dragUp(e) {
  if (drag.type === 'marquee') {
    $('#marquee').style.display = 'none';
    if (drag.rect) {
      const r = viewport.getBoundingClientRect();
      const w1 = clientToWorld(drag.rect.x1 + r.left, drag.rect.y1 + r.top);
      const w2 = clientToWorld(drag.rect.x2 + r.left, drag.rect.y2 + r.top);
      for (const n of nodes.values()) {
        const el = nodeEls.get(n.id);
        const nw = el.offsetWidth, nh = el.offsetHeight;
        if (n.x < w2.x && n.x + nw > w1.x && n.y < w2.y && n.y + nh > w1.y) selectNode(n.id, true);
      }
    }
  } else if (drag.type === 'node' && drag.moved) markDirty();
}

function onNodePointerDown(e, node) {
  if (e.button === 2) return;
  e.stopPropagation();
  hideCtx();
  if (pendingLink) { cancelLinkVisual(); return; }
  if (e.shiftKey) {
    if (selectedNodes.has(node.id)) { selectedNodes.delete(node.id); nodeEls.get(node.id)?.classList.remove('selected'); updateDelFab(); }
    else selectNode(node.id, true);
    return;
  }
  if (!selectedNodes.has(node.id)) { clearSelection(); selectNode(node.id, false); }
  world.appendChild(nodeEls.get(node.id));
  const starts = new Map();
  selectedNodes.forEach(id => { const n = nodes.get(id); if (n) starts.set(id, { x: n.x, y: n.y }); });
  const evX = e.clientX, evY = e.clientY;
  drag = { type: 'node', sx: evX, sy: evY, starts, moved: false };
  drag.lpTimer = setTimeout(() => {
    if (drag && drag.type === 'node' && !drag.moved) {
      drag.lpFired = true;
      showCtx(evX, evY, nodeCtxItems(node));
    }
  }, 550);
}

/* ---- связи: перетаскивание портов + клик-клик ---- */
function onPortPointerDown(e, node, portEl) {
  e.stopPropagation(); e.preventDefault();
  hideCtx();
  if (e.button !== 0 && e.pointerType !== 'touch') return;
  const dir = portEl.dataset.dir, type = portEl.dataset.type, portId = portEl.dataset.id;
  if (pendingLink) {
    const ok = tryCompleteLink(pendingLink, { node: node.id, port: portId, dir, type });
    if (ok) cancelLinkVisual();
    return;
  }
  const link = { node: node.id, port: portId, dir, type, sx: e.clientX, sy: e.clientY, moved: false };
  markLinkablePorts(type);
  const move = ev => {
    if (Math.hypot(ev.clientX - link.sx, ev.clientY - link.sy) > 5) link.moved = true;
    if (link.moved) {
      const w = clientToWorld(ev.clientX, ev.clientY);
      const p0 = portPos(node, portId, dir);
      tempPath.setAttribute('d', dir === 'out' ? edgePathD(p0, w) : edgePathD(w, p0));
      tempPath.style.display = '';
    }
  };
  const up = ev => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    $$('.port.linkable').forEach(p => p.classList.remove('linkable'));
    if (link.moved) {
      tempPath.style.display = 'none';
      const tgt = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.port');
      if (tgt) {
        const tn = tgt.closest('.node');
        tryCompleteLink(link, { node: tn?.dataset.id, port: tgt.dataset.id, dir: tgt.dataset.dir, type: tgt.dataset.type });
      }
    } else {
      markLinkablePorts(type);
      pendingLink = link;
      const p0 = portPos(node, portId, dir);
      const w = clientToWorld(ev.clientX, ev.clientY);
      tempPath.setAttribute('d', dir === 'out' ? edgePathD(p0, w) : edgePathD(w, p0));
      tempPath.style.display = '';
    }
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}
function tryCompleteLink(a, b) {
  if (!a || !b || !b.node) return false;
  if (a.node === b.node || a.type !== b.type) return false;
  let from, to;
  if (a.dir === 'out' && b.dir === 'in') { from = a; to = b; }
  else if (a.dir === 'in' && b.dir === 'out') { from = b; to = a; }
  else return false;
  addEdge(from.node, from.port, to.node, to.port, a.type);
  return true;
}

/* ---- пинч-зум ---- */
function startPinch() {
  const [p1, p2] = [...pointers.values()];
  pinch = {
    d0: Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1, s0: view.s,
    mid0: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }, x0: view.x, y0: view.y
  };
}
function updatePinch() {
  if (!pinch) return;
  const [p1, p2] = [...pointers.values()];
  const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
  const ns = clamp(pinch.s0 * (d / pinch.d0), 0.08, 4);
  const r = viewport.getBoundingClientRect();
  const wx = (pinch.mid0.x - r.left - pinch.x0) / pinch.s0;
  const wy = (pinch.mid0.y - r.top - pinch.y0) / pinch.s0;
  view.x = mid.x - r.left - wx * ns;
  view.y = mid.y - r.top - wy * ns;
  view.s = ns;
  applyView();
}

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
}, { passive: false });

viewport.addEventListener('dblclick', e => {
  if (e.target.closest('.node')) return;
  const w = clientToWorld(e.clientX, e.clientY);
  openQuickAdd(w.x, w.y);
});
document.addEventListener('pointerdown', e => {
  if (pendingLink && !e.target.closest('.port') && !e.target.closest('#viewport')) cancelLinkVisual();
}, true);

/* ================= КОНТЕКСТНОЕ МЕНЮ ================= */
const ctxMenu = $('#ctxMenu');
function showCtx(x, y, items) {
  ctxMenu.innerHTML = '';
  items.forEach(it => {
    if (it.sep) { const s = document.createElement('div'); s.className = 'msep'; ctxMenu.appendChild(s); return; }
    const b = document.createElement('button');
    b.className = 'mi' + (it.danger ? ' danger' : '');
    b.textContent = it.label;
    b.onclick = () => { hideCtx(); it.fn(); };
    ctxMenu.appendChild(b);
  });
  ctxMenu.hidden = false;
  const r = ctxMenu.getBoundingClientRect();

  ctxMenu.style.top = clamp(y, 8, innerHeight - r.height - 8) + 'px';
}
function hideCtx() { ctxMenu.hidden = true; }
document.addEventListener('pointerdown', e => { if (!ctxMenu.hidden && !ctxMenu.contains(e.target)) hideCtx(); }, true);

/* ================= МОДАЛЬНЫЕ ОКНА ================= */
const modalStack = [];
function openModal({ title, body, footer, width = 560, onMount }) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal" style="--mw:${width}px">
    <div class="mhead"><div class="mtitle">${title}</div>
      <button class="mbtn mfs" title="На весь экран">⛶</button>
      <button class="mbtn mx" title="Закрыть">✕</button>
    </div>
    <div class="mbody"></div>
    ${footer ? '<div class="mfoot"></div>' : ''}
  </div>`;
  const modal = ov.querySelector('.modal');
  const bodyEl = ov.querySelector('.mbody');
  if (typeof body === 'string') bodyEl.innerHTML = body; else if (body) bodyEl.appendChild(body);
  if (footer) { const f = ov.querySelector('.mfoot'); if (typeof footer === 'string') f.innerHTML = footer; else f.appendChild(footer); }
  const api = {
    ov, modal, bodyEl,
    close() { ov.remove(); const i = modalStack.indexOf(api); if (i >= 0) modalStack.splice(i, 1); },
    fs() { modal.classList.toggle('fs'); ov.querySelector('.mfs').textContent = modal.classList.contains('fs') ? '🗗' : '⛶'; }
  };
  ov.querySelector('.mfs').onclick = () => api.fs();
  ov.querySelector('.mx').onclick = () => api.close();
  ov.addEventListener('pointerdown', e => { if (e.target === ov) api.close(); });
  document.body.appendChild(ov);
  modalStack.push(api);
  if (onMount) onMount(api);
  return api;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!ctxMenu.hidden) { hideCtx(); return; }
    if (pendingLink) { cancelLinkVisual(); return; }
    if (modalStack.length) { modalStack[modalStack.length - 1].close(); return; }
    closeMenus();
  }
});

/* ================= НАСТРОЙКИ УЗЛА ================= */
function openNodeSettings(node) {
  const t = NODE_TYPES[node.type];
  const defs = PARAM_DEFS[node.type];
  const body = document.createElement('div');
  if (!defs || !defs.length) {
    body.innerHTML = `<div style="color:var(--muted);padding:10px 0">У блока «${esc(t.name)}» нет настраиваемых параметров.</div>
      ${node.type === 'transcript' ? '<button class="btn neon" id="openTr">📝 Открыть транскрипт</button>' : ''}`;
  } else {
    body.innerHTML = defs.map(d => {
      const v = node.params[d.k] ?? '';
      if (d.t === 'select') {
        return `<div class="f-row"><label>${d.l}</label><select data-k="${d.k}">${d.o.map(o => `<option value="${o}" ${o == v ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
      }
      return `<div class="f-row"><label>${d.l}</label><input data-k="${d.k}" type="${d.t}" ${d.min !== undefined ? `min="${d.min}"` : ''} ${d.max !== undefined ? `max="${d.max}"` : ''} ${d.step !== undefined ? `step="${d.step}"` : ''} value="${esc(v)}" placeholder="${d.ph || ''}"></div>`;
    }).join('');
  }
  const foot = document.createElement('div');
  foot.innerHTML = `<button class="btn" id="mCancel">Отмена</button><button class="btn neon" id="mOk">Применить</button>`;
  const m = openModal({ title: '⚙ ' + t.name, body, footer: foot, width: 480 });
  body.querySelector('#openTr')?.addEventListener('click', () => { m.close(); openTranscriptModal(node); });
  foot.querySelector('#mCancel').onclick = () => m.close();
  foot.querySelector('#mOk').onclick = () => {
    if (defs) defs.forEach(d => {
      const el = body.querySelector(`[data-k="${d.k}"]`);
      if (!el) return;
      node.params[d.k] = d.t === 'number' ? (parseFloat(el.value) || 0) : el.value;
    });
    updateNodeSummary(node);
    markDirty();
    m.close();
    if (pipeline.running) toast('Параметры применятся при следующем запуске', 'info');
  };
}

function openTranscriptModal(node) {
  const body = document.createElement('div');
  body.innerHTML = `<div class="tlog" id="tlogEl"></div>`;
  const foot = document.createElement('div');
  foot.innerHTML = `<button class="btn" id="tClear">Очистить</button><button class="btn" id="tCopy">⧉ Копировать</button>

  const m = openModal({ title: '📝 Транскрипт — прямой эфир', body, footer: foot, width: 640 });
  const logEl = body.querySelector('#tlogEl');
  node._modalLog = logEl;
  node._modalAuto = foot.querySelector('#tAuto');
  const render = () => {
    logEl.innerHTML = (node.lines || []).map(l =>
      `<div><span class="tl-t">[${fmtTime(l.t)}]</span><span class="tl-x">${esc(l.text)}</span></div>`).join('') || '<span style="color:var(--muted)">Пока пусто. Запустите пайплайн и говорите…</span>';
    if (node._modalAuto?.checked) logEl.scrollTop = logEl.scrollHeight;
  };
  render();
  foot.querySelector('#tClear').onclick = () => { node.lines = []; render(); updateNodeSummary(node); };
  foot.querySelector('#tCopy').onclick = () => {
    navigator.clipboard?.writeText((node.lines || []).map(l => `[${fmtTime(l.t)}] ${l.text}`).join('\n'));
    toast('Скопировано в буфер обмена', 'ok', 1500);
  };
  const orig = m.close.bind(m);
  m.close = () => { delete node._modalLog; delete node._modalAuto; orig(); };
}
function pushTranscript(node, text) {
  node.lines = node.lines || [];
  node.lines.push({ t: Date.now(), text });
  if (node.lines.length > 300) node.lines = node.lines.slice(-300);
  updateNodeSummary(node);
  const el = nodeEls.get(node.id);
  const pv = el?.querySelector('.tpreview');
  if (pv) {
    pv.textContent = node.lines.slice(-4).map(l => `▸ ${l.text}`).join('\n');
  }
  if (node._modalLog) {
    const line = document.createElement('div');
    line.innerHTML = `<span class="tl-t">[${fmtTime(Date.now())}]</span><span class="tl-x">${esc(text)}</span>`;
    if (node._modalLog.textContent.startsWith('Пока пусто')) node._modalLog.innerHTML = '';
    node._modalLog.appendChild(line);
    if (node._modalAuto?.checked) node._modalLog.scrollTop = node._modalLog.scrollHeight;
  }
}

/* ================= ПРЕСЕТЫ ПАЙПЛАЙНОВ ================= */
function buildChainNodes(types, y = 230, x0 = 40, gap = 280) {
  const ns = types.map((t, i) => ({ id: uid(), type: t, x: x0 + i * gap, y, params: { ...NODE_TYPES[t].defParams } }));
  ns.forEach(n => { if (n.type === 'transcript') n.lines = []; });
  const es = [];
  for (let i = 0; i < ns.length - 1; i++)
    es.push({ id: uid(), from: { n: ns[i].id, p: 'out' }, to: { n: ns[i + 1].id, p: 'in' }, type: 'audio' });
  return { ns, es };
}
function attachTextSink(srcNode, type, x, y, ns, es) {
  const n = { id: uid(), type, x, y, params: { ...NODE_TYPES[type].defParams } };
  if (type === 'transcript') n.lines = [];
  ns.push(n);
  es.push({ id: uid(), from: { n: srcNode.id, p: 'text' }, to: { n: n.id, p: 'in' }, type: 'text' });
  return n;
}

/* ================= ПРОЕКТЫ: СОХРАНЕНИЕ / ЗАГРУЗКА ================= */
function serializeProject() {
  return {
    app: 'neonflow', version: 1, id: project.id, name: project.name, updatedAt: Date.now(),
    nodes: [...nodes.values()].map(n => ({ id: n.id, type: n.type, x: n.x, y: n.y, params: n.params, ...(n.lines ? { lines: n.lines.slice(-100) } : {}) })),
    edges: [...edges.values()].map(e => ({ id: e.id, from: e.from, to: e.to, type: e.type })),
    viewport: { ...view }
  };
}
function clearCanvas() {
  if (pipeline.running) stopPipeline();
  [...nodes.keys()].forEach(removeNode);
  [...edges.keys()].forEach(removeEdge);
  clearSelection();
}
function loadProjectData(p) {
  clearCanvas();
  project.id = p.id || null;
  project.name = p.name || 'Без имени';
  (p.nodes || []).forEach(raw => {
    if (!NODE_TYPES[raw.type]) return;
    const node = { id: raw.id || uid(), type: raw.type, x: raw.x ?? 100, y: raw.y ?? 100, params: { ...NODE_TYPES[raw.type].defParams, ...(raw.params || {}) } };
    if (raw.lines) node.lines = raw.lines;
    nodes.set(node.id, node);
    createNodeEl(node);
  });
  (p.edges || []).forEach(raw => {
    if (!nodes.has(raw.from.n) || !nodes.has(raw.to.n)) return;
    const edge = { id: raw.id || uid(), from: raw.from, to: raw.to, type: raw.type || 'audio' };
    edges.set(edge.id, edge);
    createEdgeEl(edge);
  });
  if (p.viewport?.s) view = { ...p.viewport }; else view = { x: 60, y: 60, s: 1 };
  $('#projName').value = project.name;
  dirty = false;
  updateSaveInfo();
  applyView();
  requestAnimationFrame(() => { if (!p.viewport?.s) fitAll(); updateAllEdges(); });
  renderProjects();
  setSbMsg('Проект «' + project.name + '» загружен');
  appendLog('info', 'Загружен проект: ' + project.name);
}
function markDirty() { dirty = true; updateSaveInfo(); }
function updateSaveInfo() {
  $('#saveInfo').textContent = dirty ? '● не сохранено' : (lastSavedAt ? '✓ ' + fmtTime(lastSavedAt) : '');
}
async function saveProject(silent = false) {
  if (!project.id) project.id = uid();
  const data = serializeProject();
  try {
    await IDB.put(data);
    localStorage.setItem('nf-last', project.id);
    dirty = false;
    lastSavedAt = Date.now();
    updateSaveInfo();
    if (!silent) toast('💾 Проект сохранён', 'ok', 1600);
    renderProjects();
  } catch (e) { toast('Ошибка сохранения: ' + e, 'err'); }
}
function actionNew() {
  if (dirty && !confirm('Несохранённые изменения будут потеряны. Продолжить?')) return;
  clearCanvas();
  project.id = null;
  project.name = 'Новый проект';
  $('#projName').value = project.name;
  dirty = false;
  updateSaveInfo();
  view = { x: 80, y: 80, s: 1 };
  applyView();
  updateEmptyHint();
  toast('Создан новый проект', 'info', 1500);
}
function exportProject(p) {
  const data = p || serializeProject();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (data.name || 'neonflow').replace(/[^\wа-яё\- ]/gi, '').trim().replace(/\s+/g, '_') + '.neonflow.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  appendLog('ok', 'Экспортирован проект: ' + (data.name || '?'));
  toast('⤒ Проект экспортирован в JSON', 'ok');
}
function importFromFile(file) {
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const data = JSON.parse(rd.result);
      if (!Array.isArray(data.nodes)) throw new Error('неверный формат');
      const p = { id: uid(), name: data.name || file.name.replace(/\.neonflow\.json$|\.json$/i, ''), nodes: data.nodes, edges: data.edges || [], updatedAt: Date.now() };
      await IDB.put(p);
      loadProjectData(p);
      toast('⤓ Проект импортирован', 'ok');
    } catch (e) { toast('Ошибка импорта: ' + e.message, 'err'); }
  };
  rd.readAsText(file);
}
$('#fileInput').addEventListener('change', e => { if (e.target.files[0]) importFromFile(e.target.files[0]); e.target.value = ''; });

let dragCnt = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); dragCnt++; $('#dropZone').style.display = 'flex'; });
window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragCnt <= 0) { dragCnt = 0; $('#dropZone').style.display = 'none'; } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  dragCnt = 0; $('#dropZone').style.display = 'none';
  const f = e.dataTransfer.files?.[0];
  if (f && /\.json$/i.test(f.name)) importFromFile(f);
});

/* ================= ДВИЖОК ПАЙПЛАЙНА ================= */
const WORKER_SRC = `
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
env.allowLocalModels = false;
const pipes = new Map();
self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.type === 'load') {
      if (!pipes.has(m.model)) {
        const p = await pipeline('automatic-speech-recognition', m.model, {
          quantized: true,
          progress_callback: (pr) => {
            if (pr.status === 'progress') self.postMessage({ type: 'progress', model: m.model, file: pr.file || '', progress: pr.progress || 0 });
          }
        });
        pipes.set(m.model, p);
      }
      self.postMessage({ type: 'ready', model: m.model });
    } else if (m.type === 'run') {
      const p = pipes.get(m.model);
      if (!p) throw new Error('модель не загружена: ' + m.model);
      const opts = { task: 'transcribe' };
      if (m.language && m.language !== 'auto') opts.language = m.language;
      const out = await p(m.audio, opts);
      self.postMessage({ type: 'result', id: m.id, text: out.text || '' });
    }
  } catch (err) {
    self.postMessage({ type: 'error', id: m.id, model: m.model, message: String(err && err.message || err) });
  }
};
`;
let asrWorker = null;
const workerBusy = { v: false };
const readyModels = new Set(), loadingModels = new Set();
function ensureWorker() {
  if (asrWorker) return asrWorker;
  asrWorker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })), { type: 'module' });
  asrWorker.onmessage = onWorkerMsg;
  return asrWorker;
}
function ensureModel(model) {
  ensureWorker();
  if (readyModels.has(model) || loadingModels.has(model)) return;
  loadingModels.add(model);
  asrWorker.postMessage({ type: 'load', model });
  appendLog('info', 'Загрузка модели ' + model + '…');
}
function onWorkerMsg(e) {
  const m = e.data;
  if (m.type === 'progress') {
    $('#modelStatus').textContent = `⬇ ${m.model.split('/')[1]}: ${Math.round(m.progress)}%`;
  } else if (m.type === 'ready') {
    loadingModels.delete(m.model);
    readyModels.add(m.model);
    $('#modelStatus').textContent = '✓ модель ' + m.model.split('/')[1] + ' готова';
    appendLog('ok', 'Модель готова: ' + m.model);
    toast('Модель ' + m.model + ' готова к работе', 'ok');
    pumpQueue();
  } else if (m.type === 'result') {
    workerBusy.v = false;
    const rt = pipeline.asrRts.find(r => r.node.id === m.id);
    if (rt) rt.onResult(m.text);
    pumpQueue();
  } else if (m.type === 'error') {
    workerBusy.v = false;
    if (m.model) loadingModels.delete(m.model);
    appendLog('err', 'ASR ошибка: ' + m.message);
    toast('ASR: ' + m.message, 'err', 5000);
    pumpQueue();
  }
}
let asrJobQueue = [];
function pumpQueue() {
  if (workerBusy.v || !asrJobQueue.length) return;
  const job = asrJobQueue.shift();
  if (!readyModels.has(job.model)) { asrJobQueue.unshift(job); return; }
  workerBusy.v = true;
  try { asrWorker.postMessage(job.msg, [job.msg.audio.buffer]); }
  catch (e) { workerBusy.v = false; }
}

function rmsDb(b) {
  let s = 0;
  for (let i = 0; i < b.length; i++) s += b[i] * b[i];
  return 20 * Math.log10(Math.sqrt(s / Math.max(1, b.length)) + 1e-7);
}
function bufIsFinite(b) {
  for (let i = 0; i < b.length; i += 257) if (!isFinite(b[i])) return false;
  return true;
}

const pipeline = { running: false, ctx: null, sp: null, mute: null, sourceCtl: null, chain: [], asrRts: [], level: 0, srcLabel: '' };

function buildChain() {
  const sources = [...nodes.values()].filter(n => NODE_TYPES[n.type].cat === 'sources');
  if (!sources.length) throw new Error('Добавьте источник аудио (микрофон, тон или SIP-транк)');
  if (sources.length > 1) toast('Несколько источников — используется первый', 'warn');
  const src = sources[0];
  const order = [], seen = new Set(), q = [src.id];
  while (q.length) {
    const id = q.shift();
    if (seen.has(id)) continue;
    seen.add(id);
    order.push(id);
    for (const e of edges.values()) if (e.from.n === id && nodes.has(e.to.n)) q.push(e.to.n);
  }
  const dsp = order.map(id => nodes.get(id)).filter(n => NODE_TYPES[n.type].cat === 'dsp');
  const asrs = order.map(id => nodes.get(id)).filter(n => n.type === 'asr');
  const outs = order.map(id => nodes.get(id)).filter(n => NODE_TYPES[n.type].cat === 'out');
  return { src, dsp, asrs, outs };
}

function makeDspRuntime(node) {
  const p = node.params, sr = pipeline.ctx.sampleRate;
  switch (node.type) {
    case 'gain': {
      const g = Math.pow(10, (p.db || 0) / 20);
      return { node, process(b) { for (let i = 0; i < b.length; i++) b[i] *= g; return b; } };
    }
    case 'gate': {
      const thr = p.threshold ?? -45; let env = 0;
      return { node, process(b) {
        const db = rmsDb(b);
        env = env * 0.7 + (db > thr ? 1 : 0) * 0.3;
        if (env < 0.02) b.fill(0); else if (env < 0.99) for (let i = 0; i < b.length; i++) b[i] *= env;
        return b;
      } };
    }
    case 'filter': {
      const hp = clamp(p.hp || 300, 20, 8000), lp = clamp(p.lp || 3400, 100, 20000);
      const aH = (1 / (2 * Math.PI * hp)) / ((1 / (2 * Math.PI * hp)) + 1 / sr);
      const aL = 1 - Math.exp(-2 * Math.PI * lp / sr);
      let x1 = 0, yH = 0, yL = 0;
      return { node, process(b) {
        if (!isFinite(yL) || !isFinite(yH) || !isFinite(x1)) { x1 = 0; yH = 0; yL = 0; }
        for (let i = 0; i < b.length; i++) {
          const x = isFinite(b[i]) ? b[i] : 0;
          yH = aH * (yH + x - x1); x1 = x;
          yL += aL * (yH - yL);
          b[i] = yL;
        }
        if (!isFinite(yL)) { x1 = 0; yH = 0; yL = 0; }
        return b;
      } };
    }
    case 'vad': {
      const thr = p.threshold ?? -40;
      return { node, process(b, meta) { if (rmsDb(b) < thr) meta.silent = true; return b; } };
    }
  }
  return null;
}

function makeAsrRuntime(node) {
  const p = node.params;
  const srIn = pipeline.ctx.sampleRate;
  const winSamples = Math.round(clamp(p.window || 4, 2, 15) * 16000);
  const strideSamples = Math.round(clamp(p.stride || 2, 0.5, (p.window || 4) - 0.5) * 16000);
  const silenceDb = p.silenceDb ?? -48;
  const rt = {
    node, model: p.model, lang: p.language || 'ru',
    chunks: [], total: 0, phase: 0,
    append(buf) { this.chunks.push(buf); this.total += buf.length; },
    readFront(n) {
      const out = new Float32Array(n); let off = 0;
      while (off < n && this.chunks.length) {
        const c = this.chunks[0];
        const take = Math.min(c.length, n - off);
        out.set(c.subarray(0, take), off);
        off += take;
        if (take === c.length) this.chunks.shift();
        else this.chunks[0] = c.subarray(take);
      }
      this.total -= n;
      return out;
    },
    discard(n) {
      let left = n;
      while (left > 0 && this.chunks.length) {
        const c = this.chunks[0];
        if (c.length <= left) { left -= c.length; this.total -= c.length; this.chunks.shift(); }
        else { this.chunks[0] = c.subarray(left); this.total -= left; left = 0; }
      }
    },
    push(b) {
      if (!b.length) return;
      const ratio = srIn / 16000;
      const est = Math.ceil(b.length / ratio) + 2;
      const out = new Float32Array(est);
      let cnt = 0, t = this.phase;
      while (t < b.length - 1) {
        const i = Math.floor(t), f = t - i;
        const v = b[i] * (1 - f) + b[i + 1] * f;
        out[cnt++] = isFinite(v) ? v : 0;
        t += ratio;
      }
      this.phase = Math.max(0, t - b.length);
      this.append(out.subarray(0, cnt).slice());
      while (this.total >= winSamples) {
        const w = this.readFront(winSamples);
        this.discard(winSamples - strideSamples);
        this.dispatch(w);
      }
    },
    dispatch(w) {
      if (!bufIsFinite(w)) return;
      const db = rmsDb(w);
      if (!isFinite(db) || db < silenceDb) return;
      asrJobQueue.push({ model: this.model, msg: { type: 'run', id: node.id, model: this.model, audio: w, language: this.lang } });
      if (asrJobQueue.length > 6) asrJobQueue.splice(0, asrJobQueue.length - 6);
      pumpQueue();
    },
    onResult(text) {
      const clean = (text || '').trim();
      setLed(node.id, 'on');
      if (!clean) return;
      if (node._lastText === clean) return;
      if (/^[\s.!?,;:…—\-_*#()«»"]+$/.test(clean)) return;
      node._lastText = clean;
      onAsrText(node, clean);
    }
  };
  return rt;
}
function setLed(nid, cls) { const el = nodeEls.get(nid); if (el) el.querySelector('.nled').className = 'nled ' + cls; }

function onAsrText(asrNode, text) {
  appendLog('ok', '🎙 ' + text);
  for (const e of edges.values()) {
    if (e.from.n !== asrNode.id || e.type !== 'text') continue;
    const target = nodes.get(e.to.n);
    if (!target) continue;
    if (target.type === 'transcript') pushTranscript(target, text);
    else if (target.type === 'logger') appendLog('info', '📋 ' + text);
    else if (target.type === 'ws') wsSend(target, text);
  }
}
const wsSockets = new Map();
function wsSend(node, text) {
  const url = node.params.url;
  if (!url) return;
  try {
    let s = wsSockets.get(node.id);
    if (!s || s.readyState > 1) {
      s = new WebSocket(url);
      wsSockets.set(node.id, s);
      s.onopen = () => { appendLog('ok', 'WebSocket подключен: ' + url); setLed(node.id, 'on'); };
      s.onerror = () => appendLog('err', 'WebSocket ошибка: ' + url);
    }
    if (s.readyState === 1) s.send(JSON.stringify({ t: Date.now(), text }));
  } catch (e) { appendLog('err', 'WS: ' + e.message); }
}

function connectScript(srcNode) {
  const ctx = pipeline.ctx;
  const sp = ctx.createScriptProcessor(4096, 1, 1);
  const mute = ctx.createGain();
  mute.gain.value = 0;
  srcNode.connect(sp);
  sp.connect(mute);
  mute.connect(ctx.destination);
  sp.onaudioprocess = e => pump(e.inputBuffer.getChannelData(0));
  pipeline.sp = sp; pipeline.mute = mute;
  return sp;
}
function pump(raw) {
  if (!pipeline.running) return;
  let b = raw.slice(0);
  const meta = { silent: false };
  for (const rt of pipeline.chain) { try { b = rt.process(b, meta) || b; } catch (e) {} }
  if (!bufIsFinite(b)) return;
  let peak = 0;
  for (let i = 0; i < b.length; i += 2) { const a = Math.abs(b[i]); if (a > peak) peak = a; }
  pipeline.level = Math.max(pipeline.level * 0.82, peak);
  for (const rt of pipeline.asrRts) rt.push(b);
}

async function startSource(node) {
  const ctx = pipeline.ctx, p = node.params;
  if (node.type === 'mic') {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    connectScript(ctx.createMediaStreamSource(stream));
    return { label: 'Микрофон', stop() { stream.getTracks().forEach(t => t.stop()); } };
  }
  if (node.type === 'tone') {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = p.wave || 'sine';
    osc.frequency.value = p.freq || 440;
    g.gain.value = clamp(p.level ?? 0.15, 0, 1);
    osc.connect(g);
    connectScript(g);
    osc.start();
    return { label: `Тон ${p.freq} Гц`, stop() { try { osc.stop(); } catch (e) {} } };
  }
  if (node.type === 'sip') {
    const ctl = await startSipSource(p);
    connectScript(ctx.createMediaStreamSource(ctl.stream));
    return { label: `SIP ${p.user}→${p.callee}`, stop: ctl.stop };
  }
  throw new Error('Неизвестный источник');
}

async function startSipSource(p) {
  setSrcStatus('SIP: загрузка sip.js…', '');
  const S = await ensureSipLib();
  const host = (p.server || '').replace(/^wss?:\/\//, '').replace(/[:/].*$/, '') || 'localhost';
  appendLog('info', 'SIP: подключение к ' + p.server);
  setSrcStatus('SIP: подключение…', '');
  const ua = new S.UserAgent({
    uri: S.UserAgent.makeURI(`sip:${p.user}@${host}`),
    transportOptions: { server: p.server },
    authorizationUsername: p.user,
    authorizationPassword: p.password || undefined,
    displayName: p.user,
    userAgentString: 'NeonFlow/1.3',
    reconnectionAttempts: 0,
    logLevel: S.LogLevel ? S.LogLevel.Error : 'error'
  });
  await ua.start();
  const reg = new S.Registerer(ua);
  await new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('таймаут регистрации на АТС')), 15000);
    reg.stateChange.addListener(st => { if (st === S.RegistererState.Registered) { clearTimeout(t); res(); } });
    reg.register().catch(e => { clearTimeout(t); rej(e); });
  });
  appendLog('ok', 'SIP: зарегистрирован на транке как ' + p.user);
  setSrcStatus('SIP: вызов ' + (p.callee || '') + '…', '');
  const inviter = new S.Inviter(ua, S.UserAgent.makeURI(`sip:${p.callee}@${host}`), {
    sessionDescriptionHandlerOptions: { constraints: { audio: true, video: false } }
  });
  await inviter.invite();
  await new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('таймаут дозвона')), 25000);
    inviter.stateChange.addListener(st => {
      if (st === S.SessionState.Established) { clearTimeout(t); res(); }
      if (st === S.SessionState.Terminated) { clearTimeout(t); rej(new Error('вызов отклонён/завершён')); }
    });
  });
  const sdh = inviter.sessionDescriptionHandler;
  let stream = sdh?.remoteMediaStream;
  for (let i = 0; i < 50 && (!stream || !stream.getAudioTracks().length); i++) await new Promise(r => setTimeout(r, 100));
  if (!stream || !stream.getAudioTracks().length) throw new Error('нет аудио-трека в RTP-потоке');
  appendLog('ok', 'SIP: вызов установлен, принимаю RTP-аудио');
  return {
    stream,
    stop() {
      try { inviter.bye(); } catch (e) {}
      try { reg.unregister(); } catch (e) {}
      setTimeout(() => { try { ua.stop(); } catch (e) {} }, 300);
    }
  };
}

function setSrcStatus(txt, cls) {
  const pill = $('#srcStatus');
  pill.className = 'sb-pill ' + (cls || '');
  $('#srcStatusTxt').textContent = txt;
}

const runBtn = $('#runBtn');
async function startPipeline() {
  if (pipeline.running) return;
  runBtn.classList.add('starting');
  runBtn.innerHTML = '⏳ ПОДКЛЮЧЕНИЕ…';
  try {
    const chain = buildChain();
    pipeline.ctx = new (window.AudioContext || window.webkitAudioContext)();
    await pipeline.ctx.resume();
    pipeline.chain = chain.dsp.map(makeDspRuntime).filter(Boolean);
    pipeline.asrRts = chain.asrs.map(makeAsrRuntime);
    if (!pipeline.asrRts.length) toast('В цепи нет блока Whisper ASR — аудио будет идти без распознавания', 'warn', 4000);
    pipeline.asrRts.forEach(rt => ensureModel(rt.model));
    pipeline.sourceCtl = await startSource(chain.src);
    pipeline.running = true;
    pipeline.level = 0;
    setSrcStatus('● ' + pipeline.sourceCtl.label, 'on');
    runBtn.classList.remove('starting');
    runBtn.classList.add('running');
    runBtn.innerHTML = '⏹ СТОП';
    document.body.classList.add('pipe-run');
    [...chain.dsp, ...chain.asrs, ...chain.outs, chain.src].forEach(n => setLed(n.id, 'on'));
    appendLog('ok', '▶ Пайплайн запущен. Источник: ' + pipeline.sourceCtl.label);
    toast('Пайплайн запущен', 'ok', 1800);
    vuLoop();
  } catch (err) {
    runBtn.classList.remove('starting');
    runBtn.innerHTML = '▶ ЗАПУСК';
    appendLog('err', 'Ошибка запуска: ' + (err.message || err));
    toast('Не удалось запустить: ' + (err.message || err), 'err', 6000);
    await stopPipeline(true);
  }
}
async function stopPipeline(silent) {
  pipeline.running = false;
  document.body.classList.remove('pipe-run');
  try { pipeline.sourceCtl?.stop(); } catch (e) {}
  pipeline.sourceCtl = null;
  if (pipeline.sp) { pipeline.sp.onaudioprocess = null; try { pipeline.sp.disconnect(); } catch (e) {} }
  if (pipeline.ctx) { try { await pipeline.ctx.close(); } catch (e) {} }
  pipeline.ctx = null; pipeline.sp = null; pipeline.chain = []; pipeline.asrRts = [];
  asrJobQueue = [];
  runBtn.classList.remove('running', 'starting');
  runBtn.innerHTML = '▶ ЗАПУСК';
  setSrcStatus('Пайплайн остановлен', '');
  $('#vuFill').style.width = '0%';
  $$('.nled').forEach(l => l.className = 'nled');
  if (!silent) appendLog('info', '⏹ Пайплайн остановлен');
}
runBtn.addEventListener('click', () => pipeline.running ? stopPipeline() : startPipeline());

function vuLoop() {
  if (!pipeline.running) return;
  $('#vuFill').style.width = clamp(pipeline.level * 160, 0, 100) + '%';
  pipeline.level *= 0.9;
  requestAnimationFrame(vuLoop);
}

$('#sbBackdrop').onclick = () => toggleSidebar(false);
window.addEventListener('resize', () => { syncSidebarBtn(); updateAllEdges(); });

function closeMenus() { $$('.menu.open').forEach(m => m.classList.remove('open')); }
$$('.menu > .menu-btn').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  const m = b.parentElement;
  const was = m.classList.contains('open');
  closeMenus();
  if (!was) m.classList.add('open');
}));
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });

const ACTIONS = {
  'new': actionNew,
  'open': openProjectsModal,
  'save': () => saveProject(),
  'saveas': openSaveAsModal,
  'presets': openPresetsModal,
  'import': () => $('#fileInput').click(),
  'export': () => exportProject(),
  'fit-all': fitAll,
  'fit-sel': fitSelection,
  'fit-100': fit100,
  'fit-w': () => { const b = nodesBounds([...nodes.values()]); if (b) fitBounds(b, 'w'); },
  'fit-h': () => { const b = nodesBounds([...nodes.values()]); if (b) fitBounds(b, 'h'); },
  'view-grid': () => toggleGrid(),
  'view-sidebar': () => toggleSidebar(),
  'help-about': openAboutModal,
  'help-keys': openKeysModal
};
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  closeMenus();
  const fn = ACTIONS[btn.dataset.action];
  if (fn) fn();
});
$('#zoomIn').onclick = () => { const r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25); };
$('#zoomOut').onclick = () => { const r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 0.8); };
$('#toolSelect').onclick = () => { panTool = false; $('#toolSelect').classList.add('active'); $('#toolPan').classList.remove('active'); viewport.classList.remove('panmode'); };
$('#toolPan').onclick = () => { panTool = true; $('#toolPan').classList.add('active'); $('#toolSelect').classList.remove('active'); viewport.classList.add('panmode'); };
function toggleGrid() { viewport.classList.toggle('nogrid'); $('#gridBtn').classList.toggle('active', !viewport.classList.contains('nogrid')); }
$('#gridBtn').onclick = toggleGrid;
$('#saveBtn').onclick = () => saveProject();
$('#projName').addEventListener('change', e => { project.name = e.target.value.trim() || 'Без имени'; markDirty(); });
$('#projName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

/* сайдбар: вкладки */
$$('.sb-tab').forEach(t => t.addEventListener('click', () => {
  $$('.sb-tab').forEach(x => x.classList.remove('active'));
  $$('.sb-panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('#panel-' + t.dataset.panel).classList.add('active');
  if (t.dataset.panel === 'projects') renderProjects();
}));

/* ================= ГОРЯЧИЕ КЛАВИШИ ================= */
document.addEventListener('keydown', e => {
  const inInput = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.code === 'Space' && !inInput) { spaceDown = true; viewport.classList.add('panmode'); e.preventDefault(); }
  if (inInput) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveProject(); }
  else if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); openProjectsModal(); }
  else if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); actionNew(); }
  else if (mod && e.key.toLowerCase() === 'e') { e.preventDefault(); exportProject(); }
  else if (mod && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    const n = nodes.get([...selectedNodes][0]);
    if (n) duplicateNode(n);
  }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); }
  else if (e.key.toLowerCase() === 'f') fitAll();
  else if (e.key === '0') fit100();
  else if (e.key === '=' || e.key === '+') $('#zoomIn').click();
  else if (e.key === '-' || e.key === '_') $('#zoomOut').click();
  else if (e.key.toLowerCase() === 'v') $('#toolSelect').click();
  else if (e.key.toLowerCase() === 'h') $('#toolPan').click();
});
document.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; if (!panTool) viewport.classList.remove('panmode'); } });

/* ================= ДЕМО-ПРОЕКТ ================= */
function makeDemoProject() {
  const built = PRESETS.find(p => p.id === 'sip-full').build();
  return { name: 'Демо: SIP-транк → Whisper', nodes: built.ns, edges: built.es };
}

/* ================= ИНИЦИАЛИЗАЦИЯ ================= */
async function init() {
  renderPalette();
  renderPresets();
  applyView();
  syncSidebarBtn();
  try { await IDB.open(); } catch (e) { toast('IndexedDB недоступна', 'err'); }
  let last = null;
  try { last = await IDB.get(localStorage.getItem('nf-last')); } catch (e) {}
  if (last && last.nodes) loadProjectData(last);
  else {
    project.id = null;
    loadProjectData(makeDemoProject());
    project.id = null;
    dirty = true;
    updateSaveInfo();
  }
  updateEmptyHint();
  appendLog('info', 'NeonFlow готов. Соберите цепь блоков (или выберите пресет 🧩) и нажмите «ЗАПУСК».');
  appendLog('info', 'Совет: для чистого распознавания зафиксируйте язык в настройках блока Whisper (по умолчанию — русский).');
  setInterval(() => { if (dirty && project.name) saveProject(true); }, 15000);
  window.addEventListener('beforeunload', () => { if (dirty && project.name) saveProject(true); });
}
init();
</script>
</body>
